  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

#bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); border-bottom: 1px solid var(--line); margin-inline: -20px; padding: 8px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

/* layout */
main { display: grid; gap: 20px; min-width: 0; }
.tabp { display: grid; gap: 28px; min-width: 0; align-content: start; }

.rank { font-size: 11px; font-weight: 600; color: var(--slate); }
.num { font-size: 12px; color: var(--muted); }

.row.open > .rh > .rt { font-weight: 600; }

.is-discard > .rh .rt { color: var(--muted); }

.mk:hover { background: var(--wash); color: var(--ink); }
.mk { position: relative; }

.mk.m-hold { color: var(--hold); } .mk.m-discard { color: var(--discard); }

.yes { background: var(--ink); color: var(--paper); }
.later { background: var(--wash); color: var(--ink); }

:root[data-theme="dark"] .sart.sub { color: var(--scd); --art-bg: color-mix(in oklab, var(--sc) 30%, var(--card)); }

.ssel[data-st="building"] { background: var(--wip-bg); color: var(--wip); border-color: transparent; font-weight: 600; }
.ssel[data-st="planned"], .ssel[data-st="placed"] { background: var(--todo-bg); color: var(--ink); border-color: transparent; font-weight: 600; }
.ssel[data-st] { border-radius: 999px; }
.ssel[data-st="done"] + .ic { color: var(--ok); } .ssel[data-st="building"] + .ic { color: var(--wip); }
.ssw > .ic { position: absolute; right: 7px; width: 13px; height: 13px; transform: rotate(90deg); color: var(--muted); pointer-events: none; }
.edit { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.edit .ib { color: var(--muted); }
.cbx { display: inline-grid; place-items: center; width: 36px; min-height: 40px; flex: none; cursor: pointer; }
.cbx input { width: 16px; height: 16px; margin: 0; accent-color: var(--ink); cursor: pointer; }
.box { width: 14px; height: 14px; border: 1.5px solid var(--muted); border-radius: 3px; }
.box.on { background: var(--muted); }
.trow.done .tt, .trow.done .tbc { color: var(--muted); text-decoration: line-through; }
.c2 .clamp { -webkit-line-clamp: 2; }
.c2t { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }

/* text blocks */
.tb { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 9px; align-items: start; min-width: 0; }
.tb.noi { grid-template-columns: minmax(0, 1fr); }
.tb > .icw { margin-top: 2px; }
.tbl { font: 600 12px/1.6 var(--body); color: var(--muted); white-space: nowrap; }
.tbc { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.mor { grid-column: -2; justify-self: start; border: 0; background: none; padding: 2px 0; color: var(--accent); font: 600 12px var(--body); cursor: pointer; }
.tb.why .tbc { color: var(--slate); }
.tb.said .tbl { font: italic 400 26px/0.9 var(--title); color: var(--muted); }
.tb.said .tbc { font: italic 400 17px/1.35 var(--title); color: var(--ink); }
.tb.reply .icw { color: var(--accent); }
.sub { font: 700 12px/1.2 var(--body); color: var(--muted); letter-spacing: 0.02em; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 2px 8px; border: 0; border-radius: 7px; background: var(--wash); color: var(--ink); font: 500 12px/1.5 var(--mono); text-decoration: none; text-align: left; overflow-wrap: anywhere; white-space: normal; }
a.chip, button.chip { cursor: pointer; }
a.chip:hover, button.chip:hover { box-shadow: inset 0 0 0 1px var(--ink); }
.chip.out { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.chip.is-hold { background: var(--hold-bg); color: var(--hold); }
.chip.is-discard { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--discard); }
.chip.has-note::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex: none; }
.chip .gw { width: 12px; height: 12px; }
.chip .lk { font-weight: 500; }

/* folds */
.fold { display: grid; gap: 10px; min-width: 0; align-content: start; }
.fhd { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-width: 0; }
.fh-h { margin: 0; min-width: 0; }
.fh { display: inline-flex; align-items: center; gap: 9px; min-height: 40px; max-width: 100%; padding: 2px 8px 2px 2px; border: 0; border-radius: 10px; background: none; color: var(--ink); font: 700 15px var(--body); text-align: left; cursor: pointer; }
.fh-h .fh { font: inherit; }
.fh:hover { background: var(--wash); }
.fh .chev { color: var(--muted); transition: transform 0.15s; }
.fh[aria-expanded="true"] .chev { transform: rotate(90deg); }
.fold.sub > .fhd .fh { font-size: 13px; font-weight: 600; min-height: 36px; }
.fbody { display: grid; gap: 10px; min-width: 0; }
.groups { display: grid; gap: 2px; min-width: 0; }
.groups > .fold.open { margin-bottom: 10px; }
.track { display: flex; flex-wrap: wrap; gap: 2px; min-width: 0; }
.tk { display: inline-grid; justify-items: center; gap: 1px; min-width: 22px; padding: 4px 2px; border: 0; border-radius: 7px; background: none; color: var(--ink); cursor: pointer; }
.tk:hover { background: var(--wash); }
.tkn { font-size: 10px; color: var(--muted); }

/* filters */
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
.pvsw { display: inline-flex; gap: 6px; margin-right: 8px; }
.stpick { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
.pvsw .tg { display: inline-flex; align-items: center; gap: 7px; }
.pvsw .tg[aria-pressed="true"] .bub { color: inherit; box-shadow: inset 0 0 0 1px currentColor; opacity: 0.85; }
.seg { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); max-width: 100%; }
.seg button { min-height: 32px; padding: 4px 12px; border: 0; border-radius: 999px; background: none; color: var(--muted); font: 600 13px var(--body); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tg { min-height: 34px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink); font: 600 13px var(--body); cursor: pointer; white-space: nowrap; }
.tg[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.selw { position: relative; display: inline-flex; align-items: center; max-width: 100%; }
.selw > .ic { position: absolute; right: 10px; transform: rotate(90deg); color: var(--muted); pointer-events: none; }
.ksel { min-height: 34px; max-width: 100%; padding: 4px 30px 4px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink); font: 600 13px var(--body); -webkit-appearance: none; appearance: none; cursor: pointer; }
.tidy { min-height: 34px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); font: 600 13px var(--body); cursor: pointer; white-space: nowrap; }
.tidy:hover, .tidy:focus-visible { color: var(--ink); border-color: var(--muted); }
.tidy.armed { background: var(--discard); border-color: var(--discard); color: var(--card); }
.tidy:disabled { opacity: 0.45; cursor: default; }
.ver { font: 600 13px var(--mono); color: var(--slate); margin-right: 4px; }
.right { margin-left: auto; }

/* pages */
.pl1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.pl1 .tt { flex: 0 1 auto; font-weight: 600; }
.pmain { display: grid; gap: 6px; min-width: 0; }
.bstrip { display: flex; flex-wrap: wrap; gap: 2px; min-width: 0; }
.bstrip i { display: block; width: 6px; height: 10px; border-radius: 1.5px; background: var(--tc); }
.bstrip i.h { background: var(--hold); }
.bstrip i.x { background: transparent; box-shadow: inset 0 0 0 1px var(--discard); }
.bstrip i.sp { width: 4px; background: transparent; }
.bstrip i.nd { background: var(--ink); }
.bstrip i.nb { background: repeating-linear-gradient(45deg, var(--ink) 0 1.5px, transparent 1.5px 3px); box-shadow: inset 0 0 0 1px var(--ink); }
.bstrip i.np { background: transparent; border: 1px dashed var(--muted); }
.bnotes { display: grid; gap: 6px; }
.sublist { border-radius: 12px; }
.sb { text-decoration: none; }
.nwhat { flex: 1 1 0; font-size: 13px; }

/* ref */
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); font-weight: 600; }
.kv dd { overflow-wrap: anywhere; min-width: 0; }
.tags { font: 500 12px var(--mono); color: var(--muted); }
.ctl .scrl, .ctl .pgl { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; padding: 0 4px; }
.ctl .pgl { display: inline-flex; align-items: center; gap: 6px; }
.ctl .pgl .lk { color: var(--slate); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.sfor { max-width: 260px; font-size: 13px; color: var(--muted); padding: 0 6px; }
.dayhead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.dayline { font: 500 12px/1.5 var(--mono); color: var(--slate); }
.skyw { display: grid; gap: 4px; min-width: 0; }
.sky { position: relative; display: grid; height: 24px; gap: 1px; border-radius: 6px; overflow: hidden; background: var(--card); }
.sky > span { display: block; }
.sky-sun { background: var(--sky-sun); } .sky-part { background: var(--sky-part); } .sky-grey { background: var(--sky-grey); }
.sky-drizzle { background: repeating-linear-gradient(-60deg, var(--sky-rain) 0 1.5px, var(--sky-grey) 1.5px 6px); }
.sky-rain { background: repeating-linear-gradient(-60deg, var(--sky-rain) 0 3px, var(--sky-rain-2) 3px 5px); }
.sky-night { background: var(--sky-night); } .sky-night-cloud { background: var(--sky-night-cloud); }
.sky-night-rain { background: repeating-linear-gradient(-60deg, var(--sky-rain) 0 2px, var(--sky-night-cloud) 2px 6px); }
.sky .sunline { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--ink); opacity: 0.5; }
.hours { position: relative; height: 14px; font: 500 10px/14px var(--mono); color: var(--muted); }
.hours span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.hours span:first-child { transform: none; } .hours span:last-child { transform: translateX(-100%); }

/* log */
.cbox { display: grid; gap: 6px; }
.cbox textarea, .menu textarea { width: 100%; min-height: 64px; resize: vertical; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); font: 400 13px/1.45 var(--body); }
.nrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.nrow button.save, .nrow button.cancel, .nrow button.clear { min-height: 32px; padding: 5px 13px; border: 0; border-radius: 999px; font: 600 12px var(--body); cursor: pointer; }
.nrow .save { background: var(--ink); color: var(--paper); }
.nrow .cancel { background: var(--wash); color: var(--ink); }
.nrow .clear { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.fi { font-size: 13px; padding: 0 6px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* composer */
.add { display: grid; gap: 8px; padding: 6px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); min-width: 0; }
.add:focus-within { border-color: var(--muted); }
.arow { display: flex; align-items: flex-end; gap: 6px; min-width: 0; }
#idea-text { flex: 1 1 auto; min-width: 0; min-height: 40px; max-height: 240px; padding: 9px 10px; border: 0; background: transparent; color: var(--ink); font: 400 15px/1.45 var(--body); resize: none; overflow-y: auto; }
#idea-text:focus-visible { outline: none; }
#idea-add { flex: none; height: 38px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--ink); color: var(--paper); font: 700 14px var(--body); cursor: pointer; }
#idea-add:disabled { opacity: 0.4; cursor: default; }
.more { display: none; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 0 4px 4px; min-width: 0; }
.add.open .more { display: grid; }
.more select, .more input[type="text"] { width: 100%; min-width: 0; min-height: 36px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); font: 400 13px var(--body); }
#idea-why { grid-column: 1 / -1; }
.mrow { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; min-width: 0; }
.thumbs { display: flex; flex-wrap: wrap; gap: 6px; }
.thumbs img, .imgs img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); background: var(--wash); display: block; }
.imgs { display: flex; flex-wrap: wrap; gap: 6px; }
.err { font-size: 13px; color: var(--discard); padding: 0 8px; }
.err:empty { display: none; }
.similar { display: grid; gap: 4px; padding: 2px 8px 6px; font-size: 13px; min-width: 0; }
.similar .lab { font: 600 12px var(--body); color: var(--muted); }
.srow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.dial { display: inline-flex; align-items: center; }
.dd { display: inline-grid; place-items: center; width: 24px; height: 32px; padding: 0; border: 0; background: none; cursor: pointer; }
.dd::before { content: ""; width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--muted); }
.dd.on::before { background: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }

/* search results */
#results { display: grid; gap: 18px; min-width: 0; align-content: start; }
.resg { display: grid; gap: 6px; min-width: 0; }
.resg h3 { display: flex; align-items: center; gap: 8px; font: 700 14px var(--body); }
.res { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto 16px; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 8px 12px; border: 0; background: none; color: var(--ink); text-align: left; cursor: pointer; font: 400 14px/1.35 var(--body); border-radius: 13px; }
.res.on, .res:hover { background: var(--wash); }
.res .ic { color: var(--muted); }
.res .ctx { max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--muted); }
.plusn { padding: 8px 12px; }
mark { background: var(--hl); color: inherit; border-radius: 2px; }

/* mark panel */
.menu { position: absolute; z-index: 40; width: min(340px, calc(100vw - 32px)); padding: 6px; display: grid; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px var(--shadow); }
.menu .mh { padding: 6px 10px 8px; font: 600 12px/1.35 var(--body); color: var(--muted); overflow-wrap: anywhere; }
.menu .opts { display: grid; gap: 2px; }
.menu .opts button { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: baseline; min-height: 36px; padding: 8px 10px; border: 0; border-radius: 9px; background: transparent; color: var(--ink); font: 600 13px var(--body); text-align: left; cursor: pointer; }
.menu .opts button:hover, .menu .opts button:focus-visible { background: var(--wash); outline: none; }
.menu .tick { font-weight: 800; }
.menu [data-v="hold"] .tick { color: var(--hold); } .menu [data-v="discard"] .tick { color: var(--discard); }
.menu .nl { padding: 8px 10px 0; font: 800 10px/1 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.menu .sure { padding: 0 6px; }
.menu textarea { margin: 6px 6px 0; width: calc(100% - 12px); }
.menu .nrow { padding: 8px 6px 4px; }
/* the panel is the item's editor: fields, order, remove */
.menu .flds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 6px 6px 2px; min-width: 0; }
.menu .fl { display: grid; gap: 2px; min-width: 0; grid-column: 1 / -1; }
.menu .fl.half { grid-column: auto; }
.menu .fl > span { font: 600 11px/1.3 var(--body); color: var(--muted); padding-left: 2px; }
.menu .fl input, .menu .fl select { width: 100%; min-width: 0; min-height: 36px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); font: 400 13px var(--body); }
.menu .fl textarea { margin: 0; width: 100%; min-height: 0; }
.menu .fl .selw { display: flex; width: 100%; }
.menu .fl select { -webkit-appearance: none; appearance: none; padding-right: 30px; cursor: pointer; }
.menu .pfoot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 6px 4px; margin-top: 4px; border-top: 1px solid var(--line); }
.menu .mv { display: inline-grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink); font: 600 15px/1 var(--body); cursor: pointer; }
.menu .mv:hover:not(:disabled) { background: var(--wash); }
.menu .mv:disabled { opacity: 0.35; cursor: default; }
.menu .pfoot .tidy { margin-left: auto; }

/* add rows: a quiet + at the end of a list, opening a one-line form */
.addw { min-width: 0; }
.addrow { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 8px 12px; border: 0; border-radius: 13px; background: none; color: var(--muted); font: 600 13px var(--body); text-align: left; cursor: pointer; }
.addrow:hover, .addrow:focus-visible { color: var(--ink); background: var(--wash); }
.addrow.solo { border: 1px dashed var(--line); }
.addf { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 6px 6px 10px; min-width: 0; }
.addf input, .addf select { min-height: 40px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); font: 400 14px var(--body); min-width: 0; }
.addf input { flex: 1 1 150px; }
.addf select { flex: 0 1 auto; max-width: 100%; }
.addf .save { min-height: 40px; padding: 6px 16px; border: 0; border-radius: 999px; background: var(--ink); color: var(--paper); font: 600 13px var(--body); cursor: pointer; }
.addf .save:disabled { opacity: 0.4; cursor: default; }

/* select mode: a box at the start of every row, a bar at the bottom */
#selbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.cbx.sk input { accent-color: var(--accent); }
.row.picked > .rh, .resw.picked { background: var(--accent-wash); border-radius: 13px; }
.chip.picked { box-shadow: inset 0 0 0 1.5px var(--accent); }
.chip input { width: 14px; height: 14px; margin: 0; accent-color: var(--accent); }
.resw { display: flex; align-items: center; min-width: 0; }
.resw > .res { flex: 1 1 auto; min-width: 0; }
.selbar { display: flex; align-items: center; gap: 6px; max-width: 100%; padding: 6px 6px 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); box-shadow: 0 6px 18px var(--shadow); }
.selbar .bub { min-width: 30px; height: 26px; border-radius: 13px; font-size: 13px; }
.selbar .tidy { min-height: 40px; }
.selbar .ib { width: 40px; height: 40px; }

/* toast and back */
.dock { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; align-items: center; gap: 8px; width: max-content; max-width: calc(100vw - 32px); pointer-events: none; }
.dock > * { pointer-events: auto; }
.toast { max-width: 100%; padding: 8px 14px; border-radius: 10px; background: var(--ink); color: var(--paper); font-size: 13px; }
.toast button { margin-left: 12px; padding: 0; border: 0; background: none; color: inherit; font: 700 13px var(--body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.backpill { min-height: 40px; padding: 8px 18px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink); font: 600 13px var(--body); box-shadow: 0 6px 18px var(--shadow); cursor: pointer; }

/* icons: one per kind of thing, per kind of idea, per tab group and per log source; quiet, coloured only by the existing tokens */
.tgw { display: inline-flex; align-items: center; flex: none; color: var(--tc, var(--muted)); }
.tgw .ic { width: 15px; height: 15px; }
.kd .ic { width: 14px; height: 14px; color: var(--kc); }
.stat .w { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
.stat .w .ic { width: 13px; height: 13px; color: var(--muted); vertical-align: 0; }
.bub .ic { width: 12px; height: 12px; margin-right: 4px; vertical-align: 0; }
.eye .ic, div.sub > .ic, .fh .ic.ti, h2 .ic.ti { width: 15px; height: 15px; color: var(--muted); }
div.sub { display: flex; align-items: center; gap: 6px; }
.tg .ic, .ksel .ic, .ver .ic { width: 14px; height: 14px; vertical-align: -2px; margin-right: 5px; }
.tg[aria-pressed="true"] .ic { color: inherit; }
.srci { display: inline-flex; color: var(--muted); flex: none; }
.srci .ic { width: 14px; height: 14px; }
.tab .bub.dotb { min-width: 0; width: 8px; height: 8px; padding: 0; border-radius: 50%; }
.tab .bub.dotb.quiet { box-shadow: none; background: var(--muted); }
.rt .fvt { cursor: zoom-in; }
.rt .fvt:hover { text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 3px; }
.fvb .ic { width: 15px; height: 15px; }
/* on a row the name opens the full view; its ⤢ stays only for the keyboard and shows when tabbed to */
.rh .fvb:not(:focus) { position: absolute; width: 1px; height: 1px; min-width: 0; min-height: 0; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* threads: an item's note, Claude's reply, then every message by time; Reply… last */
.thr { display: grid; gap: 10px; min-width: 0; }
.msgs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; min-width: 0; }
.msg { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; column-gap: 8px; align-items: start; min-width: 0; }
.msg.editing .mbd { grid-column: 2 / -1; }
.mside { display: inline-flex; align-items: center; gap: 2px; min-height: 22px; }
.rbody > .thr { padding-top: 10px; border-top: 1px solid var(--line); }
.fvv.said { font: italic 400 18px/1.35 var(--title); }
.mav { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--wash); color: var(--slate); }
.mav .ic { width: 13px; height: 13px; vertical-align: 0; }
.m-claude .mav { background: var(--accent-wash); color: var(--accent); }
.m-note .mav { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }

.mbd { display: grid; gap: 1px; min-width: 0; padding-top: 1px; }

    setResIdx(Math.max(0, Math.min(ui.resList.length - 1, ui.resIdx + (e.key === 'ArrowDown' ? 1 : -1))));
  } else if (e.key === 'Enter') {
    e.preventDefault(); clearTimeout(qT);
    if (state.q.trim() && $('results').hidden) applySearch();
    const r = ui.resList[ui.resIdx >= 0 ? ui.resIdx : 0]; if (r) go(r.ref);
  } else if (e.key === 'Escape') { e.preventDefault(); if (!state.q && ui.sel) setSel(false); else clearSearch(); }
});
$('qx').onclick = () => { clearSearch(); };
$('qbtn').onclick = openSearch;

/* ---------- tap on empty paper closes the open rows; Escape closes the one you are in ---------- */
/* the kind menu closes on a tap anywhere else */
document.addEventListener('click', e => { if (ui.kmOpen && !(e.target instanceof Element && e.target.closest('.kp'))) { ui.kmOpen = false; rerender('ideas'); } });
document.addEventListener('click', e => {
  const t = e.target;
  if (!(t instanceof Element) || t.closest('button, a, input, select, textarea, label, .rbody, .menu, #results, #add, #bar, .dock, .addw, #fv, .kp')) return;
  if (window.getSelection && String(window.getSelection())) return;
  $('t-' + state.tab).querySelectorAll('article.row.open').forEach(a => { ui.open.delete(a.id); setRow(a, false); });
  if ($('add').classList.contains('open') && formEmpty() && document.activeElement !== $('idea-text')) closeComposer();
});
document.addEventListener('keydown', e => {
  if (e.defaultPrevented || ui.fv) return;
  const t = e.target, inField = t instanceof Element && t.closest('input, textarea, select, [contenteditable]');
  if (e.key === '/' && !inField && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); openSearch(); return; }
  if (e.key !== 'Escape' || panelFor || t === $('q')) return;
  if ($('add').contains(t)) { closeComposer(); return; }
  if (ui.sel) { setSel(false); return; }
  const a = document.activeElement && document.activeElement.closest ? document.activeElement.closest('article.row') : null;
  if (a && ui.open.has(a.id)) { ui.open.delete(a.id); setRow(a, false); const hb = $('h-' + a.id); if (hb) hb.focus(); }
});

/* ---------- select mode: tick rows, then Remove, Hold or Done them all at once ---------- */
function selBox(key, rowId) {
  const it = ITEMS.get(key);
  const cb = h('input'); cb.type = 'checkbox'; cb.id = 'sk-' + rowId; cb.dataset.sk = key; cb.checked = ui.selected.has(key);
  cb.setAttribute('aria-label', 'Select: ' + trunc(it ? it.name : '', 80));
  cb.onchange = () => pick(key, cb.checked);
  const l = h('label', 'cbx sk', cb); l.title = 'Select';
  return l;
}
function pick(key, on) {
  const it = ITEMS.get(key); if (!it) return;
  if (on) ui.selected.set(key, it.name); else ui.selected.delete(key);
  /* the same item can show twice (a step in Building and in Steps): every copy follows */
  document.querySelectorAll('input[data-sk="' + CSS.escape(key) + '"]').forEach(c => { c.checked = on; const r = c.closest('article.row, .resw, label.chip, label.btile'); if (r) r.classList.toggle('picked', on); });
  syncSelBar();
}
const DONEK = new Set(['i', 't', 's', 'n']);
const isDone = it => it.k === 't' ? !!it.obj.done : it.obj.status === 'done';
function syncSelBar() {
  const bar = $('selbar'); bar.hidden = !ui.sel; if (!ui.sel) return;
  const ks = [...ui.selected.keys()], n = ks.length;
  $('seln').textContent = String(n);
  $('sel-rm').disabled = !n || archiving;
  $('sel-hold').hidden = !!n && !ks.every(k => MARKK.has(k[0])); $('sel-hold').disabled = !n || archiving;
  $('sel-done').hidden = !!n && !ks.every(k => DONEK.has(k[0])); $('sel-done').disabled = !n || archiving;
}
/* after a snapshot, ticked array items are found again by name; ticked things that are gone drop out */
function fixSel() {
  if (!ui.selected.size) return;
  const next = new Map();
  ui.selected.forEach((name, key) => {
    const it = ITEMS.get(key);
    if (it && (it.name === name || !/^[nt]:/.test(key))) { next.set(key, it.name); return; }
    const pre = key.replace(/[^:]+$/, ''), m = [...ITEMS.values()].find(x => x.key.startsWith(pre) && x.name === name && !next.has(x.key));
    if (m) next.set(m.key, name);
  });
  ui.selected = next;
}
function setSel(on) {
  const was = ui.sel;
  ui.sel = !!on && state.canEdit; ui.selected.clear();
  $('selbtn').setAttribute('aria-pressed', String(ui.sel));
  syncSelBar();
  TABN.forEach(t => ui.dirty.add(t));
  if (state.q) renderResults(); else renderTab(state.tab);
  if (was && !ui.sel) refocus(['selbtn', 'q']);
}
$('selbtn').onclick = () => setSel(!ui.sel);
$('sel-x').onclick = () => setSel(false);
/* the ticked items, as their newest ITEMS entries */
const selItems = () => [...ui.selected.keys()].map(k => ITEMS.get(k)).filter(Boolean);
function selDone() { ui.selected.clear(); TABN.forEach(t => ui.dirty.add(t)); if (state.q) renderResults(); else renderTab(state.tab); syncSelBar(); setTimeout(syncSelBar, 0); }
/* Remove: everything ticked goes to the archive in one run, with one log entry and one Undo; a page's own items go with it */
twoTap($('sel-rm'), () => ui.selected.size > 0 && !archiving, async () => {
  const its = selItems(), pages = new Set(its.filter(it => it.k === 'p').map(it => it.id));
  const units = its.filter(it => !(it.pid && pages.has(it.pid))).map(it => unitOf(it));
  if (await removeUnits(units, n => 'Removed ' + nOf(n, 'item', 'items'), null)) selDone(); else setTimeout(syncSelBar, 0);
});
/* Hold and Done: one write per document, one per page for its arrays, one log entry */
async function bulkPatch(mode) {
  if (archiving || !state.canEdit || !state.db) return;
  const its = selItems().filter(it => mode === 'hold' ? MARKK.has(it.k) && it.mark !== 'hold' : DONEK.has(it.k) && !isDone(it));
  if (!its.length) { toast((mode === 'hold' ? 'Held · ' : 'Done · ') + 0); return; }
  const patchOf = it => mode === 'hold' ? { mark: 'hold' } : it.k === 't' ? { done: true } : { status: 'done' };
  archiving = true; syncSelBar();
  let n = 0;
  try {
    const docs = its.filter(it => !it.pid);
    const r = await each(docs, async it => { await state.db.doc(COLL[it.k] + '/' + it.id).update(patchOf(it)); });
    n += r.n;
    for (const [pid, xs] of groupBy(its.filter(it => it.pid), it => it.pid)) {
      n += await onPage(pid, async () => {
        const cur = state.pages.find(p => p.id === pid); if (!cur) return 0;
        const patch = {}, prev = {}, taken = {}; let c = 0;
        xs.forEach(it => {
          if (!patch[it.field]) { prev[it.field] = cur[it.field]; patch[it.field] = (cur[it.field] || []).slice(); taken[it.field] = new Set(); }
          const j = findIn(patch[it.field], it.field, it.i, it.name, taken[it.field]); if (j < 0) return;
          taken[it.field].add(j); patch[it.field][j] = Object.assign({}, patch[it.field][j], patchOf(it)); c++;
        });
        if (!c) return 0;
        Object.assign(cur, patch);
        try { await state.db.doc('pages/' + pid).update(patch); return c; }
        catch (e) { Object.keys(prev).forEach(f => { if (cur[f] === patch[f]) cur[f] = prev[f]; }); return 0; }
      });
    }
  } finally { archiving = false; syncSelBar(); }
  if (!n) { toast(NOT_SAVED()); return; }
  toast((mode === 'hold' ? 'Held · ' : 'Done · ') + n);
  logYou(mode === 'hold' ? 'Held ' + nOf(n, 'item', 'items') : 'Marked ' + nOf(n, 'item', 'items') + ' done', null);
  selDone();
}
$('sel-hold').onclick = () => bulkPatch('hold');
$('sel-done').onclick = () => bulkPatch('done');

/* ---------- hide discarded: a per-viewer view setting, hidden unless you say otherwise ---------- */
function setHide(v, persist) {
  state.hide = v; document.documentElement.classList.toggle('hide-discarded', v);
  const b = $('hidebtn'); b.setAttribute('aria-pressed', String(v));
  b.querySelector('use').setAttribute('href', v ? '#i-eye-off' : '#i-eye');
  if (persist !== false) store.set('atlas-plan-hide', v ? '1' : '0');
  if (typeof C !== 'undefined' && C) hideLabel();
}
$('hidebtn').onclick = () => { setHide(!state.hide); TABN.forEach(t => ui.dirty.add(t)); if (state.q) renderResults(); else renderTab(state.tab); };

let toastT = null;
function toast(msg, fn, label = 'Undo') {
  const t = $('toast'), m = txt(msg); if (!m) return;
  t.textContent = m; t.hidden = false; clearTimeout(toastT);
  if (fn) { const b = h('button', null, label); b.type = 'button'; b.onclick = () => { clearTimeout(toastT); t.hidden = true; fn(); }; t.append(b); }
  toastT = setTimeout(() => { t.hidden = true; }, fn ? 8000 : 2600);
}

/* ---------- every snapshot: derive, then render only the active tab ---------- */
function applyEdit() {
  $('vo').hidden = !(state.db && !state.canEdit);
  $('add').hidden = !state.canEdit; $('plus').hidden = !state.canEdit; $('selbtn').hidden = !state.canEdit;
  if (!state.canEdit && ui.sel) setSel(false);
  $('slot-now').hidden = !state.canEdit; $('slot-ideas').hidden = !state.canEdit;
  $('idea-imgbtn').hidden = !state.assets;
}
function update() {
  const fa = document.activeElement, fid = fa && fa !== document.body ? fa.id : '';
  derive();
  /* seeded once every collection is in, so nothing old shows as new */
  if (seedSeen()) { C = counts(); renderStrip(); renderBar(); }
  applyEdit(); if (state.canEdit) fillForm();
  $('loading').hidden = state.loaded.size > 0 && !ui.fail;
  TABN.forEach(t => ui.dirty.add(t));
  if (state.q) renderResults(); else renderTab(state.tab);
  if (ui.fv) drawFv();
  reattachPanel();
  if (fid && document.activeElement !== $(fid) && $(fid) && !panelKey) { try { $(fid).focus({ preventScroll: true }); } catch (e) {} }
  if ((pendingRef || pendingView) && allLoaded()) runPending();
  syncSelBar(); tryOpenAfter();
}
/* the store could not be reached: one short line instead of the tabs */
function setLoading(msg) { ui.fail = true; const l = $('loading'); l.textContent = msg; l.hidden = false; TABN.forEach(t => { $('t-' + t).hidden = true; }); }

state.filter = loadFilter();
(() => { const v = store.get('atlas-plan-hide'); setHide(v == null ? true : v === '1', false); })();
if (!route(true)) { const t = store.get('atlas-plan-tab'); show(TABN.includes(t) ? t : 'now', { init: true }); }

(async () => {
  const cl = window.claude;
  if (!cl || !cl.use) { setLoading('Open on claude.ai'); return; }
  const [db, user, assets] = await Promise.all([cl.use('db'), cl.use('user'), cl.use('assets')]);
  state.assets = assets;
  if (!db) { setLoading('Open on claude.ai'); return; }
  state.db = db;
  state.canEdit = user ? await user.canEdit() : false;
  applyEdit();
  const sub = (name, key) => db.collection(name).onSnapshot(snap => {
    state[key] = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    state.loaded.add(key); schedule();
  }, () => { if (state.loaded.size) toast('Reload'); else setLoading('Reload'); });
  sub('pages', 'pages'); sub('ideas', 'ideas'); sub('categories', 'cats'); sub('next', 'steps'); sub('log', 'logs'); sub('sources', 'sources'); sub('day', 'day'); sub('review', 'review'); sub('rules', 'rules'); sub('archive', 'archive');
  /* board pictures, read only */
  sub('media', 'media');
  /* screen ratings: one per built screen, given here and copied to the studio's ranks each session */
  sub('stars', 'stars');
})();
