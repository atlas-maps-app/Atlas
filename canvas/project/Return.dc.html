</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { cans: 18, bottles: 6 };
}
renderVals() {
const { cans, bottles } = this.state;
const n = cans + bottles;
return {
cans, bottles,
count: String(n),
total: '$' + (n * 0.05).toFixed(2),
moreCans: () => this.setState({ cans: cans + 1 }),
lessCans: () => this.setState({ cans: Math.max(0, cans - 1) }),
moreBottles: () => this.setState({ bottles: bottles + 1 }),
lessBottles: () => this.setState({ bottles: Math.max(0, bottles - 1) })
};
}
}
</script>
