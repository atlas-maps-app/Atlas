<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { sel: 'car' };
}
renderVals() {
const sel = this.state.sel;
const bg = (k) => (sel === k ? '#EEF2FF' : 'transparent');
const times = { car: '6′', bus: '11′', bike: '7′', walk: '14′', ride: '5′' };
return {
pickCar: () => this.setState({ sel: 'car' }),
pickBus: () => this.setState({ sel: 'bus' }),
pickBike: () => this.setState({ sel: 'bike' }),
pickWalk: () => this.setState({ sel: 'walk' }),
pickRide: () => this.setState({ sel: 'ride' }),
carBg: bg('car'), busBg: bg('bus'), bikeBg: bg('bike'), walkBg: bg('walk'), rideBg: bg('ride'),
cta: times[sel]
};
}
}
</script>
