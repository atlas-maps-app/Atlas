# The transit planner's own checks (app/android/transit; its README says what each holds):
#   - the packer's check: the tests' hand-written feed packs to the kept bytes, the packer's cosine table is the
#     planner's, its refusals, the list of published files;
#   - the planner's tests, with tests/cut.rs's "the answers are the same everywhere" among them: its number was
#     written down on an arm64 Mac, and here an x86_64 and an arm64 Linux come to the same;
#   - the library without std, as an app links it;
#   - files a little wrong and queries at the edge of every field, with the overflow checks on: no panic from data.
#
# When: a push or a pull request to `app` (or `main`) that changes app/android/transit or this file; by hand; and as
# timetable.yml's first job (workflow_call), so the checks are written once and the weekly timetable is packed only
# by a tree that passes them. About a minute on each runner.
#
# It is a workflow of its own, beside the five that build stage P, and touches none of them. The planner is Rust's
# standard library and nothing else: cargo is held off the network (CARGO_NET_OFFLINE), so a crate that crept in
# would fail here, not be fetched. Rust itself is the runner's rustup taking the toolchain rust-toolchain.toml pins.
#
# No concurrency group: a run is a minute, each push has its word, and none waits for or cancels another.
name: Transit

on:
  push:
    branches: [main, app]
    paths: ['app/android/transit/**', '.github/workflows/transit.yml']
  pull_request:
    branches: [main, app]
    paths: ['app/android/transit/**', '.github/workflows/transit.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DIR: app/android/transit
  CARGO_NET_OFFLINE: 'true'
  CARGO_TERM_COLOR: never

jobs:
  checks:
    name: the packer's check and the planner's tests (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust, as rust-toolchain.toml pins it
        run: |
          set -euo pipefail
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' "$DIR/rust-toolchain.toml")" --profile minimal --no-self-update
          cd "$DIR/planner" && cargo --version && uname -m
      - name: The packer's check
        run: python3 -I "$DIR/pack/test_ttpack.py"
      - name: The planner's tests
        working-directory: app/android/transit/planner
        run: cargo test --locked
      - name: The library without std
        working-directory: app/android/transit/planner
        run: cargo build --locked --lib --no-default-features
      # The counts in each line (the files that still opened, the journeys they and the queries gave) come of the same
      # files on every platform: tests/data/fuzz-counts.txt keeps them, written down on an arm64 Mac.
      - name: Files a little wrong, and queries at their edges
        working-directory: app/android/transit/planner
        run: |
          set -euo pipefail
          ./fuzz-counts.sh | tee "$RUNNER_TEMP/fuzz-counts.txt"
          if ! diff tests/data/fuzz-counts.txt "$RUNNER_TEMP/fuzz-counts.txt"; then
            echo "::error::The files a little wrong gave other counts here than tests/data/fuzz-counts.txt keeps: the planner's answers differ by platform, or the search changed and the file is stale (./fuzz-counts.sh writes it)"
            exit 1
          fi
