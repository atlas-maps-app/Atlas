# Builds Atlas's Android app, runs every unit test (Robolectric draws real pixels for the screenshot tests)
# and keeps the debug APK, the bench APK (a non-debuggable build with the timings overlay: what a phone runs),
# the test reports and the screenshots as artifacts. The emulator job opens both APKs and keeps the engine's timings,
# memory, a simpleperf profile and the GL capabilities (app/android/ci/smoke.sh). Releases do not carry the bench APK.
name: Android

on:
  push:
    branches: [main, app]
    paths: ['app/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/android/**', '.github/workflows/**']
  workflow_dispatch:
    # A run by hand (gh workflow run android.yml --ref <branch> -f tests=false -f screens="home filters"): the device loop
    # for the engine's speed and memory, without the half hour of unit tests.
    inputs:
      tests:
        description: Run the unit tests
        type: boolean
        default: true
      screens:
        description: The screens to open on the emulator, space-separated (empty = every screen)
        type: string
        default: ''
      wait:
        description: Seconds to wait for the home's map and the filter probes
        type: number
        default: 180
      bench:
        description: Also run the bench APK (as installed and compiled, memory, simpleperf, GL capabilities)
        type: boolean
        default: true
      sweeps:
        description: Also run the core's full sweeps (pymath's parity at 10^7 a function, 60,000 damaged tiles; nightly always)
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK 37
        # NDK r30 and the SDK's CMake build the map core (:mapcore), at the versions mapcore/tools.properties pins.
        run: |
          pin() { grep "^$1=" mapcore/tools.properties | cut -d= -f2-; }
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" \
            "ndk;$(pin ndk.version)" "cmake;$(pin cmake.version)" > /dev/null
      # ccache for the map core's C++ (ATLAS_CCACHE=1 makes mapcore/build.gradle.kts pass it to CMake as the compiler
      # launcher), keyed by the pins (the NDK among them) and the core's flags. The compiler is identified by the pinned
      # NDK version rather than its file's mtime, which each runner image's install of the NDK changes; the sloppiness
      # lets ccache cache the units built with Vulkan-Hpp's precompiled header (CMakeLists.txt adds -fno-pch-timestamp).
      - name: ccache
        run: |
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q ccache > /dev/null
          {
            echo "ATLAS_CCACHE=1"
            echo "CCACHE_DIR=$HOME/.cache/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=600M"
            echo "CCACHE_COMPILERCHECK=string:ndk-$(grep '^ndk.version=' mapcore/tools.properties | cut -d= -f2-)"
            echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime"
          } >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-mapcore-${{ hashFiles('app/android/mapcore/cpp/cmake/**', 'app/android/mapcore/build.gradle.kts', 'app/android/mapcore/tools.properties') }}-${{ github.sha }}
          restore-keys: ccache-mapcore-${{ hashFiles('app/android/mapcore/cpp/cmake/**', 'app/android/mapcore/build.gradle.kts', 'app/android/mapcore/tools.properties') }}-
      # The map core's host build for :mapcorecheck's JNI tests (the tile reader's L0, the style's parity, the likeness
      # candidates; mapcorecheck/build.gradle.kts's coreHost task): LLVM's clang and libc++, as core.yml installs them
      # (Ubuntu's own clang lacks libc++'s C++23), and lavapipe with the validation layer from the pinned emulator package,
      # as core.yml's x86_64 jobs get it. They reach only that task and those tests (ATLAS_HOST_* and ATLAS_LAVAPIPE_DIR),
      # never the APK's NDK build or the other tests.
      - name: "Map core host build: LLVM's clang and libc++"
        run: |
          LLVM=$(grep -m1 "^  LLVM: '" ../../.github/workflows/core.yml | cut -d"'" -f2) # core.yml's pin: NDK r30's major
          [ -n "$LLVM" ] || { echo "::error::core.yml names no LLVM version"; exit 1; }
          codename=$(lsb_release -cs)
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$LLVM main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-$LLVM lld-$LLVM libc++-$LLVM-dev libc++abi-$LLVM-dev \
            libclang-rt-$LLVM-dev
          {
            echo "ATLAS_HOST_CC=clang-$LLVM"
            echo "ATLAS_HOST_CXX=clang++-$LLVM"
            echo "ATLAS_HOST_CXXFLAGS=-stdlib=libc++"
            echo "ATLAS_HOST_LDFLAGS=-stdlib=libc++"
          } >> "$GITHUB_ENV"
          clang++-$LLVM --version | head -1
      - name: "Map core host build: the emulator package's pin"
        run: echo "EMULATOR_SHA1=$(grep '^emulator.linux-x86_64.sha1=' mapcore/tools.properties | cut -d= -f2-)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/emulator-vulkan
          key: emulator-vulkan-${{ env.EMULATOR_SHA1 }}
      - name: "Map core host build: lavapipe from the pinned emulator package"
        run: |
          dir="$RUNNER_TEMP/emulator-vulkan"
          if [ ! -e "$dir/lvp_icd.json" ]; then
            file=$(grep '^emulator.linux-x86_64.file=' mapcore/tools.properties | cut -d= -f2-)
            curl -fsSLo "$RUNNER_TEMP/$file" "https://dl.google.com/android/repository/$file"
            echo "$EMULATOR_SHA1  $RUNNER_TEMP/$file" | sha1sum -c -
            unzip -q "$RUNNER_TEMP/$file" 'emulator/lib64/vulkan/*' -d "$RUNNER_TEMP/emulator"
            rm "$RUNNER_TEMP/$file"
            mv "$RUNNER_TEMP/emulator/emulator/lib64/vulkan" "$dir"
            rm -f "$dir"/*swiftshader* "$dir"/*MoltenVK* "$dir"/*kosmickrisp* "$dir"/glslangValidator
          fi
          ls -la "$dir" "$dir/layers" || true
          echo "ATLAS_LAVAPIPE_DIR=$dir" >> "$GITHUB_ENV"
          if [ ! -e "$dir/libvulkan.so.1" ] && [ ! -e "$dir/libvulkan.so" ]; then
            sudo apt-get install -y -q libvulkan1 > /dev/null
            echo "ATLAS_VULKAN_LOADER=/usr/lib/x86_64-linux-gnu/libvulkan.so.1" >> "$GITHUB_ENV"
          fi
      # pymath's parity sweep (:mapcorecheck's MT/numerics) runs 10^5 arguments a function here, and the tile reader's
      # differential check 1,500 damaged tiles; the sweeps job runs the plan's 10^7 and 60,000 nightly.
      - name: Test and build
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.tests }}" = "false" ]; then
            ./gradlew assembleDebug assembleBench --stacktrace
          else
            ./gradlew test testDebugUnitTest assembleDebug assembleBench -Datlas.numerics.n=100000 --continue --stacktrace
          fi
      - name: Keep the APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Keep the bench APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas-bench-apk
          path: app/android/app/build/outputs/apk/bench/*.apk
          if-no-files-found: ignore
      - name: Keep the reports and pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas-reports
          path: |
            app/android/**/build/reports/tests/
            app/android/**/build/outputs/roborazzi/
            app/android/**/build/preview/
            app/android/**/build/screenshots/
            cache/svg-android/compare/
          if-no-files-found: ignore

  emulator:
    # The real thing: the APK on an Android emulator, opened on each screen, with screenshots and frame timings.
    # It runs whenever the APK was built, even when a unit test failed: the device's word is worth having either way.
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: atlas-debug-apk
          path: apk
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: atlas-bench-apk
          path: apk-bench
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator build whose package core.yml's x86_64 jobs take lavapipe and the validation layer from
      # (app/android/mapcore/tools.properties), so the guest's Vulkan and the host tests' are the same lavapipe.
      - name: The pinned emulator build
        id: emulator
        run: |
          build=$(sed -n 's/^emulator\.linux-x86_64\.file=emulator-linux_x64-\([0-9]*\)\.zip$/\1/p' app/android/mapcore/tools.properties)
          [ -n "$build" ] || { echo "::error::tools.properties names no emulator build"; exit 1; }
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ATLAS_PYMATH_HASH: 77476b808456a6f0 # K3b: the host build's and the port's numerics hash; smoke.sh fails on any other
        with:
          emulator-build: ${{ steps.emulator.outputs.build }}
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          # lavapipe: Mesa's Vulkan for the guest (the driver the host tests use) and the emulator's own software GLES. The
          # deprecated swiftshader_indirect hung HWUI's first program compile on its host GL pipe on every debug-first run.
          emulator-options: -no-window -gpu lavapipe -noaudio -no-boot-anim -camera-back none
          script: ATLAS_SCREENS="${{ inputs.screens }}" ATLAS_MAP_WAIT="${{ inputs.wait || 180 }}" ATLAS_BENCH="${{ github.event_name == 'workflow_dispatch' && inputs.bench == false && '0' || '1' }}" bash app/android/ci/smoke.sh apk shots apk-bench
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas-emulator
          path: shots/
          if-no-files-found: ignore

  sweeps:
    # The core's full sweeps, on a Release host build: pymath's parity (L0 d, plan-vector D16, K3b), 10^7 arguments a
    # function bit for bit against StrictMath and PyMath (and its sin timing, reported); and the tile reader's
    # differential check (L0 b, K3), 60,000 damaged tiles of the bundled packs through the core and the Kotlin reader,
    # which must agree on every one (about a minute). Nightly, and on dispatch with sweeps; the build job runs 10^5 and
    # 1,500.
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sweeps) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v7
        with:
          # the nightly runs from the default branch's workflow; it judges the work branch
          ref: ${{ github.event_name == 'schedule' && 'app' || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK 37
        # the SDK's CMake builds the core's host library (:mapcorecheck's coreHost, app/android/mapcore/tools.properties)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null
      - name: "Map core host build: LLVM's clang and libc++"
        run: |
          LLVM=$(grep -m1 "^  LLVM: '" ../../.github/workflows/core.yml | cut -d"'" -f2) # core.yml's pin: NDK r30's major
          [ -n "$LLVM" ] || { echo "::error::core.yml names no LLVM version"; exit 1; }
          codename=$(lsb_release -cs)
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$LLVM main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-$LLVM lld-$LLVM libc++-$LLVM-dev libc++abi-$LLVM-dev \
            libclang-rt-$LLVM-dev
          {
            echo "ATLAS_HOST_CC=clang-$LLVM"
            echo "ATLAS_HOST_CXX=clang++-$LLVM"
            echo "ATLAS_HOST_CXXFLAGS=-stdlib=libc++"
            echo "ATLAS_HOST_LDFLAGS=-stdlib=libc++"
          } >> "$GITHUB_ENV"
          clang++-$LLVM --version | head -1
      - name: The sweeps
        run: >-
          ./gradlew :mapcorecheck:test --tests 'app.atlas.mapcorecheck.numerics.*'
          --tests 'app.atlas.mapcorecheck.tiles.L0DecodeTest.onDamagedTilesTheCoreAgreesWithTheKotlinReader'
          -Datlas.l0.damages=60000 -Patlas.mapcore.buildType=Release --stacktrace
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sweeps
          path: app/android/mapcorecheck/build/reports/tests/
          if-no-files-found: ignore
