# Builds Atlas's Android app, runs every unit test (Robolectric draws real pixels for the screenshot tests)
# and keeps the debug APK, the bench APK (a non-debuggable build with the timings overlay: what a phone runs),
# the test reports and the screenshots as artifacts. The emulator job opens both APKs and keeps the engine's timings,
# memory, a simpleperf profile and the GL capabilities (app/android/ci/smoke.sh). Releases do not carry the bench APK.
name: Android

on:
  push:
    branches: [main, app]
    paths: ['app/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/android/**', '.github/workflows/**']
  schedule:
    # nightly: the likeness harness's full tier and its history (plan-vector D16), on the work branch
    - cron: '23 2 * * *'
  workflow_dispatch:
    # A run by hand (gh workflow run android.yml --ref <branch> -f tests=false -f screens="home filters"): the device loop
    # for the engine's speed and memory, without the half hour of unit tests.
    inputs:
      tests:
        description: Run the unit tests
        type: boolean
        default: true
      screens:
        description: The screens to open on the emulator, space-separated (empty = every screen)
        type: string
        default: ''
      wait:
        description: Seconds to wait for the home's map and the filter probes
        type: number
        default: 180
      bench:
        description: Also run the bench APK (as installed and compiled, memory, simpleperf, GL capabilities)
        type: boolean
        default: true
      likeness:
        description: The likeness tier (smoke in the build job; full adds the nightly's two shards; off skips both)
        type: choice
        options: [smoke, full, 'off']
        default: smoke
      sweeps:
        description: Also run the core's full sweeps (pymath's parity at 10^7 a function, 60,000 damaged tiles; nightly always)
        type: boolean
        default: false
      vkcheck:
        description: Build the VK check asset for a phone as its VK facts give it, <model>:<w>x<h>[@<density>] (empty for none)
        type: string
        default: ''
      release:
        description: Attach that VK check asset to this release tag (an alpha; empty for none)
        type: string
        default: ''

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK 37
        # NDK r30 and the SDK's CMake build the map core (:mapcore), at the versions mapcore/tools.properties pins.
        run: |
          pin() { grep "^$1=" mapcore/tools.properties | cut -d= -f2-; }
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" \
            "ndk;$(pin ndk.version)" "cmake;$(pin cmake.version)" > /dev/null
      # ccache for the map core's C++ (ATLAS_CCACHE=1 makes mapcore/build.gradle.kts pass it to CMake as the compiler
      # launcher), keyed by the pins (the NDK among them) and the core's flags. The compiler is identified by the pinned
      # NDK version rather than its file's mtime, which each runner image's install of the NDK changes; the sloppiness
      # lets ccache cache the units built with Vulkan-Hpp's precompiled header (CMakeLists.txt adds -fno-pch-timestamp).
      - name: ccache
        run: |
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q ccache > /dev/null
          {
            echo "ATLAS_CCACHE=1"
            echo "CCACHE_DIR=$HOME/.cache/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=600M"
            echo "CCACHE_COMPILERCHECK=string:ndk-$(grep '^ndk.version=' mapcore/tools.properties | cut -d= -f2-)"
            echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime"
          } >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-mapcore-${{ hashFiles('app/android/mapcore/cpp/cmake/**', 'app/android/mapcore/build.gradle.kts', 'app/android/mapcore/tools.properties') }}-${{ github.sha }}
          restore-keys: ccache-mapcore-${{ hashFiles('app/android/mapcore/cpp/cmake/**', 'app/android/mapcore/build.gradle.kts', 'app/android/mapcore/tools.properties') }}-
      # The map core's host build for :mapcorecheck's JNI tests (the tile reader's L0, the style's parity, the likeness
      # candidates; mapcorecheck/build.gradle.kts's coreHost task): LLVM's clang and libc++, as core.yml installs them
      # (Ubuntu's own clang lacks libc++'s C++23), and lavapipe with the validation layer from the pinned emulator package,
      # as core.yml's x86_64 jobs get it. They reach only that task and those tests (ATLAS_HOST_* and ATLAS_LAVAPIPE_DIR),
      # never the APK's NDK build or the other tests.
      - name: "Map core host build: LLVM's clang and libc++"
        run: |
          LLVM=$(grep -m1 "^  LLVM: '" ../../.github/workflows/core.yml | cut -d"'" -f2) # core.yml's pin: NDK r30's major
          [ -n "$LLVM" ] || { echo "::error::core.yml names no LLVM version"; exit 1; }
          codename=$(lsb_release -cs)
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$LLVM main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-$LLVM lld-$LLVM libc++-$LLVM-dev libc++abi-$LLVM-dev \
            libclang-rt-$LLVM-dev
          {
            echo "ATLAS_HOST_CC=clang-$LLVM"
            echo "ATLAS_HOST_CXX=clang++-$LLVM"
            echo "ATLAS_HOST_CXXFLAGS=-stdlib=libc++"
            echo "ATLAS_HOST_LDFLAGS=-stdlib=libc++"
          } >> "$GITHUB_ENV"
          clang++-$LLVM --version | head -1
      - name: "Map core host build: the emulator package's pin"
        run: echo "EMULATOR_SHA1=$(grep '^emulator.linux-x86_64.sha1=' mapcore/tools.properties | cut -d= -f2-)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/emulator-vulkan
          key: emulator-vulkan-${{ env.EMULATOR_SHA1 }}
      - name: "Map core host build: lavapipe from the pinned emulator package"
        run: |
          dir="$RUNNER_TEMP/emulator-vulkan"
          if [ ! -e "$dir/lvp_icd.json" ]; then
            file=$(grep '^emulator.linux-x86_64.file=' mapcore/tools.properties | cut -d= -f2-)
            curl -fsSLo "$RUNNER_TEMP/$file" "https://dl.google.com/android/repository/$file"
            echo "$EMULATOR_SHA1  $RUNNER_TEMP/$file" | sha1sum -c -
            unzip -q "$RUNNER_TEMP/$file" 'emulator/lib64/vulkan/*' -d "$RUNNER_TEMP/emulator"
            rm "$RUNNER_TEMP/$file"
            mv "$RUNNER_TEMP/emulator/emulator/lib64/vulkan" "$dir"
            rm -f "$dir"/*swiftshader* "$dir"/*MoltenVK* "$dir"/*kosmickrisp* "$dir"/glslangValidator
          fi
          ls -la "$dir" "$dir/layers" || true
          echo "ATLAS_LAVAPIPE_DIR=$dir" >> "$GITHUB_ENV"
          if [ ! -e "$dir/libvulkan.so.1" ] && [ ! -e "$dir/libvulkan.so" ]; then
            sudo apt-get install -y -q libvulkan1 > /dev/null
            echo "ATLAS_VULKAN_LOADER=/usr/lib/x86_64-linux-gnu/libvulkan.so.1" >> "$GITHUB_ENV"
          fi
      # pymath's parity sweep (:mapcorecheck's MT/numerics) runs 10^5 arguments a function here, and the tile reader's
      # differential check 1,500 damaged tiles; the sweeps job runs the plan's 10^7 and 60,000 nightly.
      - name: Test and build
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.tests }}" = "false" ]; then
            ./gradlew assembleDebug assembleBench --stacktrace
          else
            ./gradlew test testDebugUnitTest assembleDebug assembleBench -x :likeness:testDebugUnitTest -Datlas.numerics.n=100000 --continue --stacktrace
          fi
      # The likeness harness (plan-vector D16, K4), whatever `tests` says and even when the step above failed, so a
      # likeness failure never costs the APKs, the unit tests' reports or the emulator's run: the port's references
      # (cached by the sources that draw them), the candidates (the core's host build on lavapipe) judged by
      # thresholds.json, the planted failures on the stub, the report and the ratchet's proposal (artifact `likeness`).
      - name: Likeness tier
        if: ${{ !cancelled() }}
        id: likeness
        env:
          TIER: ${{ inputs.likeness }}
        run: echo "tier=${TIER:-smoke}" | sed 's/=full$/=smoke/' >> "$GITHUB_OUTPUT"
      - name: "Likeness: the canal ring's pack"
        if: ${{ !cancelled() && steps.likeness.outputs.tier != 'off' }}
        uses: actions/cache@v6
        with:
          path: cache/packs/regions/grachten.atlas
          key: likeness-pack-grachten-3ec8629e2d3f5708a604ada1592b4bc4a5dd722e69c2aaefa1cbafe5811593ec
      - name: "Likeness: fetch the canal ring's pack"
        if: ${{ !cancelled() && steps.likeness.outputs.tier != 'off' }}
        working-directory: .
        run: |
          f=cache/packs/regions/grachten.atlas
          if [ ! -f "$f" ]; then
            mkdir -p cache/packs/regions
            curl -fsSL --retry 3 -o "$f" https://github.com/atlas-maps-app/Atlas/releases/download/packs-renders/grachten.atlas
          fi
          echo "3ec8629e2d3f5708a604ada1592b4bc4a5dd722e69c2aaefa1cbafe5811593ec  $f" | sha256sum -c -
      - name: "Likeness: restore the references"
        if: ${{ !cancelled() && steps.likeness.outputs.tier != 'off' }}
        id: refs
        uses: actions/cache/restore@v6
        with:
          path: cache/likeness/refs
          key: likeness-refs-smoke-${{ runner.arch }}-${{ hashFiles('app/android/render/src/main/**', 'app/android/anchor/src/main/**', 'app/android/anchor/src/testFixtures/**', 'app/android/mapview/src/main/kotlin/app/atlas/mapview/svg/**', 'app/android/mapview/src/main/assets/svgfonts/**', 'app/android/likeness/**', 'app/android/mapcorecheck/src/test/resources/likeness/cases/**', 'app/android/gradle/libs.versions.toml') }}
      - name: "Likeness: references"
        if: ${{ !cancelled() && steps.likeness.outputs.tier != 'off' }}
        id: references
        # a cold smoke build must take no more than 4 minutes (K4's acceptance)
        run: ./gradlew :likeness:testDebugUnitTest -Datlas.likeness.tier=smoke -Datlas.likeness.budget=240 --stacktrace
      - name: "Likeness: keep the references"
        if: ${{ !cancelled() && steps.references.outcome == 'success' && steps.refs.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: cache/likeness/refs
          key: ${{ steps.refs.outputs.cache-primary-key }}
      - name: "Likeness: candidates and gates"
        if: ${{ !cancelled() && steps.likeness.outputs.tier != 'off' }}
        run: >-
          ./gradlew :mapcorecheck:test --tests 'app.atlas.mapcorecheck.likeness.*' -Datlas.likeness.tier=smoke -Datlas.likeness.require=true
          -Datlas.likeness.platform=lavapipe-x86_64 -Datlas.likeness.commit=${{ github.sha }}
          -Datlas.likeness.report=${{ github.workspace }}/likeness --stacktrace
      - name: "Likeness: keep the report"
        if: always() && steps.likeness.outputs.tier != 'off'
        uses: actions/upload-artifact@v7
        with:
          name: likeness
          path: likeness/
          if-no-files-found: ignore
      - name: Keep the APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Keep the bench APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas-bench-apk
          path: app/android/app/build/outputs/apk/bench/*.apk
          if-no-files-found: ignore
      - name: Keep the reports and pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas-reports
          path: |
            app/android/**/build/reports/tests/
            app/android/**/build/outputs/roborazzi/
            app/android/**/build/preview/
            app/android/**/build/screenshots/
            cache/svg-android/compare/
          if-no-files-found: ignore

  emulator:
    # The real thing: the APK on an Android emulator, opened on each screen, with screenshots and frame timings.
    # It runs whenever the APK was built, even when a unit test failed: the device's word is worth having either way.
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: atlas-debug-apk
          path: apk
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: atlas-bench-apk
          path: apk-bench
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator build whose package core.yml's x86_64 jobs take lavapipe and the validation layer from
      # (app/android/mapcore/tools.properties), so the guest's Vulkan and the host tests' are the same lavapipe.
      - name: The pinned emulator build
        id: emulator
        run: |
          build=$(sed -n 's/^emulator\.linux-x86_64\.file=emulator-linux_x64-\([0-9]*\)\.zip$/\1/p' app/android/mapcore/tools.properties)
          [ -n "$build" ] || { echo "::error::tools.properties names no emulator build"; exit 1; }
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ATLAS_PYMATH_HASH: 77476b808456a6f0 # K3b: the host build's and the port's numerics hash; smoke.sh fails on any other
          ATLAS_SUN_HASH: 6a47c776c64ed9ae # K8: the host build's sun bits of the bundled Westerkerk; smoke.sh fails on any other
        with:
          emulator-build: ${{ steps.emulator.outputs.build }}
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          # lavapipe: Mesa's Vulkan for the guest (the driver the host tests use) and the emulator's own software GLES. The
          # deprecated swiftshader_indirect hung HWUI's first program compile on its host GL pipe on every debug-first run.
          emulator-options: -no-window -gpu lavapipe -noaudio -no-boot-anim -camera-back none
          script: ATLAS_SCREENS="${{ inputs.screens }}" ATLAS_MAP_WAIT="${{ inputs.wait || 180 }}" ATLAS_BENCH="${{ github.event_name == 'workflow_dispatch' && inputs.bench == false && '0' || '1' }}" bash app/android/ci/smoke.sh apk shots apk-bench
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas-emulator
          path: shots/
          if-no-files-found: ignore

  likeness-full:
    # The likeness harness's full tier (plan-vector D16): nightly, and on dispatch with likeness=full; two shards.
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.likeness == 'full') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v7
        with:
          # the nightly runs from the default branch's workflow; it judges the work branch
          ref: ${{ github.event_name == 'schedule' && 'app' || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK 37
        # NDK r30 and the SDK's CMake build the map core (:mapcore, app/android/mapcore/tools.properties).
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null
      # :mapcorecheck:test builds the core's host library (coreHost) and draws the candidates on lavapipe: the build job's
      # LLVM and the pinned emulator package's lavapipe
      - name: "Map core host build: LLVM's clang and libc++"
        run: |
          LLVM=$(grep -m1 "^  LLVM: '" ../../.github/workflows/core.yml | cut -d"'" -f2) # core.yml's pin: NDK r30's major
          [ -n "$LLVM" ] || { echo "::error::core.yml names no LLVM version"; exit 1; }
          codename=$(lsb_release -cs)
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$LLVM main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-$LLVM lld-$LLVM libc++-$LLVM-dev libc++abi-$LLVM-dev \
            libclang-rt-$LLVM-dev
          {
            echo "ATLAS_HOST_CC=clang-$LLVM"
            echo "ATLAS_HOST_CXX=clang++-$LLVM"
            echo "ATLAS_HOST_CXXFLAGS=-stdlib=libc++"
            echo "ATLAS_HOST_LDFLAGS=-stdlib=libc++"
          } >> "$GITHUB_ENV"
          clang++-$LLVM --version | head -1
      - name: "Map core host build: the emulator package's pin"
        run: echo "EMULATOR_SHA1=$(grep '^emulator.linux-x86_64.sha1=' mapcore/tools.properties | cut -d= -f2-)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/emulator-vulkan
          key: emulator-vulkan-${{ env.EMULATOR_SHA1 }}
      - name: "Map core host build: lavapipe from the pinned emulator package"
        run: |
          dir="$RUNNER_TEMP/emulator-vulkan"
          if [ ! -e "$dir/lvp_icd.json" ]; then
            file=$(grep '^emulator.linux-x86_64.file=' mapcore/tools.properties | cut -d= -f2-)
            curl -fsSLo "$RUNNER_TEMP/$file" "https://dl.google.com/android/repository/$file"
            echo "$EMULATOR_SHA1  $RUNNER_TEMP/$file" | sha1sum -c -
            unzip -q "$RUNNER_TEMP/$file" 'emulator/lib64/vulkan/*' -d "$RUNNER_TEMP/emulator"
            rm "$RUNNER_TEMP/$file"
            mv "$RUNNER_TEMP/emulator/emulator/lib64/vulkan" "$dir"
            rm -f "$dir"/*swiftshader* "$dir"/*MoltenVK* "$dir"/*kosmickrisp* "$dir"/glslangValidator
          fi
          ls -la "$dir" "$dir/layers" || true
          echo "ATLAS_LAVAPIPE_DIR=$dir" >> "$GITHUB_ENV"
          if [ ! -e "$dir/libvulkan.so.1" ] && [ ! -e "$dir/libvulkan.so" ]; then
            sudo apt-get install -y -q libvulkan1 > /dev/null
            echo "ATLAS_VULKAN_LOADER=/usr/lib/x86_64-linux-gnu/libvulkan.so.1" >> "$GITHUB_ENV"
          fi
      - name: The canal ring's pack
        uses: actions/cache@v6
        with:
          path: cache/packs/regions/grachten.atlas
          key: likeness-pack-grachten-3ec8629e2d3f5708a604ada1592b4bc4a5dd722e69c2aaefa1cbafe5811593ec
      - name: Fetch the canal ring's pack
        working-directory: .
        run: |
          f=cache/packs/regions/grachten.atlas
          if [ ! -f "$f" ]; then
            mkdir -p cache/packs/regions
            curl -fsSL --retry 3 -o "$f" https://github.com/atlas-maps-app/Atlas/releases/download/packs-renders/grachten.atlas
          fi
          echo "3ec8629e2d3f5708a604ada1592b4bc4a5dd722e69c2aaefa1cbafe5811593ec  $f" | sha256sum -c -
      - name: Restore the references
        id: refs
        uses: actions/cache/restore@v6
        with:
          path: cache/likeness/refs
          key: likeness-refs-full-${{ matrix.shard }}-${{ runner.arch }}-${{ hashFiles('app/android/render/src/main/**', 'app/android/anchor/src/main/**', 'app/android/anchor/src/testFixtures/**', 'app/android/mapview/src/main/kotlin/app/atlas/mapview/svg/**', 'app/android/mapview/src/main/assets/svgfonts/**', 'app/android/likeness/**', 'app/android/mapcorecheck/src/test/resources/likeness/cases/**', 'app/android/gradle/libs.versions.toml') }}
      - name: References
        run: ./gradlew :likeness:testDebugUnitTest --tests 'app.atlas.likeness.ReferencesTest' -Datlas.likeness.tier=full -Datlas.likeness.shard=${{ matrix.shard }}/2 -Plikeness.heap=7g --stacktrace
      - name: Keep the references
        if: steps.refs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: cache/likeness/refs
          key: ${{ steps.refs.outputs.cache-primary-key }}
      - name: Candidates and gates
        run: >-
          ./gradlew :mapcorecheck:test --tests 'app.atlas.mapcorecheck.likeness.*' -Datlas.likeness.tier=full -Datlas.likeness.require=true
          -Datlas.likeness.platform=lavapipe-x86_64 -Datlas.likeness.commit=${{ github.sha }}
          -Datlas.likeness.report=${{ github.workspace }}/likeness --stacktrace
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: likeness-full-${{ matrix.shard }}
          path: likeness/
          if-no-files-found: ignore

  likeness-history:
    # Nightly: each case's MAD and share within 2 appended to the history of the last 30 nightly runs (plan-vector D16).
    needs: likeness-full
    if: ${{ github.event_name == 'schedule' && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: likeness-full-*
          path: likeness
      - name: The history so far, and tonight's
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p history
          prev=$(gh run list -R "$REPO" --workflow android.yml --event schedule --status completed -L 5 --json databaseId -q '.[].databaseId' | grep -vx "$RUN" | head -1 || true)
          if [ -n "$prev" ]; then gh run download "$prev" -R "$REPO" -n likeness-history -D history || true; fi
          touch history/likeness-history.tsv
          when=$(date -u +%Y-%m-%dT%H:%MZ)
          cat likeness/*/likeness.log 2>/dev/null | grep -E '^likeness [^:]+: MAD' | sed -E "s/^likeness ([^:]+): MAD ([^ ]+) within2 ([^ ]+).*/$when\t$SHA\t\1\t\2\t\3/" >> history/likeness-history.tsv
          cut -f1 history/likeness-history.tsv | sort -u | tail -30 > history/runs
          grep -F -f history/runs history/likeness-history.tsv > history/kept || true
          mv history/kept history/likeness-history.tsv && rm history/runs
          tail -40 history/likeness-history.tsv
      - uses: actions/upload-artifact@v7
        with:
          name: likeness-history
          path: history/likeness-history.tsv
          retention-days: 90

  sweeps:
    # The core's full sweeps, on a Release host build: pymath's parity (L0 d, plan-vector D16, K3b), 10^7 arguments a
    # function bit for bit against StrictMath and PyMath (and its sin timing, reported); and the tile reader's
    # differential check (L0 b, K3), 60,000 damaged tiles of the bundled packs through the core and the Kotlin reader,
    # which must agree on every one (about a minute). Nightly, and on dispatch with sweeps; the build job runs 10^5 and
    # 1,500.
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sweeps) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v7
        with:
          # the nightly runs from the default branch's workflow; it judges the work branch
          ref: ${{ github.event_name == 'schedule' && 'app' || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK 37
        # the SDK's CMake builds the core's host library (:mapcorecheck's coreHost, app/android/mapcore/tools.properties)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null
      - name: "Map core host build: LLVM's clang and libc++"
        run: |
          LLVM=$(grep -m1 "^  LLVM: '" ../../.github/workflows/core.yml | cut -d"'" -f2) # core.yml's pin: NDK r30's major
          [ -n "$LLVM" ] || { echo "::error::core.yml names no LLVM version"; exit 1; }
          codename=$(lsb_release -cs)
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$LLVM main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-$LLVM lld-$LLVM libc++-$LLVM-dev libc++abi-$LLVM-dev \
            libclang-rt-$LLVM-dev
          {
            echo "ATLAS_HOST_CC=clang-$LLVM"
            echo "ATLAS_HOST_CXX=clang++-$LLVM"
            echo "ATLAS_HOST_CXXFLAGS=-stdlib=libc++"
            echo "ATLAS_HOST_LDFLAGS=-stdlib=libc++"
          } >> "$GITHUB_ENV"
          clang++-$LLVM --version | head -1
      - name: The sweeps
        run: >-
          ./gradlew :mapcorecheck:test --tests 'app.atlas.mapcorecheck.numerics.*'
          --tests 'app.atlas.mapcorecheck.tiles.L0DecodeTest.onDamagedTilesTheCoreAgreesWithTheKotlinReader'
          -Datlas.l0.damages=60000 -Patlas.mapcore.buildType=Release --stacktrace
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sweeps
          path: app/android/mapcorecheck/build/reports/tests/
          if-no-files-found: ignore

  vkcheck-asset:
    # A phone's VK check asset (plan-vector D16, K12): the oracle's references of the VK check cases at the phone's own
    # size and density, from its VK facts; an artifact, and with `release` an asset of that alpha.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.vkcheck != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK 37
        # NDK r30 and the SDK's CMake build the map core (:mapcore, app/android/mapcore/tools.properties).
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null
      - name: The canal ring's pack
        working-directory: .
        run: |
          f=cache/packs/regions/grachten.atlas
          mkdir -p cache/packs/regions
          curl -fsSL --retry 3 -o "$f" https://github.com/atlas-maps-app/Atlas/releases/download/packs-renders/grachten.atlas
          echo "3ec8629e2d3f5708a604ada1592b4bc4a5dd722e69c2aaefa1cbafe5811593ec  $f" | sha256sum -c -
      - name: The asset
        id: asset
        env:
          PHONE: ${{ inputs.vkcheck }}
        run: |
          ./gradlew :likeness:testDebugUnitTest --tests 'app.atlas.likeness.PhoneRefsTest' "-Datlas.likeness.phone=$PHONE" "-Datlas.likeness.asset=$GITHUB_WORKSPACE/vkcheck" --stacktrace
          echo "name=vkcheck-$(printf '%s' "${PHONE%:*}" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.asset.outputs.name }}
          path: vkcheck/*.zip
      - name: Attach it to the release
        if: ${{ inputs.release != '' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: gh release upload "$TAG" vkcheck/*.zip --clobber -R "${{ github.repository }}"
