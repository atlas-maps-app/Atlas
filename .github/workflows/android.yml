# Builds Atlas's Android app, runs every unit test (Robolectric draws real pixels for the screenshot tests)
# and keeps the debug APK, the bench APK (a non-debuggable build with the timings overlay: what a phone runs),
# the test reports and the screenshots as artifacts. The emulator jobs open both APKs and keep the engine's timings,
# memory, a simpleperf profile and the GL capabilities (app/android/ci/smoke.sh). Releases do not carry the bench APK.
#
# The checks run side by side on GitHub's runners, so a push has its word in about half an hour (the user, 30 October:
# "Optimize the flow. All the tests and suites we constantly run and wait on take too much time and slow us down"),
# and every check still runs on every push (29 October: "Make sure no quality is lost"): the APKs (apk), the app's
# unit tests (unit-app), every other module's (unit-rest), the JNI tests against the core's host build (mapcorecheck)
# and the likeness smoke tier (likeness) are jobs of their own, and once the APKs are built the emulator's work runs
# in five parts, each on an emulator of its own: the home and the filters with the bench APK's truth phase, the Vulkan
# core's phases (VK facts, bench and the crash guard, the frosted pills, the map), and every other screen in three
# shares. emulator-coverage then holds the parts to having opened each screen the app lists, and run each phase, once.
name: Android

on:
  push:
    branches: [main, app]
    paths: ['app/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/android/**', '.github/workflows/**']
  schedule:
    # nightly: the likeness harness's full tier and its history (plan-vector D16), on the work branch
    - cron: '23 2 * * *'
  workflow_dispatch:
    # A run by hand (gh workflow run android.yml --ref <branch> -f tests=false -f screens="home filters"): the device loop
    # for the engine's speed and memory, without the unit tests, on one emulator with every phase.
    inputs:
      tests:
        description: Run the unit tests
        type: boolean
        default: true
      screens:
        description: The screens to open on one emulator, space-separated (empty = every screen, in the parts of a push)
        type: string
        default: ''
      wait:
        description: Seconds to wait for the home's map and the filter probes
        type: number
        default: 180
      bench:
        description: Also run the bench APK (as installed and compiled, memory, simpleperf, GL capabilities)
        type: boolean
        default: true
      likeness:
        description: The likeness tier (smoke in the likeness job; full adds the nightly's two shards; off skips both)
        type: choice
        options: [smoke, full, 'off']
        default: smoke
      sweeps:
        description: Also run the core's full sweeps (pymath's parity at 10^7 a function, 60,000 damaged tiles; nightly always)
        type: boolean
        default: false
      vkcheck:
        description: Build the VK check asset for a phone as its VK facts give it, <model>:<w>x<h>[@<density>] (empty for none)
        type: string
        default: ''
      release:
        description: Attach that VK check asset to this release tag (an alpha; empty for none)
        type: string
        default: ''
      keep_caches:
        description: Keep this run's ccache entries for its branch, to measure warm runs of a change to CI (delete them after)
        type: boolean
        default: false

# A push to `app` never cancels a run in progress: each push's run has a group of its own and goes to its end beside
# the others, so an agent pushes when its change is ready, not when CI is idle, and every commit of `app` gets its word
# (the nightly alpha chooses among them). Anywhere else a newer push or run cancels the older run of its ref; the
# nightly has a group of its own, so a push while it runs leaves it to finish (its full likeness tier and history run
# only then).
concurrency:
  group: android-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}${{ github.ref == 'refs/heads/app' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/app' }}

jobs:
  # The APKs the emulator jobs open and the artifacts keep: the debug build and the bench build, their map core built
  # with NDK r30 for both ABIs through ccache.
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write # a push to app deletes the older entries of the job's ccache caches
    env:
      # The caches are kept by a push to app and by the nightly; every other run only restores them (GitHub lets a
      # branch's runs read the default branch's caches), unless a run by hand asks to keep its own (keep_caches).
      KEEP_CACHES: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/app') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.keep_caches) }}
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK 37
        # NDK r30 and the SDK's CMake build the map core (:mapcore), at the versions mapcore/tools.properties pins.
        run: |
          pin() { grep "^$1=" mapcore/tools.properties | cut -d= -f2-; }
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" \
            "ndk;$(pin ndk.version)" "cmake;$(pin cmake.version)" > /dev/null
      # ccache for the map core's C++ (ATLAS_CCACHE=1 makes mapcore/build.gradle.kts pass it to CMake as the compiler
      # launcher), in a folder of its own: the NDK builds' (debug and bench, both ABIs), whose one cache entry holds
      # what this job compiled last. A push to app and the nightly keep it and delete its older entries. A compiler is
      # known by what it says it is (--version): the NDK's clang, whose files each runner's install of the NDK gives
      # new times, and the host compiler of the build's own tool, nocontract. The sloppiness lets ccache cache the units
      # built with Vulkan-Hpp's precompiled header (CMakeLists.txt adds -fno-pch-timestamp).
      - name: ccache
        run: |
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q ccache > /dev/null
          ccache --version | sed -n 1p
          {
            echo "ATLAS_CCACHE=1"
            echo "CCACHE_DIR=$HOME/.cache/ccache-ndk"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=3G"
            echo "CCACHE_COMPILERCHECK=%compiler% --version"
            echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime"
          } >> "$GITHUB_ENV"
          date +%s > "$RUNNER_TEMP/ccache-since"
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache-ndk
          key: ccache-android-ndk-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-android-ndk-
      - name: "The packer's tool: LLVM's clang and libc++"
        run: |
          LLVM=$(grep -m1 "^  LLVM: '" ../../.github/workflows/core.yml | cut -d"'" -f2) # core.yml's pin: NDK r30's major
          [ -n "$LLVM" ] || { echo "::error::core.yml names no LLVM version"; exit 1; }
          codename=$(lsb_release -cs)
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$LLVM main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-$LLVM lld-$LLVM libc++-$LLVM-dev libc++abi-$LLVM-dev \
            libclang-rt-$LLVM-dev
          {
            echo "ATLAS_HOST_CC=clang-$LLVM"
            echo "ATLAS_HOST_CXX=clang++-$LLVM"
            echo "ATLAS_HOST_CXXFLAGS=-stdlib=libc++"
            echo "ATLAS_HOST_LDFLAGS=-stdlib=libc++"
          } >> "$GITHUB_ENV"
          clang++-$LLVM --version | head -1
      # The packer's tool (ENGINE.md step 3: the core's stage P, mapcore/cpp/stagep), which cuts the APK's tiles (the
      # Westerkerk's living pack, for VK facts' hash lines alone: :app's generateFactsTiles) and the canal ring the
      # emulator's runs draw (:app's benchTiles, in the New looks), both reading ATLAS_STAGEP, so they come from the code
      # the phone builds its windows with. Built alone (the host-stagep preset: no slangc, Vulkan or HarfBuzz) with LLVM's
      # clang and libc++ (above) and the SDK's CMake and Ninja, through a ccache folder and entry of its own (unit-app
      # restores it), the compiler known by its file's time and size. The Westerkerk's tiles are the port's cut's byte
      # for byte: :mapcorecheck's bundled tiles stay the port's, the reference its StagePPackerTest and CutParityTest hold
      # the core to, as do core.yml's.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache-stagep
          key: ccache-android-stagep-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-android-stagep-
      - name: "The packer's tool: the core's stage P"
        run: |
          cmake_bin="$ANDROID_HOME/cmake/$(grep '^cmake.version=' mapcore/tools.properties | cut -d= -f2-)/bin"
          cd mapcore/cpp
          export CCACHE_DIR=$HOME/.cache/ccache-stagep CCACHE_COMPILERCHECK=mtime
          CC="$ATLAS_HOST_CC" CXX="$ATLAS_HOST_CXX" CXXFLAGS="$ATLAS_HOST_CXXFLAGS" LDFLAGS="$ATLAS_HOST_LDFLAGS" \
            "$cmake_bin/cmake" --preset host-stagep -DCMAKE_MAKE_PROGRAM="$cmake_bin/ninja" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          "$cmake_bin/cmake" --build --preset host-stagep
          ccache --show-stats
          echo "ATLAS_STAGEP=$PWD/build/host-stagep/atlas_stagep" >> "$GITHUB_ENV"
      # benchTiles makes the canal ring the emulator's runs draw: no APK carries a map (ENGINE.md step 3, one pack per
      # country).
      - name: The APKs and the emulator's map
        id: apk
        run: |
          ccache --zero-stats > /dev/null
          ./gradlew assembleDebug assembleBench :app:benchTiles --stacktrace
          ccache --show-stats
      # The caches' entries, once the build is done: what this run's compilations used (the hits and the new units),
      # and nothing older, so each entry is one build's size however many runs came before. ccache marks a unit used
      # by its file's time.
      - name: Keep ccache's entries
        id: ccache_keep
        if: ${{ !cancelled() && steps.apk.outcome == 'success' && env.KEEP_CACHES == 'true' }}
        run: |
          since=$(cat "$RUNNER_TEMP/ccache-since")
          for dir in ~/.cache/ccache-ndk ~/.cache/ccache-stagep; do
            CCACHE_DIR=$dir ccache --evict-older-than "$(( $(date +%s) - since + 60 ))s"
            CCACHE_DIR=$dir ccache --show-stats | grep -E 'Cache size|Files'
          done
      - if: steps.ccache_keep.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache-ndk
          key: ccache-android-ndk-${{ github.run_id }}-${{ github.run_attempt }}
      - if: steps.ccache_keep.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache-stagep
          key: ccache-android-stagep-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Delete the older ccache entries
        if: steps.ccache_keep.outcome == 'success'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for prefix in ccache-android-ndk- ccache-android-stagep-; do
            key="$prefix${{ github.run_id }}-${{ github.run_attempt }}"
            # A deletion that fails leaves an older entry to GitHub's own eviction: a warning, not a failed check.
            ids=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$prefix" --limit 100 --json id,key \
              --jq ".[] | select(.key != \"$key\") | .id") || { echo "::warning::the caches could not be listed"; continue; }
            while read -r id; do
              [ -z "$id" ] || gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || echo "::warning::the entry $id was not deleted"
            done <<< "$ids"
          done
      - name: Keep the APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Keep the bench APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas-bench-apk
          path: app/android/app/build/outputs/apk/bench/*.apk
          if-no-files-found: ignore
      - name: Keep the emulator's map
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas-bench-packs
          path: app/android/app/build/generated/bench-tiles/*.atlas
          if-no-files-found: ignore

  # The app's unit tests (Robolectric's screenshots among them), with the tiles the APK carries (the Westerkerk's living
  # pack, for VK facts): the core's stage P cuts them, as in apk (whose ccache entry for the tool this job takes).
  unit-app:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.tests == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Gradle's caches are apk's to keep: a test job reads them, so the repository's caches stay bounded, and its tests
      # run on every push instead of coming from Gradle's build cache (where an input a test reads unseen, such as the
      # canal ring's pack, could leave a failure behind a result kept from before).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Android SDK 37
        run: |
          pin() { grep "^$1=" mapcore/tools.properties | cut -d= -f2-; }
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" \
            "ndk;$(pin ndk.version)" "cmake;$(pin cmake.version)" > /dev/null
      - name: "The packer's tool: LLVM's clang and libc++, and ccache"
        run: |
          LLVM=$(grep -m1 "^  LLVM: '" ../../.github/workflows/core.yml | cut -d"'" -f2) # core.yml's pin: NDK r30's major
          [ -n "$LLVM" ] || { echo "::error::core.yml names no LLVM version"; exit 1; }
          codename=$(lsb_release -cs)
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$LLVM main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-$LLVM lld-$LLVM libc++-$LLVM-dev libc++abi-$LLVM-dev \
            libclang-rt-$LLVM-dev ccache
          {
            echo "ATLAS_HOST_CC=clang-$LLVM"
            echo "ATLAS_HOST_CXX=clang++-$LLVM"
            echo "ATLAS_HOST_CXXFLAGS=-stdlib=libc++"
            echo "ATLAS_HOST_LDFLAGS=-stdlib=libc++"
          } >> "$GITHUB_ENV"
          clang++-$LLVM --version | head -1
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache-stagep
          key: ccache-android-stagep-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-android-stagep-
      - name: "The packer's tool: the core's stage P"
        run: |
          cmake_bin="$ANDROID_HOME/cmake/$(grep '^cmake.version=' mapcore/tools.properties | cut -d= -f2-)/bin"
          cd mapcore/cpp
          export CCACHE_DIR=$HOME/.cache/ccache-stagep CCACHE_BASEDIR=$GITHUB_WORKSPACE CCACHE_COMPILERCHECK=mtime
          CC="$ATLAS_HOST_CC" CXX="$ATLAS_HOST_CXX" CXXFLAGS="$ATLAS_HOST_CXXFLAGS" LDFLAGS="$ATLAS_HOST_LDFLAGS" \
            "$cmake_bin/cmake" --preset host-stagep -DCMAKE_MAKE_PROGRAM="$cmake_bin/ninja" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          "$cmake_bin/cmake" --build --preset host-stagep
          ccache --show-stats
          echo "ATLAS_STAGEP=$PWD/build/host-stagep/atlas_stagep" >> "$GITHUB_ENV"
      # The canal ring's element pack (packs-renders' grachten.atlas, by its SHA-256), which the modules' tests read
      # where it lies, cache/packs/regions (AnchorCases.grachten, the packer): without it they leave the canal ring's
      # cases out, and TextShapingTest fails. When one job ran every test it came with the packer's own fetch of it (the
      # APK's tiles, then the emulator's map); each test job takes it itself.
      - name: The canal ring's pack
        uses: actions/cache@v6
        with:
          path: cache/packs/regions/grachten.atlas
          key: likeness-pack-grachten-3ec8629e2d3f5708a604ada1592b4bc4a5dd722e69c2aaefa1cbafe5811593ec
      - name: Fetch the canal ring's pack
        working-directory: .
        run: |
          f=cache/packs/regions/grachten.atlas
          if [ ! -f "$f" ]; then
            mkdir -p cache/packs/regions
            curl -fsSL --retry 3 -o "$f" https://github.com/atlas-maps-app/Atlas/releases/download/packs-renders/grachten.atlas
          fi
          echo "3ec8629e2d3f5708a604ada1592b4bc4a5dd722e69c2aaefa1cbafe5811593ec  $f" | sha256sum -c -
      - name: The app's unit tests
        run: ./gradlew :app:testDebugUnitTest --continue --stacktrace
      - name: Keep the reports and pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas-reports-app
          path: |
            app/android/**/build/reports/tests/
            app/android/**/build/outputs/roborazzi/
            app/android/**/build/preview/
            app/android/**/build/screenshots/
            cache/svg-android/compare/
          if-no-files-found: ignore

  # Every other module's unit tests: the JVM modules' test and the Android libraries' testDebugUnitTest, without the
  # app's (unit-app), :mapcorecheck's (mapcorecheck) and the likeness harness's (likeness).
  unit-rest:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.tests == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Gradle's caches are apk's to keep: a test job reads them, so the repository's caches stay bounded, and its tests
      # run on every push instead of coming from Gradle's build cache (where an input a test reads unseen, such as the
      # canal ring's pack, could leave a failure behind a result kept from before).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Android SDK 37
        run: |
          pin() { grep "^$1=" mapcore/tools.properties | cut -d= -f2-; }
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" \
            "ndk;$(pin ndk.version)" "cmake;$(pin cmake.version)" > /dev/null
      # The canal ring's element pack (packs-renders' grachten.atlas, by its SHA-256), which the modules' tests read
      # where it lies, cache/packs/regions (AnchorCases.grachten, the packer): without it they leave the canal ring's
      # cases out, and TextShapingTest fails. When one job ran every test it came with the packer's own fetch of it (the
      # APK's tiles, then the emulator's map); each test job takes it itself.
      - name: The canal ring's pack
        uses: actions/cache@v6
        with:
          path: cache/packs/regions/grachten.atlas
          key: likeness-pack-grachten-3ec8629e2d3f5708a604ada1592b4bc4a5dd722e69c2aaefa1cbafe5811593ec
      - name: Fetch the canal ring's pack
        working-directory: .
        run: |
          f=cache/packs/regions/grachten.atlas
          if [ ! -f "$f" ]; then
            mkdir -p cache/packs/regions
            curl -fsSL --retry 3 -o "$f" https://github.com/atlas-maps-app/Atlas/releases/download/packs-renders/grachten.atlas
          fi
          echo "3ec8629e2d3f5708a604ada1592b4bc4a5dd722e69c2aaefa1cbafe5811593ec  $f" | sha256sum -c -
      - name: The modules' unit tests
        run: >-
          ./gradlew test testDebugUnitTest -x :app:testDebugUnitTest -x :mapcorecheck:test -x :likeness:testDebugUnitTest
          --continue --stacktrace
      - name: Keep the reports and pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas-reports-rest
          path: |
            app/android/**/build/reports/tests/
            app/android/**/build/outputs/roborazzi/
            app/android/**/build/preview/
            app/android/**/build/screenshots/
            cache/svg-android/compare/
          if-no-files-found: ignore

  # :mapcorecheck's JNI tests (the tile reader's L0, the style's parity, the likeness candidates; mapcorecheck/
  # build.gradle.kts's coreHost task builds the core's host library for them): LLVM's clang and libc++, as core.yml
  # installs them (Ubuntu's own clang lacks libc++'s C++23), and lavapipe with the validation layer from the pinned
  # emulator package, as core.yml's x86_64 jobs get it. They reach only that task and those tests (ATLAS_HOST_* and
  # ATLAS_LAVAPIPE_DIR). ccache keeps the host build's units in a folder and entry of their own (the likeness job
  # restores it), the compiler known by its file's time and size. pymath's parity sweep (MT/numerics) runs 10^5
  # arguments a function here, and the tile reader's differential check 1,500 damaged tiles; the sweeps job runs the
  # plan's 10^7 and 60,000 nightly.
  mapcorecheck:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.tests == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write # a push to app deletes the older entries of the job's ccache cache
    env:
      KEEP_CACHES: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/app') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.keep_caches) }}
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Gradle's caches are apk's to keep: a test job reads them, so the repository's caches stay bounded, and its tests
      # run on every push instead of coming from Gradle's build cache (where an input a test reads unseen, such as the
      # canal ring's pack, could leave a failure behind a result kept from before).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Android SDK 37
        run: |
          pin() { grep "^$1=" mapcore/tools.properties | cut -d= -f2-; }
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" \
            "ndk;$(pin ndk.version)" "cmake;$(pin cmake.version)" > /dev/null
      - name: "Map core host build: LLVM's clang and libc++, and ccache"
        run: |
          LLVM=$(grep -m1 "^  LLVM: '" ../../.github/workflows/core.yml | cut -d"'" -f2) # core.yml's pin: NDK r30's major
          [ -n "$LLVM" ] || { echo "::error::core.yml names no LLVM version"; exit 1; }
          codename=$(lsb_release -cs)
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$LLVM main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-$LLVM lld-$LLVM libc++-$LLVM-dev libc++abi-$LLVM-dev \
            libclang-rt-$LLVM-dev ccache
          {
            echo "ATLAS_HOST_CC=clang-$LLVM"
            echo "ATLAS_HOST_CXX=clang++-$LLVM"
            echo "ATLAS_HOST_CXXFLAGS=-stdlib=libc++"
            echo "ATLAS_HOST_LDFLAGS=-stdlib=libc++"
            echo "ATLAS_CCACHE=1"
            echo "CCACHE_DIR=$HOME/.cache/ccache-host"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=2G"
            echo "CCACHE_COMPILERCHECK=mtime"
            echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime"
          } >> "$GITHUB_ENV"
          clang++-$LLVM --version | head -1
          date +%s > "$RUNNER_TEMP/ccache-since"
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache-host
          key: ccache-android-host-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-android-host-
      - name: "Map core host build: the emulator package's pin"
        run: echo "EMULATOR_SHA1=$(grep '^emulator.linux-x86_64.sha1=' mapcore/tools.properties | cut -d= -f2-)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/emulator-vulkan
          key: emulator-vulkan-${{ env.EMULATOR_SHA1 }}
      - name: "Map core host build: lavapipe from the pinned emulator package"
        run: |
          dir="$RUNNER_TEMP/emulator-vulkan"
          if [ ! -e "$dir/lvp_icd.json" ]; then
            file=$(grep '^emulator.linux-x86_64.file=' mapcore/tools.properties | cut -d= -f2-)
            curl -fsSLo "$RUNNER_TEMP/$file" "https://dl.google.com/android/repository/$file"
            echo "$EMULATOR_SHA1  $RUNNER_TEMP/$file" | sha1sum -c -
            unzip -q "$RUNNER_TEMP/$file" 'emulator/lib64/vulkan/*' -d "$RUNNER_TEMP/emulator"
            rm "$RUNNER_TEMP/$file"
            mv "$RUNNER_TEMP/emulator/emulator/lib64/vulkan" "$dir"
            rm -f "$dir"/*swiftshader* "$dir"/*MoltenVK* "$dir"/*kosmickrisp* "$dir"/glslangValidator
          fi
          ls -la "$dir" "$dir/layers" || true
          echo "ATLAS_LAVAPIPE_DIR=$dir" >> "$GITHUB_ENV"
          if [ ! -e "$dir/libvulkan.so.1" ] && [ ! -e "$dir/libvulkan.so" ]; then
            sudo apt-get install -y -q libvulkan1 > /dev/null
            echo "ATLAS_VULKAN_LOADER=/usr/lib/x86_64-linux-gnu/libvulkan.so.1" >> "$GITHUB_ENV"
          fi
      # The canal ring's element pack (packs-renders' grachten.atlas, by its SHA-256), which the modules' tests read
      # where it lies, cache/packs/regions (AnchorCases.grachten, the packer): without it they leave the canal ring's
      # cases out, and TextShapingTest fails. When one job ran every test it came with the packer's own fetch of it (the
      # APK's tiles, then the emulator's map); each test job takes it itself.
      - name: The canal ring's pack
        uses: actions/cache@v6
        with:
          path: cache/packs/regions/grachten.atlas
          key: likeness-pack-grachten-3ec8629e2d3f5708a604ada1592b4bc4a5dd722e69c2aaefa1cbafe5811593ec
      - name: Fetch the canal ring's pack
        working-directory: .
        run: |
          f=cache/packs/regions/grachten.atlas
          if [ ! -f "$f" ]; then
            mkdir -p cache/packs/regions
            curl -fsSL --retry 3 -o "$f" https://github.com/atlas-maps-app/Atlas/releases/download/packs-renders/grachten.atlas
          fi
          echo "3ec8629e2d3f5708a604ada1592b4bc4a5dd722e69c2aaefa1cbafe5811593ec  $f" | sha256sum -c -
      - name: The core's host build
        id: core_host
        run: |
          ccache --zero-stats > /dev/null
          ./gradlew :mapcorecheck:coreHost --stacktrace
          ccache --show-stats
      - name: The JNI tests
        if: steps.core_host.outcome == 'success'
        run: ./gradlew :mapcorecheck:test -Datlas.numerics.n=100000 --continue --stacktrace
      - name: Keep ccache's entry
        id: ccache_keep
        if: ${{ !cancelled() && steps.core_host.outcome == 'success' && env.KEEP_CACHES == 'true' }}
        run: |
          since=$(cat "$RUNNER_TEMP/ccache-since")
          ccache --evict-older-than "$(( $(date +%s) - since + 60 ))s"
          ccache --show-stats | grep -E 'Cache size|Files'
      - if: steps.ccache_keep.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache-host
          key: ccache-android-host-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Delete the older ccache entries
        if: steps.ccache_keep.outcome == 'success'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix=ccache-android-host-
          key="$prefix${{ github.run_id }}-${{ github.run_attempt }}"
          # A deletion that fails leaves an older entry to GitHub's own eviction: a warning, not a failed check.
          ids=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$prefix" --limit 100 --json id,key \
            --jq ".[] | select(.key != \"$key\") | .id") || { echo "::warning::the caches could not be listed"; exit 0; }
          while read -r id; do
            [ -z "$id" ] || gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || echo "::warning::the entry $id was not deleted"
          done <<< "$ids"
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas-reports-mapcorecheck
          path: app/android/mapcorecheck/build/reports/tests/
          if-no-files-found: ignore

  # The likeness harness (plan-vector D16, K4), whatever `tests` says, so a likeness failure never costs the APKs, the
  # unit tests' reports or the emulator's run: the port's references (cached by the sources that draw them), the
  # candidates (the core's host build on lavapipe, through mapcorecheck's ccache entry) judged by thresholds.json, the
  # planted failures on the stub, the report and the ratchet's proposal (artifact `likeness`).
  likeness:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.likeness == 'off') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Gradle's caches are apk's to keep: a test job reads them, so the repository's caches stay bounded, and its tests
      # run on every push instead of coming from Gradle's build cache (where an input a test reads unseen, such as the
      # canal ring's pack, could leave a failure behind a result kept from before).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Android SDK 37
        run: |
          pin() { grep "^$1=" mapcore/tools.properties | cut -d= -f2-; }
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" \
            "ndk;$(pin ndk.version)" "cmake;$(pin cmake.version)" > /dev/null
      - name: "Map core host build: LLVM's clang and libc++, and ccache"
        run: |
          LLVM=$(grep -m1 "^  LLVM: '" ../../.github/workflows/core.yml | cut -d"'" -f2) # core.yml's pin: NDK r30's major
          [ -n "$LLVM" ] || { echo "::error::core.yml names no LLVM version"; exit 1; }
          codename=$(lsb_release -cs)
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$LLVM main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-$LLVM lld-$LLVM libc++-$LLVM-dev libc++abi-$LLVM-dev \
            libclang-rt-$LLVM-dev ccache
          {
            echo "ATLAS_HOST_CC=clang-$LLVM"
            echo "ATLAS_HOST_CXX=clang++-$LLVM"
            echo "ATLAS_HOST_CXXFLAGS=-stdlib=libc++"
            echo "ATLAS_HOST_LDFLAGS=-stdlib=libc++"
            echo "ATLAS_CCACHE=1"
            echo "CCACHE_DIR=$HOME/.cache/ccache-host"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=2G"
            echo "CCACHE_COMPILERCHECK=mtime"
            echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime"
          } >> "$GITHUB_ENV"
          clang++-$LLVM --version | head -1
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache-host
          key: ccache-android-host-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-android-host-
      - name: "Map core host build: the emulator package's pin"
        run: echo "EMULATOR_SHA1=$(grep '^emulator.linux-x86_64.sha1=' mapcore/tools.properties | cut -d= -f2-)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/emulator-vulkan
          key: emulator-vulkan-${{ env.EMULATOR_SHA1 }}
      - name: "Map core host build: lavapipe from the pinned emulator package"
        run: |
          dir="$RUNNER_TEMP/emulator-vulkan"
          if [ ! -e "$dir/lvp_icd.json" ]; then
            file=$(grep '^emulator.linux-x86_64.file=' mapcore/tools.properties | cut -d= -f2-)
            curl -fsSLo "$RUNNER_TEMP/$file" "https://dl.google.com/android/repository/$file"
            echo "$EMULATOR_SHA1  $RUNNER_TEMP/$file" | sha1sum -c -
            unzip -q "$RUNNER_TEMP/$file" 'emulator/lib64/vulkan/*' -d "$RUNNER_TEMP/emulator"
            rm "$RUNNER_TEMP/$file"
            mv "$RUNNER_TEMP/emulator/emulator/lib64/vulkan" "$dir"
            rm -f "$dir"/*swiftshader* "$dir"/*MoltenVK* "$dir"/*kosmickrisp* "$dir"/glslangValidator
          fi
          ls -la "$dir" "$dir/layers" || true
          echo "ATLAS_LAVAPIPE_DIR=$dir" >> "$GITHUB_ENV"
          if [ ! -e "$dir/libvulkan.so.1" ] && [ ! -e "$dir/libvulkan.so" ]; then
            sudo apt-get install -y -q libvulkan1 > /dev/null
            echo "ATLAS_VULKAN_LOADER=/usr/lib/x86_64-linux-gnu/libvulkan.so.1" >> "$GITHUB_ENV"
          fi
      - name: The tier
        id: likeness
        env:
          TIER: ${{ inputs.likeness }}
        run: echo "tier=${TIER:-smoke}" | sed 's/=full$/=smoke/' >> "$GITHUB_OUTPUT"
      - name: The canal ring's pack
        uses: actions/cache@v6
        with:
          path: cache/packs/regions/grachten.atlas
          key: likeness-pack-grachten-3ec8629e2d3f5708a604ada1592b4bc4a5dd722e69c2aaefa1cbafe5811593ec
      - name: Fetch the canal ring's pack
        working-directory: .
        run: |
          f=cache/packs/regions/grachten.atlas
          if [ ! -f "$f" ]; then
            mkdir -p cache/packs/regions
            curl -fsSL --retry 3 -o "$f" https://github.com/atlas-maps-app/Atlas/releases/download/packs-renders/grachten.atlas
          fi
          echo "3ec8629e2d3f5708a604ada1592b4bc4a5dd722e69c2aaefa1cbafe5811593ec  $f" | sha256sum -c -
      - name: Restore the references
        id: refs
        uses: actions/cache/restore@v6
        with:
          path: cache/likeness/refs
          key: likeness-refs-smoke-${{ runner.arch }}-${{ hashFiles('app/android/render/src/main/**', 'app/android/anchor/src/main/**', 'app/android/anchor/src/testFixtures/**', 'app/android/mapview/src/main/kotlin/app/atlas/mapview/svg/**', 'app/android/mapview/src/main/assets/svgfonts/**', 'app/android/likeness/**', 'app/android/mapcorecheck/src/test/resources/likeness/cases/**', 'app/android/gradle/libs.versions.toml') }}
      - name: References
        id: references
        # a cold smoke build must take no more than 4 minutes (K4's acceptance)
        run: ./gradlew :likeness:testDebugUnitTest -Datlas.likeness.tier=smoke -Datlas.likeness.budget=240 --stacktrace
      - name: Keep the references
        if: ${{ !cancelled() && steps.references.outcome == 'success' && steps.refs.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: cache/likeness/refs
          key: ${{ steps.refs.outputs.cache-primary-key }}
      - name: Candidates and gates
        if: ${{ !cancelled() }}
        run: >-
          ./gradlew :mapcorecheck:test --tests 'app.atlas.mapcorecheck.likeness.*' -Datlas.likeness.tier=smoke -Datlas.likeness.require=true
          -Datlas.likeness.platform=lavapipe-x86_64 -Datlas.likeness.commit=${{ github.sha }}
          -Datlas.likeness.report=${{ github.workspace }}/likeness --stacktrace
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: likeness
          path: likeness/
          if-no-files-found: ignore

  emulator:
    # The real thing: the APK on an Android emulator, opened on each screen, with screenshots and frame timings, in
    # parts on emulators of their own (smoke.sh's ATLAS_PHASES and ATLAS_SCREENS_*): bench, the home and the filters
    # at the debug build's first launch and then the bench APK's truth phase, which tables both; vk, VK facts, VK bench
    # and the crash guard, the frosted pills and the map drawn by the core, in that order on one emulator (the map's
    # launches find the pipeline cache warm); and screens-<k>, every third of the other screens from the k-th. A run by
    # hand that names its screens opens them on one emulator, every phase after them. It runs whenever the APKs were
    # built, even when a unit test failed: the device's word is worth having either way.
    name: emulator ${{ matrix.part }}
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.screens != '' && '["all"]' || '["bench", "vk", "screens-1", "screens-2", "screens-3"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: atlas-debug-apk
          path: apk
      - uses: actions/download-artifact@v8
        if: matrix.part == 'bench' || matrix.part == 'all'
        continue-on-error: true
        with:
          name: atlas-bench-apk
          path: apk-bench
      # The map the runs draw at the Westerkerk home (VK bench's map, the home's frames): the canal ring, which smoke.sh
      # puts on the device for the debug and bench builds to list (MainActivity.BENCH_PACKS), as no APK carries a map.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: atlas-bench-packs
          path: bench-packs
      - name: The part's switches
        env:
          PART: ${{ matrix.part }}
          SCREENS: ${{ inputs.screens }}
          WAIT: ${{ inputs.wait || 180 }}
          BENCH: ${{ github.event_name == 'workflow_dispatch' && inputs.bench == false && '0' || '1' }}
        run: |
          {
            echo "ATLAS_MAP_WAIT=$WAIT"
            echo "ATLAS_BENCH=$BENCH"
            echo "ATLAS_PACKS=bench-packs"
            case "$PART" in
              all) echo "ATLAS_SCREENS=$SCREENS" ;;
              bench) echo "ATLAS_SCREENS=home filters"; echo "ATLAS_PHASES=screens truth" ;;
              vk) echo "ATLAS_PHASES=vk pills map" ;;
              screens-*) echo "ATLAS_SCREENS_SKIP=home filters"; echo "ATLAS_SCREENS_PART=${PART#screens-}/3"; echo "ATLAS_PHASES=screens" ;;
              *) echo "::error::no part $PART"; exit 1 ;;
            esac
          } | tee -a "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator build whose package core.yml's x86_64 jobs take lavapipe and the validation layer from
      # (app/android/mapcore/tools.properties), so the guest's Vulkan and the host tests' are the same lavapipe.
      - name: The pinned emulator build
        id: emulator
        run: |
          build=$(sed -n 's/^emulator\.linux-x86_64\.file=emulator-linux_x64-\([0-9]*\)\.zip$/\1/p' app/android/mapcore/tools.properties)
          [ -n "$build" ] || { echo "::error::tools.properties names no emulator build"; exit 1; }
          echo "build=$build" >> "$GITHUB_OUTPUT"
      # The hashes the emulator must reproduce (the host build's numerics, sun bits, ground and twin check) are
      # app/android/ci/hashes.env's, which smoke.sh reads: outside the workflows, so a change of the engine's that moves
      # one edits no workflow file (the nightly alpha's token may not tag a commit whose workflow files differ from the
      # default branch's).
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-build: ${{ steps.emulator.outputs.build }}
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          # lavapipe: Mesa's Vulkan for the guest (the driver the host tests use) and the emulator's own software GLES. The
          # deprecated swiftshader_indirect hung HWUI's first program compile on its host GL pipe on every debug-first run.
          emulator-options: -no-window -gpu lavapipe -noaudio -no-boot-anim -camera-back none
          script: bash app/android/ci/smoke.sh apk shots apk-bench
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas-emulator-${{ matrix.part }}
          path: shots/
          if-no-files-found: ignore
      # The part's screens and phases alone, for emulator-coverage.
      - name: Keep the part's list
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-part-${{ matrix.part }}
          path: |
            shots/screens.txt
            shots/screens-all.txt
            shots/phases.txt
          if-no-files-found: ignore

  # The emulator's parts opened every screen the app lists for CI exactly once between them, and ran each phase (VK
  # facts, bench and guard; the pills; the map; the truth phase, unless a run by hand left the bench out) exactly once.
  emulator-coverage:
    needs: emulator
    if: ${{ !cancelled() && needs.emulator.result != 'skipped' && !(github.event_name == 'workflow_dispatch' && inputs.screens != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: emulator-part-*
          path: parts
      - name: Each screen and phase once
        env:
          BENCH: ${{ github.event_name == 'workflow_dispatch' && inputs.bench == false && '0' || '1' }}
        run: |
          status=0
          ls parts
          for part in parts/*/; do
            [ -s "$part/screens-all.txt" ] || { echo "::error::$(basename "$part") kept no list of the app's screens"; status=1; }
          done
          all=$(cat parts/*/screens-all.txt | grep . | sort -u || true)
          if [ "$(cat parts/*/screens-all.txt | grep . | sort | uniq -c | awk '{ print $1 }' | sort -u | wc -l)" != 1 ]; then
            echo "::error::the parts' emulators listed different screens"; status=1
          fi
          opened=$(cat parts/*/screens.txt | grep . | sort || true)
          missing=$(comm -23 <(sort -u <<< "$all") <(sort -u <<< "$opened"))
          twice=$(uniq -d <<< "$opened")
          extra=$(comm -13 <(sort -u <<< "$all") <(sort -u <<< "$opened"))
          [ -z "$missing" ] || { echo "::error::screens no part opened: $(tr '\n' ' ' <<< "$missing")"; status=1; }
          [ -z "$twice" ] || { echo "::error::screens more than one part opened: $(tr '\n' ' ' <<< "$twice")"; status=1; }
          [ -z "$extra" ] || { echo "::error::screens the app does not list: $(tr '\n' ' ' <<< "$extra")"; status=1; }
          phases=$(cat parts/*/phases.txt | grep . | grep -v -x screens | sort || true)
          want="map pills vk"
          if [ "$BENCH" = 1 ]; then want="map pills truth vk"; fi
          if [ "$(tr '\n' ' ' <<< "$phases" | sed 's/ $//')" != "$want" ]; then
            echo "::error::the parts ran the phases '$(tr '\n' ' ' <<< "$phases")', not each of '$want' once"; status=1
          fi
          echo "$(wc -l <<< "$opened") screens opened of the app's $(wc -l <<< "$all"); phases: $(tr '\n' ' ' <<< "$phases")"
          exit "$status"

  likeness-full:
    # The likeness harness's full tier (plan-vector D16): nightly, and on dispatch with likeness=full; two shards.
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.likeness == 'full') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v7
        with:
          # the nightly runs from the default branch's workflow; it judges the work branch
          ref: ${{ github.event_name == 'schedule' && 'app' || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK 37
        # NDK r30 and the SDK's CMake build the map core (:mapcore, app/android/mapcore/tools.properties).
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null
      # :mapcorecheck:test builds the core's host library (coreHost) and draws the candidates on lavapipe: the build job's
      # LLVM and the pinned emulator package's lavapipe
      - name: "Map core host build: LLVM's clang and libc++"
        run: |
          LLVM=$(grep -m1 "^  LLVM: '" ../../.github/workflows/core.yml | cut -d"'" -f2) # core.yml's pin: NDK r30's major
          [ -n "$LLVM" ] || { echo "::error::core.yml names no LLVM version"; exit 1; }
          codename=$(lsb_release -cs)
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$LLVM main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-$LLVM lld-$LLVM libc++-$LLVM-dev libc++abi-$LLVM-dev \
            libclang-rt-$LLVM-dev
          {
            echo "ATLAS_HOST_CC=clang-$LLVM"
            echo "ATLAS_HOST_CXX=clang++-$LLVM"
            echo "ATLAS_HOST_CXXFLAGS=-stdlib=libc++"
            echo "ATLAS_HOST_LDFLAGS=-stdlib=libc++"
          } >> "$GITHUB_ENV"
          clang++-$LLVM --version | head -1
      - name: "Map core host build: the emulator package's pin"
        run: echo "EMULATOR_SHA1=$(grep '^emulator.linux-x86_64.sha1=' mapcore/tools.properties | cut -d= -f2-)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/emulator-vulkan
          key: emulator-vulkan-${{ env.EMULATOR_SHA1 }}
      - name: "Map core host build: lavapipe from the pinned emulator package"
        run: |
          dir="$RUNNER_TEMP/emulator-vulkan"
          if [ ! -e "$dir/lvp_icd.json" ]; then
            file=$(grep '^emulator.linux-x86_64.file=' mapcore/tools.properties | cut -d= -f2-)
            curl -fsSLo "$RUNNER_TEMP/$file" "https://dl.google.com/android/repository/$file"
            echo "$EMULATOR_SHA1  $RUNNER_TEMP/$file" | sha1sum -c -
            unzip -q "$RUNNER_TEMP/$file" 'emulator/lib64/vulkan/*' -d "$RUNNER_TEMP/emulator"
            rm "$RUNNER_TEMP/$file"
            mv "$RUNNER_TEMP/emulator/emulator/lib64/vulkan" "$dir"
            rm -f "$dir"/*swiftshader* "$dir"/*MoltenVK* "$dir"/*kosmickrisp* "$dir"/glslangValidator
          fi
          ls -la "$dir" "$dir/layers" || true
          echo "ATLAS_LAVAPIPE_DIR=$dir" >> "$GITHUB_ENV"
          if [ ! -e "$dir/libvulkan.so.1" ] && [ ! -e "$dir/libvulkan.so" ]; then
            sudo apt-get install -y -q libvulkan1 > /dev/null
            echo "ATLAS_VULKAN_LOADER=/usr/lib/x86_64-linux-gnu/libvulkan.so.1" >> "$GITHUB_ENV"
          fi
      - name: The canal ring's pack
        uses: actions/cache@v6
        with:
          path: cache/packs/regions/grachten.atlas
          key: likeness-pack-grachten-3ec8629e2d3f5708a604ada1592b4bc4a5dd722e69c2aaefa1cbafe5811593ec
      - name: Fetch the canal ring's pack
        working-directory: .
        run: |
          f=cache/packs/regions/grachten.atlas
          if [ ! -f "$f" ]; then
            mkdir -p cache/packs/regions
            curl -fsSL --retry 3 -o "$f" https://github.com/atlas-maps-app/Atlas/releases/download/packs-renders/grachten.atlas
          fi
          echo "3ec8629e2d3f5708a604ada1592b4bc4a5dd722e69c2aaefa1cbafe5811593ec  $f" | sha256sum -c -
      - name: Restore the references
        id: refs
        uses: actions/cache/restore@v6
        with:
          path: cache/likeness/refs
          key: likeness-refs-full-${{ matrix.shard }}-${{ runner.arch }}-${{ hashFiles('app/android/render/src/main/**', 'app/android/anchor/src/main/**', 'app/android/anchor/src/testFixtures/**', 'app/android/mapview/src/main/kotlin/app/atlas/mapview/svg/**', 'app/android/mapview/src/main/assets/svgfonts/**', 'app/android/likeness/**', 'app/android/mapcorecheck/src/test/resources/likeness/cases/**', 'app/android/gradle/libs.versions.toml') }}
      - name: References
        run: ./gradlew :likeness:testDebugUnitTest --tests 'app.atlas.likeness.ReferencesTest' -Datlas.likeness.tier=full -Datlas.likeness.shard=${{ matrix.shard }}/2 -Plikeness.heap=7g --stacktrace
      - name: Keep the references
        if: steps.refs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: cache/likeness/refs
          key: ${{ steps.refs.outputs.cache-primary-key }}
      - name: Candidates and gates
        run: >-
          ./gradlew :mapcorecheck:test --tests 'app.atlas.mapcorecheck.likeness.*' -Datlas.likeness.tier=full -Datlas.likeness.require=true
          -Datlas.likeness.platform=lavapipe-x86_64 -Datlas.likeness.commit=${{ github.sha }}
          -Datlas.likeness.report=${{ github.workspace }}/likeness --stacktrace
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: likeness-full-${{ matrix.shard }}
          path: likeness/
          if-no-files-found: ignore

  likeness-history:
    # Nightly: each case's MAD and share within 2 appended to the history of the last 30 nightly runs (plan-vector D16).
    needs: likeness-full
    if: ${{ github.event_name == 'schedule' && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: likeness-full-*
          path: likeness
      - name: The history so far, and tonight's
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p history
          prev=$(gh run list -R "$REPO" --workflow android.yml --event schedule --status completed -L 5 --json databaseId -q '.[].databaseId' | grep -vx "$RUN" | head -1 || true)
          if [ -n "$prev" ]; then gh run download "$prev" -R "$REPO" -n likeness-history -D history || true; fi
          touch history/likeness-history.tsv
          when=$(date -u +%Y-%m-%dT%H:%MZ)
          cat likeness/*/likeness.log 2>/dev/null | grep -E '^likeness [^:]+: MAD' | sed -E "s/^likeness ([^:]+): MAD ([^ ]+) within2 ([^ ]+).*/$when\t$SHA\t\1\t\2\t\3/" >> history/likeness-history.tsv
          cut -f1 history/likeness-history.tsv | sort -u | tail -30 > history/runs
          grep -F -f history/runs history/likeness-history.tsv > history/kept || true
          mv history/kept history/likeness-history.tsv && rm history/runs
          tail -40 history/likeness-history.tsv
      - uses: actions/upload-artifact@v7
        with:
          name: likeness-history
          path: history/likeness-history.tsv
          retention-days: 90

  sweeps:
    # The core's full sweeps, on a Release host build: pymath's parity (L0 d, plan-vector D16, K3b), 10^7 arguments a
    # function bit for bit against StrictMath and PyMath (and its sin timing, reported); and the tile reader's
    # differential check (L0 b, K3), 60,000 damaged tiles of the bundled packs through the core and the Kotlin reader,
    # which must agree on every one (about a minute). Nightly, and on dispatch with sweeps; the build job runs 10^5 and
    # 1,500.
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sweeps) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v7
        with:
          # the nightly runs from the default branch's workflow; it judges the work branch
          ref: ${{ github.event_name == 'schedule' && 'app' || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK 37
        # the SDK's CMake builds the core's host library (:mapcorecheck's coreHost, app/android/mapcore/tools.properties)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null
      - name: "Map core host build: LLVM's clang and libc++"
        run: |
          LLVM=$(grep -m1 "^  LLVM: '" ../../.github/workflows/core.yml | cut -d"'" -f2) # core.yml's pin: NDK r30's major
          [ -n "$LLVM" ] || { echo "::error::core.yml names no LLVM version"; exit 1; }
          codename=$(lsb_release -cs)
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$LLVM main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-$LLVM lld-$LLVM libc++-$LLVM-dev libc++abi-$LLVM-dev \
            libclang-rt-$LLVM-dev
          {
            echo "ATLAS_HOST_CC=clang-$LLVM"
            echo "ATLAS_HOST_CXX=clang++-$LLVM"
            echo "ATLAS_HOST_CXXFLAGS=-stdlib=libc++"
            echo "ATLAS_HOST_LDFLAGS=-stdlib=libc++"
          } >> "$GITHUB_ENV"
          clang++-$LLVM --version | head -1
      - name: The sweeps
        run: >-
          ./gradlew :mapcorecheck:test --tests 'app.atlas.mapcorecheck.numerics.*'
          --tests 'app.atlas.mapcorecheck.tiles.L0DecodeTest.onDamagedTilesTheCoreAgreesWithTheKotlinReader'
          -Datlas.l0.damages=60000 -Patlas.mapcore.buildType=Release --stacktrace
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sweeps
          path: app/android/mapcorecheck/build/reports/tests/
          if-no-files-found: ignore

  vkcheck-asset:
    # A phone's VK check asset (plan-vector D16, K12): the oracle's references of the VK check cases at the phone's own
    # size and density, from its VK facts; an artifact, and with `release` an asset of that alpha.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.vkcheck != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK 37
        # NDK r30 and the SDK's CMake build the map core (:mapcore, app/android/mapcore/tools.properties).
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null
      - name: The canal ring's pack
        working-directory: .
        run: |
          f=cache/packs/regions/grachten.atlas
          mkdir -p cache/packs/regions
          curl -fsSL --retry 3 -o "$f" https://github.com/atlas-maps-app/Atlas/releases/download/packs-renders/grachten.atlas
          echo "3ec8629e2d3f5708a604ada1592b4bc4a5dd722e69c2aaefa1cbafe5811593ec  $f" | sha256sum -c -
      - name: The asset
        id: asset
        env:
          PHONE: ${{ inputs.vkcheck }}
        run: |
          ./gradlew :likeness:testDebugUnitTest --tests 'app.atlas.likeness.PhoneRefsTest' "-Datlas.likeness.phone=$PHONE" "-Datlas.likeness.asset=$GITHUB_WORKSPACE/vkcheck" --stacktrace
          echo "name=vkcheck-$(printf '%s' "${PHONE%:*}" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.asset.outputs.name }}
          path: vkcheck/*.zip
      - name: Attach it to the release
        if: ${{ inputs.release != '' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: gh release upload "$TAG" vkcheck/*.zip --clobber -R "${{ github.repository }}"
