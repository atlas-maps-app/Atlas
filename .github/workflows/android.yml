# Builds Atlas's Android app, runs every unit test (Robolectric draws real pixels for the screenshot tests)
# and keeps the debug APK, the test reports and the screenshots as artifacts.
name: Android

on:
  push:
    branches: [main, app]
    paths: ['app/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/android/**', '.github/workflows/**']
  workflow_dispatch:
    # A run by hand (gh workflow run android.yml --ref <branch> -f tests=false -f screens="home filters"): the device loop
    # for the engine's speed and memory, without the half hour of unit tests.
    inputs:
      tests:
        description: Run the unit tests
        type: boolean
        default: true
      screens:
        description: The screens to open on the emulator, space-separated (empty = every screen)
        type: string
        default: ''
      wait:
        description: Seconds to wait for the home's map and the filter probes
        type: number
        default: 180

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Test and build
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.tests }}" = "false" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            ./gradlew test testDebugUnitTest assembleDebug --continue --stacktrace
          fi
      - name: Keep the APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Keep the reports and pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas-reports
          path: |
            app/android/**/build/reports/tests/
            app/android/**/build/outputs/roborazzi/
            app/android/**/build/preview/
            app/android/**/build/screenshots/
            cache/svg-android/compare/
          if-no-files-found: ignore

  emulator:
    # The real thing: the APK on an Android emulator, opened on each screen, with screenshots and frame timings.
    # It runs whenever the APK was built, even when a unit test failed: the device's word is worth having either way.
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: atlas-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ATLAS_SCREENS="${{ inputs.screens }}" ATLAS_MAP_WAIT="${{ inputs.wait || 180 }}" bash app/android/ci/smoke.sh apk shots
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas-emulator
          path: shots/
          if-no-files-found: ignore
