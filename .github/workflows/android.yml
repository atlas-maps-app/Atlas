  # :mapcorecheck's JNI tests (the tile reader's L0, the style's layouts, stage P's cut, the engine's references;
  # mapcorecheck/build.gradle.kts's coreHost task builds the core's host library for them): LLVM's clang and libc++, as
  # core.yml installs them (Ubuntu's own clang lacks libc++'s C++23), and lavapipe with the validation layer from the
  # pinned emulator package, as core.yml's x86_64 jobs get it. They reach only that task and those tests (ATLAS_HOST_*
  # and ATLAS_LAVAPIPE_DIR). ccache keeps the host build's units in a folder and entry of their own (world.yml's refs
  # job restores it), the compiler known by its file's time and size. The tile reader's differential check decodes
  # 1,500 damaged tiles. The engine's references (MT/likeness: the frames of likeness/engine.json, world.json and the
  # globe check) must every one be drawn, each the hash its version stored on lavapipe-x86_64 (artifact `likeness`:
  # every frame as a PNG, and the hashes of a version that has none on this platform yet).
  mapcorecheck:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.tests == false || inputs.look != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write # a push to app deletes the older entries of the job's ccache cache
    env:
      KEEP_CACHES: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/app') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.keep_caches) }}
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: apk
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Gradle's caches are apk's to keep: a test job reads them, so the repository's caches stay bounded, and its tests
      # run on every push instead of coming from Gradle's build cache (where an input a test reads unseen, such as the
      # canal ring's pack, could leave a failure behind a result kept from before). It restores apk's entries
      # (GRADLE_BUILD_ACTION_CACHE_KEY_JOB), which hold its tests' artifacts too (testDependencies); what Gradle still
      # fetches is said at the end (What Gradle fetched).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Gradle's caches as restored
        run: touch "$RUNNER_TEMP/gradle-restored"
      - name: Android SDK 37
        run: |
          pin() { grep "^$1=" mapcore/tools.properties | cut -d= -f2-; }
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" \
            "ndk;$(pin ndk.version)" "cmake;$(pin cmake.version)" > /dev/null
      # The Rust the buildings' cleaning is built with (app/android/rust-toolchain.toml; cpp/cmake/Rust.cmake)
      - name: Rust, as rust-toolchain.toml pins it
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/rust.sh"
      - name: "Map core host build: LLVM's clang and libc++, and ccache"
        run: |
          LLVM=$(grep -m1 "^  LLVM: '" ../../.github/workflows/core.yml | cut -d"'" -f2) # core.yml's pin: NDK r30's major
          [ -n "$LLVM" ] || { echo "::error::core.yml names no LLVM version"; exit 1; }
          codename=$(lsb_release -cs)
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL --retry 20 --retry-delay 30 --retry-all-errors https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$LLVM main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          # apt.llvm.org's name may not resolve on a runner for a while (3 November 2026, from about 14:07 UTC): the key's
          # fetch and the update are tried again every 30 s for 10 minutes, until its clang is there
          for try in $(seq 20); do
            sudo apt-get update -q && apt-cache show "clang-$LLVM" > /dev/null 2>&1 && break
            echo "::warning::apt.llvm.org's clang-$LLVM is not there (try $try of 20); again in 30 s"
            sleep 30
          done
          sudo apt-get install -y -q --no-install-recommends clang-$LLVM lld-$LLVM libc++-$LLVM-dev libc++abi-$LLVM-dev \
            libclang-rt-$LLVM-dev ccache
          {
            echo "ATLAS_HOST_CC=clang-$LLVM"
            echo "ATLAS_HOST_CXX=clang++-$LLVM"
            echo "ATLAS_HOST_CXXFLAGS=-stdlib=libc++"
            echo "ATLAS_HOST_LDFLAGS=-stdlib=libc++"
            echo "ATLAS_CCACHE=1"
            echo "CCACHE_DIR=$HOME/.cache/ccache-host"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=2G"
            echo "CCACHE_COMPILERCHECK=mtime"
            echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime"
          } >> "$GITHUB_ENV"
          clang++-$LLVM --version | head -1
          date +%s > "$RUNNER_TEMP/ccache-since"
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache-host
          key: ccache-android-host-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-android-host-
      - name: "Map core host build: the emulator package's pin"
        run: echo "EMULATOR_SHA1=$(grep '^emulator.linux-x86_64.sha1=' mapcore/tools.properties | cut -d= -f2-)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/emulator-vulkan
          key: emulator-vulkan-${{ env.EMULATOR_SHA1 }}
      - name: "Map core host build: lavapipe from the pinned emulator package"
        run: |
          dir="$RUNNER_TEMP/emulator-vulkan"
          if [ ! -e "$dir/lvp_icd.json" ]; then
            file=$(grep '^emulator.linux-x86_64.file=' mapcore/tools.properties | cut -d= -f2-)
            python3 -I ci/sdkpkg.py fetch "https://dl.google.com/android/repository/$file" - "$EMULATOR_SHA1" "$RUNNER_TEMP/$file"
            unzip -q "$RUNNER_TEMP/$file" 'emulator/lib64/vulkan/*' -d "$RUNNER_TEMP/emulator"
            rm "$RUNNER_TEMP/$file"
            mv "$RUNNER_TEMP/emulator/emulator/lib64/vulkan" "$dir"
            rm -f "$dir"/*swiftshader* "$dir"/*MoltenVK* "$dir"/*kosmickrisp* "$dir"/glslangValidator
          fi
          ls -la "$dir" "$dir/layers" || true
          echo "ATLAS_LAVAPIPE_DIR=$dir" >> "$GITHUB_ENV"
          if [ ! -e "$dir/libvulkan.so.1" ] && [ ! -e "$dir/libvulkan.so" ]; then
            sudo apt-get install -y -q libvulkan1 > /dev/null
            echo "ATLAS_VULKAN_LOADER=/usr/lib/x86_64-linux-gnu/libvulkan.so.1" >> "$GITHUB_ENV"
          fi
      # The canal ring's element pack (packs-renders' grachten.atlas, by its SHA-256), which the modules' tests read
      # where it lies, cache/packs/regions (AnchorCases.grachten, the packer): without it they leave the canal ring's
      # cases out, and TextShapingTest fails. When one job ran every test it came with the packer's own fetch of it (the
      # APK's tiles, then the emulator's map); each test job takes it itself.
      - name: The canal ring's pack
        uses: actions/cache@v6
        with:
          path: cache/packs/regions/grachten.atlas
          key: likeness-pack-grachten-3ec8629e2d3f5708a604ada1592b4bc4a5dd722e69c2aaefa1cbafe5811593ec
      - name: Fetch the canal ring's pack
        working-directory: .
        run: |
          f=cache/packs/regions/grachten.atlas
          if [ ! -f "$f" ]; then
            mkdir -p cache/packs/regions
            curl -fsSL --retry 3 -o "$f" https://github.com/atlas-maps-app/Atlas/releases/download/packs-renders/grachten.atlas
          fi
          echo "3ec8629e2d3f5708a604ada1592b4bc4a5dd722e69c2aaefa1cbafe5811593ec  $f" | sha256sum -c -
      - name: The core's host build
        id: core_host
        run: |
          ccache --zero-stats > /dev/null
          ./gradlew :mapcorecheck:coreHost --stacktrace
          ccache --show-stats
      - name: The JNI tests
        if: steps.core_host.outcome == 'success'
        run: >-
          ./gradlew :mapcorecheck:test -Datlas.likeness.require=true -Datlas.likeness.platform=lavapipe-x86_64
          -Datlas.likeness.report=${{ github.workspace }}/likeness --continue --stacktrace
      # The artifacts Gradle fetched itself, past the caches it restored (apk's): a notice, so a test job that needed a
      # download is seen; none once apk has kept an entry with the tests' artifacts (testDependencies).
      - name: What Gradle fetched
        if: always()
        run: |
          files=${GRADLE_USER_HOME:-$HOME/.gradle}/caches/modules-2/files-2.1
          [ -d "$files" ] && [ -e "$RUNNER_TEMP/gradle-restored" ] || exit 0
          fetched=$(find "$files" -type f -newer "$RUNNER_TEMP/gradle-restored" | sed "s|^$files/||" | cut -d/ -f1-3 | sort -u)
          [ -z "$fetched" ] || echo "::notice::Gradle fetched $(wc -l <<< "$fetched") artifacts its caches did not hold: $(head -20 <<< "$fetched" | paste -sd ' ' -)"
      - name: Keep ccache's entry
        id: ccache_keep
        if: ${{ !cancelled() && steps.core_host.outcome == 'success' && env.KEEP_CACHES == 'true' }}
        run: |
          since=$(cat "$RUNNER_TEMP/ccache-since")
          ccache --evict-older-than "$(( $(date +%s) - since + 60 ))s"
          ccache --show-stats | grep -E 'Cache size|Files'
      - if: ${{ !cancelled() && steps.ccache_keep.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache-host
          key: ccache-android-host-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Delete the older ccache entries
        if: ${{ !cancelled() && steps.ccache_keep.outcome == 'success' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix=ccache-android-host-
          key="${prefix}${{ github.run_id }}-${{ github.run_attempt }}"
          # A deletion that fails leaves an older entry to GitHub's own eviction: a warning, not a failed check. Nothing
          # is deleted unless the entry just kept is listed, so a key that does not name it cannot take it too.
          listed=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$prefix" --limit 100 --json id,key) ||
            { echo "::warning::the caches could not be listed"; exit 0; }
          jq -e --arg key "$key" 'any(.[]; .key == $key)' <<< "$listed" > /dev/null ||
            { echo "::warning::$key is not listed yet: no older entry deleted"; exit 0; }
          jq -r --arg key "$key" '.[] | select(.key != $key) | .id' <<< "$listed" | while read -r id; do
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY" && echo "deleted the older entry $id" ||
              echo "::warning::the entry $id was not deleted"
          done
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas-reports-mapcorecheck
          path: app/android/mapcorecheck/build/reports/tests/
          if-no-files-found: ignore
      - name: Keep the references' report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: likeness
          path: likeness/
          if-no-files-found: ignore

