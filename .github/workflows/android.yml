    # at the debug build's first launch and then the bench APK's truth phase, which tables both; vk, VK facts, VK bench
    # and the crash guard, the frosted pills, the map drawn by the core and the world beyond the countries from the
    # release world-latest points at, in that order on one emulator (the map's launches find the pipeline cache
    # warm); and screens-<k>, every third of the other screens from the k-th. A run by hand that names its screens
    # opens them on one emulator, every phase after them. It runs whenever the APKs were built, even when a unit test
    # failed: the device's word is worth having either way.
    name: emulator ${{ matrix.part }}
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # a terrain run's artifact, on a dispatch that names one (terrain_packs)
    env:
      # The SDK's archives (below) are kept as the apk job's caches are.
      KEEP_CACHES: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/app') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.keep_caches) }}
      # The emulator's system image: the action's api-level, target and arch.
      IMAGE: system-images;android-35;google_apis;x86_64
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.screens != '' && '["all"]' || '["bench", "vk", "screens-1", "screens-2", "screens-3"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: atlas-debug-apk
          path: apk
      - uses: actions/download-artifact@v8
        if: matrix.part == 'bench' || matrix.part == 'all'
        continue-on-error: true
        with:
          name: atlas-bench-apk
          path: apk-bench
      # The map the runs draw at the Westerkerk home (VK bench's map, the home's frames): the canal ring, which smoke.sh
      # puts on the device for the debug and bench builds to list (MainActivity.BENCH_PACKS), as no APK carries a map.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: atlas-bench-packs
          path: bench-packs
      # The terrain under VK bench's map (ENGINE.md part 6, terrain, step 2), on a dispatch that names terrain runs'
      # artifacts (terrain_packs): the terrain pack of the Westerkerk's L9 tile cut out of them
      # (app/android/mapcore/cpp/tools/relief/cut.py) beside the canal ring, which the debug and bench builds list as the
      # terrain's (PackList.terrainFileId), so VK bench's comparison of the relief on and off draws it. Every other run
      # is as before: the step is skipped.
      - name: The terrain under the map
        if: github.event_name == 'workflow_dispatch' && inputs.terrain_packs != '' && (matrix.part == 'vk' || matrix.part == 'all')
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS: ${{ inputs.terrain_packs }}
        run: |
          work="$RUNNER_TEMP/terrain"
          mkdir -p "$work" bench-packs
          for id in ${ARTIFACTS//,/ }; do
            curl -fsSL --retry 5 -H "Authorization: Bearer $GH_TOKEN" -o "$work/terrain-$id.zip" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip"
            unzip -q -o "$work/terrain-$id.zip" -d "$work/terrain-$id"
            rm "$work/terrain-$id.zip"
            run=$(dirname "$(find "$work/terrain-$id" -name '*-terrain.idx' | head -1)")
            python3 -I app/android/mapcore/cpp/tools/relief/cut.py "$run" bench-packs 9/262/168 --around 0
            rm -rf "$work/terrain-$id"
          done
          ls -l bench-packs
      - name: The part's switches
        env:
          PART: ${{ matrix.part }}
          SCREENS: ${{ inputs.screens }}
          WAIT: ${{ inputs.wait || 180 }}
          BENCH: ${{ github.event_name == 'workflow_dispatch' && inputs.bench == false && '0' || '1' }}
        run: |
          {
            echo "ATLAS_MAP_WAIT=$WAIT"
            echo "ATLAS_BENCH=$BENCH"
            echo "ATLAS_PACKS=bench-packs"
            case "$PART" in
              all) echo "ATLAS_SCREENS=$SCREENS" ;;
              bench) echo "ATLAS_SCREENS=home"; echo "ATLAS_PHASES=screens truth" ;;
              vk) echo "ATLAS_PHASES=vk pills map world" ;;
              screens-*) echo "ATLAS_SCREENS_SKIP=home"; echo "ATLAS_SCREENS_PART=${PART#screens-}/3"; echo "ATLAS_PHASES=screens" ;;
              *) echo "::error::no part $PART"; exit 1 ;;
            esac
          } | tee -a "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator build whose package core.yml's x86_64 jobs take lavapipe and the validation layer from
      # (app/android/mapcore/tools.properties), so the guest's Vulkan and the host tests' are the same lavapipe.
      - name: The pinned emulator build
        id: emulator
        run: |
          pin() { sed -n "s/^emulator\.$1=//p" app/android/mapcore/tools.properties; }
          file=$(pin linux-x86_64.file); sha1=$(pin linux-x86_64.sha1); version=$(pin version)
          [ -n "$file" ] && [ -n "$sha1" ] && [ -n "$version" ] || { echo "::error::tools.properties names no emulator build"; exit 1; }
          { echo "file=$file"; echo "sha1=$sha1"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
      # The packages the action installs with sdkmanager, which unpacks a download as it comes: on 4 November a system
      # image that came broken failed two emulator jobs ("Error on ZipFile unknown archive", runs 41744358971 and
      # 41757855839). Here each comes as the archive the SDK repository lists for it now (the system image and the newest
      # stable emulator, the revisions `sdkmanager --install` takes) or the pinned build, checked against its SHA-1 and
      # fetched again whole while it does not check out (app/android/ci/sdkpkg.py), and kept in the caches by its package
      # and revision; a restore that fails is the cache action's warning, and an archive it leaves that does not check out
      # is said and fetched again. The system image and the newest emulator are installed where sdkmanager finds them, so
      # the action's sdkmanager fetches neither, and the pinned build replaces the newest just before the emulator starts
      # (pre-emulator-launch-script), as the action's emulator-build input did after a download of its own, unchecked.
      - name: The SDK's packages
        id: sdk
        run: |
          set -o pipefail
          repo=https://dl.google.com/android/repository
          python3 -I app/android/ci/sdkpkg.py describe "$repo/sys-img/google_apis/sys-img2-3.xml" "$IMAGE" "$RUNNER_TEMP/sdk/image.xml" --prefix image_ | tee -a "$GITHUB_OUTPUT"
          python3 -I app/android/ci/sdkpkg.py describe "$repo/repository2-3.xml" emulator "$RUNNER_TEMP/sdk/emulator.xml" --prefix emulator_ | tee -a "$GITHUB_OUTPUT"
      - name: The system image from the caches
        id: image_cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/sdk-archives/${{ steps.sdk.outputs.image_file }}
          key: sdk-${{ env.IMAGE }}-${{ steps.sdk.outputs.image_revision }}-${{ steps.sdk.outputs.image_sha1 }}
      - name: The emulators from the caches
        id: emulators_cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/sdk-archives/${{ steps.sdk.outputs.emulator_file }}
            ${{ runner.temp }}/sdk-archives/${{ steps.emulator.outputs.file }}
          key: sdk-emulator-${{ steps.sdk.outputs.emulator_revision }}-${{ steps.sdk.outputs.emulator_sha1 }}-${{ steps.emulator.outputs.version }}-${{ steps.emulator.outputs.sha1 }}
      - name: The SDK's packages, checked
        env:
          IMAGE_URL: ${{ steps.sdk.outputs.image_url }}
          IMAGE_SIZE: ${{ steps.sdk.outputs.image_size }}
          IMAGE_SHA1: ${{ steps.sdk.outputs.image_sha1 }}
          IMAGE_FILE: ${{ steps.sdk.outputs.image_file }}
          EMULATOR_URL: ${{ steps.sdk.outputs.emulator_url }}
          EMULATOR_SIZE: ${{ steps.sdk.outputs.emulator_size }}
          EMULATOR_SHA1: ${{ steps.sdk.outputs.emulator_sha1 }}
          EMULATOR_FILE: ${{ steps.sdk.outputs.emulator_file }}
          PINNED_SHA1: ${{ steps.emulator.outputs.sha1 }}
          PINNED_FILE: ${{ steps.emulator.outputs.file }}
        run: |
          dir=$RUNNER_TEMP/sdk-archives
          python3 -I app/android/ci/sdkpkg.py fetch "$IMAGE_URL" "$IMAGE_SIZE" "$IMAGE_SHA1" "$dir/$IMAGE_FILE"
          python3 -I app/android/ci/sdkpkg.py fetch "$EMULATOR_URL" "$EMULATOR_SIZE" "$EMULATOR_SHA1" "$dir/$EMULATOR_FILE"
          python3 -I app/android/ci/sdkpkg.py fetch "https://dl.google.com/android/repository/$PINNED_FILE" - "$PINNED_SHA1" "$dir/$PINNED_FILE"
      # One part keeps the archives for all, once they check out.
      - name: Keep the system image
        if: ${{ steps.image_cache.outputs.cache-hit != 'true' && env.KEEP_CACHES == 'true' && (matrix.part == 'vk' || matrix.part == 'all') }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/sdk-archives/${{ steps.sdk.outputs.image_file }}
          key: ${{ steps.image_cache.outputs.cache-primary-key }}
      - name: Keep the emulators
        if: ${{ steps.emulators_cache.outputs.cache-hit != 'true' && env.KEEP_CACHES == 'true' && (matrix.part == 'vk' || matrix.part == 'all') }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/sdk-archives/${{ steps.sdk.outputs.emulator_file }}
            ${{ runner.temp }}/sdk-archives/${{ steps.emulator.outputs.file }}
          key: ${{ steps.emulators_cache.outputs.cache-primary-key }}
      - name: The SDK's packages, installed
        env:
          IMAGE_FILE: ${{ steps.sdk.outputs.image_file }}
          EMULATOR_FILE: ${{ steps.sdk.outputs.emulator_file }}
          PINNED_FILE: ${{ steps.emulator.outputs.file }}
        run: |
          dir=$RUNNER_TEMP/sdk-archives
          python3 -I app/android/ci/sdkpkg.py install "$dir/$IMAGE_FILE" "$RUNNER_TEMP/sdk/image.xml" "$IMAGE"
          python3 -I app/android/ci/sdkpkg.py install "$dir/$EMULATOR_FILE" "$RUNNER_TEMP/sdk/emulator.xml" emulator
          rm "$dir/$IMAGE_FILE"
          [ "$EMULATOR_FILE" = "$PINNED_FILE" ] || rm "$dir/$EMULATOR_FILE"
          df -h "$RUNNER_TEMP" "$ANDROID_HOME" | sed 's/^/  /'
      # The hashes the emulator must reproduce (the host build's numerics, sun bits, ground and twin check) are
      # app/android/ci/hashes.env's, which smoke.sh reads: outside the workflows, so a change of the engine's that moves
      # one edits no workflow file (the nightly alpha's token may not tag a commit whose workflow files differ from the
      # default branch's).
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          # lavapipe: Mesa's Vulkan for the guest (the driver the host tests use) and the emulator's own software GLES. The
          # deprecated swiftshader_indirect hung HWUI's first program compile on its host GL pipe on every debug-first run.
          emulator-options: -no-window -gpu lavapipe -noaudio -no-boot-anim -camera-back none
          pre-emulator-launch-script: >-
            python3 -I app/android/ci/sdkpkg.py install "${{ runner.temp }}/sdk-archives/${{ steps.emulator.outputs.file }}"
            "${{ runner.temp }}/sdk/emulator.xml" emulator --revision "${{ steps.emulator.outputs.version }}"
          script: bash app/android/ci/smoke.sh apk shots apk-bench
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas-emulator-${{ matrix.part }}
          path: shots/
          if-no-files-found: ignore
      # The part's screens and phases alone, for emulator-coverage.
      - name: Keep the part's list
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-part-${{ matrix.part }}
          path: |
            shots/screens.txt
            shots/screens-all.txt
            shots/phases.txt
          if-no-files-found: ignore

  # The emulator's parts opened every screen the app lists for CI exactly once between them, and ran each phase (VK
  # facts, bench and guard; the pills; the map; the world; the truth phase, unless a run by hand left the bench out)
  # exactly once.
  emulator-coverage:
    needs: emulator
    if: ${{ !cancelled() && needs.emulator.result != 'skipped' && !(github.event_name == 'workflow_dispatch' && inputs.screens != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: emulator-part-*
          path: parts
      - name: Each screen and phase once
        env:
          BENCH: ${{ github.event_name == 'workflow_dispatch' && inputs.bench == false && '0' || '1' }}
        run: |
          status=0
          ls parts
          for part in parts/*/; do
            [ -s "$part/screens-all.txt" ] || { echo "::error::$(basename "$part") kept no list of the app's screens"; status=1; }
          done
          all=$(cat parts/*/screens-all.txt | grep . | sort -u || true)
          if [ "$(cat parts/*/screens-all.txt | grep . | sort | uniq -c | awk '{ print $1 }' | sort -u | wc -l)" != 1 ]; then
            echo "::error::the parts' emulators listed different screens"; status=1
          fi
          opened=$(cat parts/*/screens.txt | grep . | sort || true)
          missing=$(comm -23 <(sort -u <<< "$all") <(sort -u <<< "$opened"))
          twice=$(uniq -d <<< "$opened")
          extra=$(comm -13 <(sort -u <<< "$all") <(sort -u <<< "$opened"))
          [ -z "$missing" ] || { echo "::error::screens no part opened: $(tr '\n' ' ' <<< "$missing")"; status=1; }
          [ -z "$twice" ] || { echo "::error::screens more than one part opened: $(tr '\n' ' ' <<< "$twice")"; status=1; }
          [ -z "$extra" ] || { echo "::error::screens the app does not list: $(tr '\n' ' ' <<< "$extra")"; status=1; }
          phases=$(cat parts/*/phases.txt | grep . | grep -v -x screens | sort || true)
          want="map pills vk world"
          if [ "$BENCH" = 1 ]; then want="map pills truth vk world"; fi
          if [ "$(tr '\n' ' ' <<< "$phases" | sed 's/ $//')" != "$want" ]; then
            echo "::error::the parts ran the phases '$(tr '\n' ' ' <<< "$phases")', not each of '$want' once"; status=1
          fi
          echo "$(wc -l <<< "$opened") screens opened of the app's $(wc -l <<< "$all"); phases: $(tr '\n' ' ' <<< "$phases")"
          exit "$status"
