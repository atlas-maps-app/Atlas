# The map core (app/android/mapcore/cpp; plan-vector T4, T10): every push and pull request to `app` (and `main`) builds
# and tests it on x86_64 and arm64 Linux with LLVM's clang and libc++, on lavapipe under the Khronos validation layer, in
# three presets (ASan and UBSan, TSan, the shipped release flags); runs its fuzz targets with libFuzzer; checks every
# file with NDK r30's clang-tidy (over the host build's compile database and the Android build's) and clang-format,
# the tools the core's local checks run; proves each guard still catches its planted failure; configures it with no
# network; and builds it with NDK r30 for both Android ABIs. A push to `app` that changes the lavapipe image's recipe
# rebuilds the image. The Android library itself is built by android.yml's Gradle build.
#
# The checks run side by side on GitHub's runners, so a push has its word in about half an hour (the user, 30 October:
# "Optimize the flow. All the tests and suites we constantly run and wait on take too much time and slow us down"),
# and every check still runs on every push (29 October: "Make sure no quality is lost"). The core's tests are one
# ctest entry per test file (CMakeLists.txt), which each host job runs several at a time, and a host job whose tests
# would run long is split into shards that take its entries by their measured cost (tools/ctest/shards.py and its
# costs.tsv); core-tests then holds every job's shards to having run each entry exactly once. ccache keeps the jobs'
# compiled units between pushes, and the tidy jobs keep the units that were clean, by a key of everything that
# decides clang-tidy's word on them (tools/tidy/cached.py).
#
# Which job runs for which paths: the rule table's check (the rules job) holds app/android/mapcore/rules to the
# renderer, render/*.py, so it runs for every trigger, a change to render/** alone included. The core's matrix (the
# core job) runs when the push or pull request changes app/android/mapcore/**, this file or .github/docker/lavapipe/**
# (core-changes decides, by a git diff), whatever else it changes, and on every nightly and run by hand; a change to
# render/** alone runs the rules job and core-changes only.
#
# Only the extras need this file on the default branch, where GitHub keeps schedules and runs by hand: the nightly
# (every fuzz target for up to 30 minutes, clang-tidy on every file without its cache; it checks out `app`), the MODS
# probe, and an image rebuild by hand. Everything else runs on push and pull_request.
#
# Pins come from app/android/mapcore/tools.properties. lavapipe comes from versioned artifacts, never from apt: on
# x86_64 the Android emulator package (the CI emulator's own build: android.yml pins the emulator action to it), on
# arm64 our image (.github/docker/lavapipe), pinned by digest below once the image job has run.
name: Core

on:
  push:
    branches: [main, app]
    paths: ['app/android/mapcore/**', '.github/workflows/core.yml', '.github/docker/lavapipe/**', 'render/**']
  pull_request:
    branches: [main, app]
    paths: ['app/android/mapcore/**', '.github/workflows/core.yml', '.github/docker/lavapipe/**', 'render/**']
  schedule:
    - cron: '23 2 * * *' # nightly: every fuzz target for up to 30 minutes, clang-tidy on every file
  workflow_dispatch:
    inputs:
      image:
        description: Build and push the lavapipe images (then pin their digests in env below)
        type: boolean
        default: false
      mods:
        description: Run the MODS probe (import std and import vulkan, NDK r30 and Kitware's CMake 4.2.x)
        type: boolean
        default: false
      keep_caches:
        description: Keep this run's ccache and tidy entries for its branch, to measure warm runs of a change to CI (delete them after)
        type: boolean
        default: false

permissions:
  contents: read

# A push to `app` never cancels a run in progress: each push's run has a group of its own and goes to its end beside
# the others, so an agent pushes when its change is ready, not when CI is idle, and every commit of `app` gets its word
# (the nightly alpha chooses among them). Anywhere else a newer push, pull request update or run by hand cancels the
# older run of its ref and event; the nightly's group is its own too.
concurrency:
  group: core-${{ github.ref }}-${{ github.event_name }}${{ github.ref == 'refs/heads/app' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/app' }}

# bash -eo pipefail: a failure anywhere in a pipeline fails the step.
defaults:
  run:
    shell: bash

env:
  CP: app/android/mapcore/cpp
  LLVM: '21' # the major version of NDK r30's clang: 21.0.0, based on r574158c (measured by K0)
  # The lavapipe images by digest (ghcr.io/<owner>/atlas-lavapipe@sha256:...), from the image job's summary. Until the
  # arm64 one is set, the arm64 runner builds and runs every test except the Vulkan ones, and says so.
  LAVAPIPE_IMAGE_ARM64: 'ghcr.io/atlas-maps-app/atlas-lavapipe@sha256:e59cb264e8bf1537772edfd42fd79dc53f7edc570fb01b8ebf9563c9d1f324bd' # mesa-26.2.5-arm64, run 39011793433
  LAVAPIPE_IMAGE_X86_64: 'ghcr.io/atlas-maps-app/atlas-lavapipe@sha256:36dc038c992ba7261fc06831e34f952f4d3ea11ca16c24f5544a859eb2ae5413' # mesa-26.2.5-x86_64, run 39011793433
  # TSan's suppressions, by library: lavapipe, its LLVM and the validation layer are not instrumented, and their threads
  # synchronise through atomics, futexes and reference counts that TSan cannot see, so it reports races between them
  # that are none (17 in the first run, every access in their code). A report is dropped when any of its stacks passes
  # through one of them; a race between the core's own threads still fails, as the canaries prove.
  ATLAS_TSAN_SUPPRESSIONS: race:libvulkan_lvp race:libLLVM race:libVkLayer_khronos_validation

jobs:
  # Whether the core's matrix runs: a push or pull request that changes the core's own paths (the filter above, less
  # render/**), every nightly and every run by hand. Where the base commit is unknown (a new branch) or not in the
  # clone (a force push), it runs; and if this job fails, the matrix runs all the same (its condition below). It also
  # names the commit every job of the run checks out: the run's own, or for the nightly the work branch's tip as the
  # run begins. A job that waits for a runner would otherwise check out its branch as it is when it starts, and a push
  # to app no longer cancels the run before it.
  core-changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      core: ${{ steps.diff.outputs.core }}
      sha: ${{ steps.diff.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            echo "sha=$(git rev-parse --verify origin/app)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          core=true
          if [ "${{ github.event_name }}" = push ] || [ "${{ github.event_name }}" = pull_request ]; then
            if [ -n "$base" ] && [ "$base" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$base^{commit}" 2> /dev/null; then
              if git diff --quiet "$base" HEAD -- app/android/mapcore .github/workflows/core.yml .github/docker/lavapipe; then
                core=false
              fi
              echo "changed since $base:"
              git diff --name-only "$base" HEAD | sed 's/^/  /'
            else
              echo "the base commit '$base' is not in the clone: the core's matrix runs"
            fi
          fi
          echo "the core's matrix runs: $core"
          echo "core=$core" >> "$GITHUB_OUTPUT"

  # The rule table (plan-vector K5, VF1) held to the renderer: every feature render/*.py draws has its record in
  # app/android/mapcore/rules/rules.tsv, and no source changed since the recording (Python 3's standard library only;
  # seconds). It runs on every trigger, so a change to the renderer alone is checked too.
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # the nightly runs from the default branch's workflow; it checks the work branch
          ref: ${{ github.event_name == 'schedule' && 'app' || github.sha }}
      - name: The rule table covers the renderer
        run: |
          python3 --version
          python3 -I app/android/mapcore/rules/check_rules.py check

  # The pack tests' render packs (the Westerkerk's living map and the canal ring, format 3, in the port's cut: the
  # reference the parity tests hold the core to), so the host jobs' pack tests run (ATLAS_TILES_DIR) instead of
  # skipping: made by the packer through Gradle (:mapcorecheck:bundledTiles, the set :mapcorecheck's own tests take;
  # the canal ring's element pack is fetched from packs-renders and checked against its SHA-256), and cached by their
  # inputs, so a push that leaves the port, the render tiles' compiler, the engine's style file and the packer alone
  # takes them from the cache in seconds. The APK carries none of them for a map (ENGINE.md step 3, one pack per
  # country). A failure here leaves the host jobs to run without them, as before.
  tiles:
    needs: core-changes
    if: ${{ !cancelled() && needs.core-changes.outputs.core != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.core-changes.outputs.sha || github.sha }}
      - id: key
        run: |
          echo "key=bundled-tiles-${{ hashFiles('app/android/render/src/main/**', 'app/android/rendertiles/src/main/**', 'app/android/rendertiles/build.gradle.kts', 'app/android/mapcore/style/**', 'app/android/packer/src/main/**', 'app/android/app/src/main/assets/packs/**', 'app/android/gradle/libs.versions.toml', 'app/android/mapcorecheck/build.gradle.kts') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tiles
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v6
      - name: The packer's render packs
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: app/android
        run: |
          pin() { grep "^$1=" mapcore/tools.properties | cut -d= -f2-; }
          # the Android modules configure with the SDK the app builds against
          { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" \
            "ndk;$(pin ndk.version)" "cmake;$(pin cmake.version)" > /dev/null
          ./gradlew :mapcorecheck:bundledTiles --stacktrace
          mkdir -p "$RUNNER_TEMP/tiles"
          cp mapcorecheck/build/bundled-tiles/*.atlas mapcorecheck/build/bundled-tiles/bundled.json "$RUNNER_TEMP/tiles/"
          ls -la "$RUNNER_TEMP/tiles"

  core:
    name: ${{ matrix.task }} ${{ matrix.arch }}${{ matrix.shards > 1 && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }}
    needs: [core-changes, tiles]
    if: ${{ !cancelled() && needs.core-changes.outputs.core != 'false' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # A job's work is a share of what one job did until 30 October (an hour and a half for host-debug x86_64's build
    # and its two runs of the tests), but a build that finds no cache compiles everything, and tidy without its cache
    # (the nightly, or a change to the checks) checks every file: 42 minutes for the host's database on 29 October.
    # The nightly fuzz runs every target for up to 30 minutes, at most 120 minutes in all (see its step).
    timeout-minutes: ${{ (matrix.task == 'fuzz' && github.event_name == 'schedule') && 150 || 90 }}
    permissions:
      contents: read
      packages: read # the arm64 lavapipe image on GHCR
      actions: write # a push to app deletes the older entries of the job's ccache and tidy caches
    strategy:
      fail-fast: false
      # The host jobs' shards: as many as keep each's tests near a quarter of an hour by the measured costs
      # (tools/ctest/costs.tsv; a runner's four cores did about 6,600 to 7,600 entry-seconds a job on 30 October,
      # TSan's x86_64 more), and no more, since the account runs 20 jobs at once and every shard builds. A job's name
      # starts with its task and architecture (host-debug x86_64 1/3), which the nightly alpha's choice reads
      # (.github/scripts/nightly-alpha.sh: a Core run with a host-debug job tested the core).
      matrix:
        include:
          - { task: host-debug, arch: x86_64, shard: 1, shards: 3 }
          - { task: host-debug, arch: x86_64, shard: 2, shards: 3 }
          - { task: host-debug, arch: x86_64, shard: 3, shards: 3 }
          - { task: host-debug, arch: arm64, shard: 1, shards: 2 }
          - { task: host-debug, arch: arm64, shard: 2, shards: 2 }
          - { task: host-tsan, arch: x86_64, shard: 1, shards: 3 }
          - { task: host-tsan, arch: x86_64, shard: 2, shards: 3 }
          - { task: host-tsan, arch: x86_64, shard: 3, shards: 3 }
          - { task: host-tsan, arch: arm64, shard: 1, shards: 2 }
          - { task: host-tsan, arch: arm64, shard: 2, shards: 2 }
          - { task: host-release, arch: x86_64, shard: 1, shards: 2 }
          - { task: host-release, arch: x86_64, shard: 2, shards: 2 }
          - { task: host-release, arch: arm64, shard: 1, shards: 2 }
          - { task: host-release, arch: arm64, shard: 2, shards: 2 }
          - { task: fuzz, arch: x86_64 }
          - { task: tidy, arch: x86_64, shard: 1, shards: 2 }
          - { task: tidy, arch: x86_64, shard: 2, shards: 2 }
          - { task: tidy-android, arch: x86_64, shard: 1, shards: 2 }
          - { task: tidy-android, arch: x86_64, shard: 2, shards: 2 }
          - { task: canaries, arch: x86_64 }
          - { task: android, arch: x86_64 }
    env:
      TASK: ${{ matrix.task }}
      TOOLS: ${{ github.workspace }}/cache/atlas-tools
      # The job's name in the cost table and its caches' keys (host-debug-x86_64), and its shard
      JOB: ${{ matrix.task }}-${{ matrix.arch }}
      SHARD: ${{ matrix.shard || 1 }}
      SHARDS: ${{ matrix.shards || 1 }}
      # The caches are kept by a push to app and by the nightly (ccache's by shard 1 of a job, whose shards build alike;
      # tidy's by each shard, whose units differ); every other run only restores them (GitHub lets a branch's runs read
      # the default branch's caches), unless a run by hand asks to keep its own (keep_caches), for its branch alone.
      KEEP_CACHES: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/app') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.keep_caches) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # the nightly runs from the default branch's workflow; it checks the work branch
          ref: ${{ needs.core-changes.outputs.sha || github.sha }}

      - name: Pins
        run: |
          pin() { grep "^$1=" app/android/mapcore/tools.properties | cut -d= -f2-; }
          host=$([ "$(uname -m)" = aarch64 ] && echo linux-aarch64 || echo linux-x86_64)
          {
            echo "HOST_PLATFORM=$host"
            echo "SLANG_VERSION=$(pin slang.version)"
            echo "SLANG_FILE=$(pin slang.$host.file)"
            echo "SLANG_SHA256=$(pin slang.$host.sha256)"
            echo "CMAKE_FILE=$(pin cmake.$host.file)"
            echo "CMAKE_SHA256=$(pin cmake.$host.sha256)"
            echo "CMAKE_VERSION=$(pin cmake.version)"
            echo "NINJA_VERSION=$(pin ninja.version)"
            echo "NINJA_FILE=$(pin ninja.$host.file)"
            echo "NINJA_SHA256=$(pin ninja.$host.sha256)"
            echo "NDK_VERSION=$(pin ndk.version)"
            echo "EMULATOR_FILE=$(pin emulator.linux-x86_64.file)"
            echo "EMULATOR_SHA1=$(pin emulator.linux-x86_64.sha1)"
          } >> "$GITHUB_ENV"

      # clang-tidy and clang-format are NDK r30's (the tidy job installs the NDK), which the core's local checks run:
      # LLVM's 21.1 has checks the NDK's 21.0 lacks, and .clang-tidy takes in every modernize-* check.
      - name: LLVM ${{ env.LLVM }} (clang, libc++, lld, llvm-symbolizer) from apt.llvm.org
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -q
          # llvm-N carries llvm-symbolizer-N, which the sanitizers' runtimes call to put names and lines in a report.
          # ccache keeps the compiled units between runs (its step below); GNU time measures each test entry.
          sudo apt-get install -y -q --no-install-recommends clang-$LLVM lld-$LLVM libc++-$LLVM-dev libc++abi-$LLVM-dev \
            libclang-rt-$LLVM-dev llvm-$LLVM ccache time
          symbolizer=/usr/bin/llvm-symbolizer-$LLVM
          "$symbolizer" --version | sed -n 1,2p
          {
            echo "CC=clang-$LLVM"
            echo "CXX=clang++-$LLVM"
            echo "CXXFLAGS=-stdlib=libc++"
            echo "LDFLAGS=-stdlib=libc++"
            echo "ASAN_OPTIONS=external_symbolizer_path=$symbolizer"
            echo "TSAN_OPTIONS=external_symbolizer_path=$symbolizer"
            echo "UBSAN_OPTIONS=external_symbolizer_path=$symbolizer:print_stacktrace=1"
          } >> "$GITHUB_ENV"
          clang++-$LLVM --version | sed -n 1p

      - name: CMake ${{ env.CMAKE_VERSION }} and Ninja ${{ env.NINJA_VERSION }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/Kitware/CMake/releases/download/v$CMAKE_VERSION/$CMAKE_FILE"
          echo "$CMAKE_SHA256  $CMAKE_FILE" | sha256sum -c -
          tar -xzf "$CMAKE_FILE"
          curl -fsSLO "https://github.com/ninja-build/ninja/releases/download/v$NINJA_VERSION/$NINJA_FILE"
          echo "$NINJA_SHA256  $NINJA_FILE" | sha256sum -c -
          unzip -q "$NINJA_FILE" -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/${CMAKE_FILE%.tar.gz}/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v6
        with:
          path: ${{ env.TOOLS }}/slang-${{ env.SLANG_VERSION }}-${{ env.HOST_PLATFORM }}
          key: slang-${{ env.SLANG_SHA256 }}
      - name: Slang ${{ env.SLANG_VERSION }}
        run: |
          dir="$TOOLS/slang-$SLANG_VERSION-$HOST_PLATFORM"
          if [ ! -x "$dir/bin/slangc" ]; then
            curl -fsSLo "$RUNNER_TEMP/$SLANG_FILE" "https://github.com/shader-slang/slang/releases/download/v$SLANG_VERSION/$SLANG_FILE"
            echo "$SLANG_SHA256  $RUNNER_TEMP/$SLANG_FILE" | sha256sum -c -
            mkdir -p "$dir"
            tar -xzf "$RUNNER_TEMP/$SLANG_FILE" -C "$dir" --exclude='*slang-llvm*' --exclude='*share/doc*' \
              --exclude='*standard-module*' --exclude='*libgfx*' --exclude='*gfx.slang*'
          fi
          "$dir/bin/slangc" -v

      # ccache for the C and C++ the job compiles (the host builds, the fuzz targets, the canaries, the NDK builds):
      # CMake takes CMAKE_<LANG>_COMPILER_LAUNCHER from the environment. One cache entry a job (host-debug-x86_64 and
      # the like) holds what its build compiled last: a push to app and the nightly keep it once the build is done,
      # and delete the job's older entries, so the repository's caches stay well under GitHub's 10 GB beside Gradle's.
      # The canaries take host-debug's and host-tsan's entries (their builds are those builds with one planted test
      # more) and keep none. base_dir makes the absolute paths of the build relative, so a unit's hash holds on every
      # runner; the sloppiness lets ccache cache the units built with Vulkan-Hpp's precompiled header (CMakeLists.txt
      # adds -fno-pch-timestamp). The compiler is known by its file's time and size (apt.llvm.org's package keeps
      # them); in the NDK builds by what each compiler says it is (--version), the NDK's clang and the host compiler
      # of their nocontract alike, since each runner's install of the NDK gives its files new times.
      - name: ccache
        if: startsWith(matrix.task, 'host-') || matrix.task == 'fuzz' || matrix.task == 'canaries' || matrix.task == 'android'
        run: |
          ccache --version | sed -n 1p
          {
            echo "CCACHE_DIR=$HOME/.cache/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=${{ matrix.task == 'canaries' && '6G' || '3G' }}"
            echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
            if [ "$TASK" = android ]; then echo "CCACHE_COMPILERCHECK=%compiler% --version"; fi
          } >> "$GITHUB_ENV"
          date +%s > "$RUNNER_TEMP/ccache-since"
      - name: The job's ccache entry
        if: startsWith(matrix.task, 'host-') || matrix.task == 'fuzz' || matrix.task == 'android'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-core-${{ matrix.task }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-core-${{ matrix.task }}-${{ matrix.arch }}-
      - name: host-debug's ccache entry (canaries)
        if: matrix.task == 'canaries'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-core-host-debug-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-core-host-debug-x86_64-
      - name: host-tsan's ccache entry (canaries)
        if: matrix.task == 'canaries'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-core-host-tsan-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-core-host-tsan-x86_64-

      # Vulkan for the tests: the loader, lavapipe and the validation layer. Their variables go to $RUNNER_TEMP/vulkan.env,
      # which only the test commands read, so CMake, clang and the other steps never load the emulator's libraries.
      - uses: actions/cache@v6
        if: matrix.arch == 'x86_64' && startsWith(matrix.task, 'host-')
        with:
          path: ${{ runner.temp }}/emulator-vulkan
          key: emulator-vulkan-${{ env.EMULATOR_SHA1 }}
      - name: lavapipe from the Android emulator package (x86_64)
        if: matrix.arch == 'x86_64' && startsWith(matrix.task, 'host-')
        run: |
          dir="$RUNNER_TEMP/emulator-vulkan"
          if [ ! -e "$dir/lvp_icd.json" ]; then
            curl -fsSLo "$RUNNER_TEMP/$EMULATOR_FILE" "https://dl.google.com/android/repository/$EMULATOR_FILE"
            echo "$EMULATOR_SHA1  $RUNNER_TEMP/$EMULATOR_FILE" | sha1sum -c -
            unzip -q "$RUNNER_TEMP/$EMULATOR_FILE" 'emulator/lib64/vulkan/*' -d "$RUNNER_TEMP/emulator"
            rm "$RUNNER_TEMP/$EMULATOR_FILE"
            mv "$RUNNER_TEMP/emulator/emulator/lib64/vulkan" "$dir"
            rm -f "$dir"/*swiftshader* "$dir"/*MoltenVK* "$dir"/*kosmickrisp* "$dir"/glslangValidator
          fi
          ls -la "$dir" "$dir/layers" || true
          loader=
          for f in "$dir/libvulkan.so.1" "$dir/libvulkan.so"; do
            if [ -e "$f" ]; then loader=$f; break; fi
          done
          if [ -z "$loader" ]; then sudo apt-get install -y -q libvulkan1 && loader=/usr/lib/x86_64-linux-gnu/libvulkan.so.1; fi
          {
            echo "ATLAS_VULKAN_LOADER=$loader"
            echo "VK_DRIVER_FILES=$dir/lvp_icd.json"
            echo "LD_LIBRARY_PATH=$dir"
          } > "$RUNNER_TEMP/vulkan.env"
          if [ -e "$dir/layers/VkLayer_khronos_validation.json" ]; then
            echo "VK_ADD_LAYER_PATH=$dir/layers" >> "$RUNNER_TEMP/vulkan.env"
          elif [ -n "$LAVAPIPE_IMAGE_X86_64" ]; then
            id=$(docker create "$LAVAPIPE_IMAGE_X86_64" /none) && sudo mkdir -p /opt/vulkan && sudo docker cp "$id:/opt/vulkan/." /opt/vulkan/
            echo "VK_ADD_LAYER_PATH=/opt/vulkan/share/vulkan/explicit_layer.d" >> "$RUNNER_TEMP/vulkan.env"
            # The image's layer manifest names its library without a path, for the loader to find on LD_LIBRARY_PATH.
            echo "LD_LIBRARY_PATH=$dir:/opt/vulkan/lib" >> "$RUNNER_TEMP/vulkan.env"
          else
            echo "::error::the emulator package has no validation layer and LAVAPIPE_IMAGE_X86_64 is not pinned" && exit 1
          fi
          # This lavapipe frees with free() what it allocated with operator new, on its own threads (ASan's
          # alloc-dealloc-mismatch in the first run: both stacks in libvulkan_lvp.so's own code), and ASan suppresses
          # that error by function name only, which this stripped build has none of. So the tests on it run without
          # that one check, and Test runs the core's tests once more without Vulkan, with it.
          echo "ASAN_OPTIONS=$ASAN_OPTIONS:alloc_dealloc_mismatch=0" >> "$RUNNER_TEMP/vulkan.env"
          echo "ATLAS_REQUIRE_VULKAN=1" >> "$RUNNER_TEMP/vulkan.env"
          cat "$RUNNER_TEMP/vulkan.env"
      - name: lavapipe from the pinned image (arm64)
        if: matrix.arch == 'arm64' && startsWith(matrix.task, 'host-')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$LAVAPIPE_IMAGE_ARM64" ]; then
            # Test writes the summary's warning, with the test cases that skipped their Vulkan work.
            echo "::warning::LAVAPIPE_IMAGE_ARM64 is not pinned yet: the Vulkan tests are skipped on arm64 (push a change to .github/docker/lavapipe, or run this workflow with image=true, then pin the digest)"
            echo "ATLAS_REQUIRE_VULKAN=0" > "$RUNNER_TEMP/vulkan.env"
            exit 0
          fi
          # A package published with GITHUB_TOKEN takes the repository's visibility, but the first one may start private.
          printf '%s' "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin ||
            echo "::warning::docker login to ghcr.io failed; pulling the image anonymously"
          id=$(docker create "$LAVAPIPE_IMAGE_ARM64" /none)
          sudo mkdir -p /opt/vulkan && sudo docker cp "$id:/opt/vulkan/." /opt/vulkan/ && cat /opt/vulkan/VERSIONS.txt
          missing=$(LD_LIBRARY_PATH=/opt/vulkan/lib ldd /opt/vulkan/lib/libvulkan_lvp.so /opt/vulkan/lib/libvulkan.so.1 \
            /opt/vulkan/lib/libVkLayer_khronos_validation.so | grep 'not found' || true)
          [ -z "$missing" ] || { echo "::error::the image's libraries need what this runner lacks: $missing"; exit 1; }
          icd=
          for f in /opt/vulkan/share/vulkan/icd.d/lvp_icd.*.json; do
            if [ -e "$f" ]; then icd=$f; break; fi
          done
          [ -n "$icd" ] || { echo "::error::the image has no lavapipe ICD manifest"; exit 1; }
          {
            echo "ATLAS_VULKAN_LOADER=/opt/vulkan/lib/libvulkan.so.1"
            echo "VK_DRIVER_FILES=$icd"
            echo "VK_ADD_LAYER_PATH=/opt/vulkan/share/vulkan/explicit_layer.d"
            echo "LD_LIBRARY_PATH=/opt/vulkan/lib"
            echo "ATLAS_REQUIRE_VULKAN=1"
          } > "$RUNNER_TEMP/vulkan.env"
          cat "$RUNNER_TEMP/vulkan.env"

      # ---- host-debug, host-tsan, host-release: build, unit tests (Vulkan on lavapipe), the feature probe, benchmarks.
      # The pack tests' render packs (the tiles job's): ATLAS_TILES_DIR beside the Vulkan variables.
      - id: tiles
        if: startsWith(matrix.task, 'host-') && needs.tiles.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/tiles
          key: ${{ needs.tiles.outputs.key }}
      - name: The pack tests' render packs
        if: startsWith(matrix.task, 'host-')
        run: |
          if [ -e "$RUNNER_TEMP/tiles/amsterdam.atlas" ] && [ -e "$RUNNER_TEMP/tiles/grachten.atlas" ]; then
            echo "ATLAS_TILES_DIR=$RUNNER_TEMP/tiles" >> "$RUNNER_TEMP/vulkan.env"
            ls -la "$RUNNER_TEMP/tiles"
          else
            echo "::warning::no render packs from the tiles job: the pack tests skip"
          fi
      # Each test entry runs under GNU time, so its peak memory is in its output (core-tests sums them up): what tells
      # how many entries a runner can run at once, TSan's above all.
      - name: Build (${{ matrix.task }})
        id: build
        if: startsWith(matrix.task, 'host-')
        working-directory: ${{ env.CP }}
        run: |
          ccache --zero-stats > /dev/null
          cmake --preset "$TASK" -DATLAS_TOOLS_DIR="$TOOLS" "-DCMAKE_TEST_LAUNCHER=/usr/bin/time;-f;atlas-test-resources: %e s, peak %M KB"
          cmake --build --preset "$TASK" -j 4
          ccache --show-stats
      - name: Test (${{ matrix.task }}${{ matrix.shards > 1 && format(', shard {0} of {1}', matrix.shard, matrix.shards) || '' }})
        if: startsWith(matrix.task, 'host-') && steps.build.outcome == 'success'
        working-directory: ${{ env.CP }}
        run: |
          # LSan sees lavapipe's and LLVM's own process-lifetime allocations; the core's leaks still fail.
          printf 'leak:libvulkan_lvp\nleak:libLLVM\nleak:libvulkan.so\nleak:libVkLayer_khronos_validation\n' > "$RUNNER_TEMP/lsan.supp"
          export LSAN_OPTIONS="suppressions=$RUNNER_TEMP/lsan.supp"
          printf '%s\n' $ATLAS_TSAN_SUPPRESSIONS > "$RUNNER_TEMP/tsan.supp"
          export TSAN_OPTIONS="$TSAN_OPTIONS:suppressions=$RUNNER_TEMP/tsan.supp"
          # This shard's entries: every shard of the job splits the build's entries the same way, by their measured
          # seconds (tools/ctest/shards.py), and keeps the whole list for core-tests, which holds the shards' runs to it.
          # ctest runs them as many at a time as the runner has cores, the costliest first (ctest's cost file, from the
          # same table), each test process with one lavapipe thread so the drawing ones do not crowd the cores. The
          # entries' peaks of memory (core-tests' summary) leave room: 3.4 GB at most under TSan on 30 October, 2.3 GB
          # under ASan, on the runners' 16.
          kept="$RUNNER_TEMP/ctest/$JOB/$SHARD"
          at_once=$(nproc)
          ctest --test-dir "build/$TASK" --show-only=json-v1 > "$RUNNER_TEMP/ctest.json"
          python3 -I tools/ctest/shards.py plan --tests "$RUNNER_TEMP/ctest.json" --costs tools/ctest/costs.tsv \
            --job "$JOB" --shards "$SHARDS" --shard "$SHARD" --slots "$at_once" --out "$RUNNER_TEMP/shard.txt" \
            --every "$kept/plan.txt" --cost-data "build/$TASK/Testing/Temporary/CTestCostData.txt"
          [ -s "$RUNNER_TEMP/shard.txt" ] || { echo "::error::shard $SHARD of $SHARDS takes no entry"; exit 1; }
          echo "LP_NUM_THREADS=1" >> "$RUNNER_TEMP/vulkan.env"
          # The JUnit file keeps every test's output, passed or not, for the skips below.
          (set -a; . "$RUNNER_TEMP/vulkan.env"; set +a; ctest --test-dir "build/$TASK" --output-on-failure -j "$at_once" \
            --tests-from-file "$RUNNER_TEMP/shard.txt" --output-junit "$kept/tests.xml" --test-output-size-passed 8000000 --test-output-truncation middle)
          # A test case that finds no Vulkan where none is required skips what needs it and still counts as passed, so a
          # run without Vulkan (arm64's, until LAVAPIPE_IMAGE_ARM64 is pinned) says so in the summary, naming each case.
          skipped=$(awk '/^TEST CASE:/ { sub(/^TEST CASE: +/, ""); name = $0 }
                         /MESSAGE: skipped/ { sub(/.*MESSAGE: /, ""); print name ": " $0 }' "$kept/tests.xml" |
            sed -e 's/&lt;/</g; s/&gt;/>/g; s/&quot;/"/g' -e "s/&apos;/'/g; s/&amp;/\&/g" | sort -u)
          required=$(grep -c -x 'ATLAS_REQUIRE_VULKAN=1' "$RUNNER_TEMP/vulkan.env" || true)
          if [ -n "$skipped" ] || [ "$required" = 0 ]; then
            count=$(grep -c . <<< "$skipped" || true)
            echo "::warning::$TASK ${{ matrix.arch }} $SHARD/$SHARDS: $count test cases skipped their Vulkan work and still count as passed (the job summary names them)"
            {
              echo "> [!WARNING]"
              echo "> **$TASK ${{ matrix.arch }} $SHARD/$SHARDS: $count test cases skipped their Vulkan work and still count as passed.**"
              if [ "$required" = 0 ]; then
                pin=
                if [ "${{ matrix.arch }}" = arm64 ]; then pin=' (LAVAPIPE_IMAGE_ARM64 is not pinned)'; fi
                echo "> The Vulkan tests did not run: this runner has no Vulkan driver$pin, and none was required."
              fi
              echo ">"
              sed -e '/^$/d' -e 's/^/> - /' <<< "$skipped"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # vulkan.env turned one ASan check off for the emulator's lavapipe (its step says why): the shard's entries
          # run once more with every check and no Vulkan at all (a loader that is not there, so the SDK's emulator
          # package is not looked for either; the cases that need Vulkan ran above, and skip here).
          if [ "$TASK" = host-debug ] && grep -q 'alloc_dealloc_mismatch=0' "$RUNNER_TEMP/vulkan.env"; then
            echo "== every ASan check, no Vulkan"
            ATLAS_REQUIRE_VULKAN=0 ATLAS_VULKAN_LOADER=/nonexistent/libvulkan.so.1 \
              ctest --test-dir "build/$TASK" --output-on-failure -j "$at_once" --tests-from-file "$RUNNER_TEMP/shard.txt" \
              --output-junit "$kept/novk.xml" --test-output-size-passed 8000000 --test-output-truncation middle
          fi
          # Mesa's own shader cache, which lavapipe's processes on this runner share, if lavapipe keeps one.
          du -sh ~/.cache/mesa_shader_cache* 2> /dev/null || echo "no Mesa shader cache in ~/.cache"
          if [ "$SHARD" = 1 ]; then
            "build/$TASK/atlas_tests" --probe | tee "build/feature-probe-$TASK-${{ matrix.arch }}.txt"
            if [ "$TASK" = host-release ]; then
              # Every benchmark executable (bench/*_bench.cpp); a crash fails the step.
              for bench in "build/$TASK"/bench/*_bench; do
                echo "== $(basename "$bench")" | tee -a "build/bench-${{ matrix.arch }}.txt"
                "$bench" | tee -a "build/bench-${{ matrix.arch }}.txt"
              done
            fi
          fi
      # The test entries' JUnit files and the shard's plan, for core-tests.
      - name: Keep the shard's test results
        if: startsWith(matrix.task, 'host-') && always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-${{ env.JOB }}-${{ env.SHARD }}
          path: ${{ runner.temp }}/ctest/
          if-no-files-found: ignore
      - name: Keep the feature probe and benchmarks
        if: startsWith(matrix.task, 'host-') && always() && env.SHARD == '1'
        uses: actions/upload-artifact@v7
        with:
          name: core-${{ matrix.task }}-${{ matrix.arch }}
          path: |
            ${{ env.CP }}/build/feature-probe-*.txt
            ${{ env.CP }}/build/bench-*.txt
          if-no-files-found: ignore
      # A module that missed its spirv.lock (cmake/Shaders.cmake keeps it, as embedded and as slangc wrote it, with its
      # reflection): with spirv-dis's text beside it, so it can be diffed with another host's instead of guessed at.
      - name: The SPIR-V that missed its lock, disassembled
        if: startsWith(matrix.task, 'host-') && failure()
        working-directory: ${{ env.CP }}
        run: |
          kept="build/$TASK/spirv-lock-mismatch"
          [ -d "$kept" ] || { echo "no module missed its lock"; exit 0; }
          command -v spirv-dis > /dev/null || sudo apt-get install -y -q --no-install-recommends spirv-tools > /dev/null ||
            echo "::warning::spirv-tools did not install: the modules are kept without their text"
          for module in "$kept"/*.spv; do
            if [ ! -e "${module%.spv}.spvasm" ] && command -v spirv-dis > /dev/null; then
              spirv-dis "$module" -o "${module%.spv}.spvasm" || echo "::warning::spirv-dis could not read $module"
            fi
          done
          cat "$kept/mismatch.txt"
          ls -l "$kept"
      - name: Keep the SPIR-V that missed its lock
        if: startsWith(matrix.task, 'host-') && failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-spirv-lock-${{ env.JOB }}-${{ env.SHARD }}
          path: ${{ env.CP }}/build/${{ matrix.task }}/spirv-lock-mismatch/
          if-no-files-found: ignore

      # ---- fuzz: every fuzz/fuzz_*.cpp under libFuzzer, ASan and UBSan, as many at once as the runner has cores; 60 s
      # each on a push, and nightly up to 30 minutes each within 120 minutes in all.
      - name: Fuzz targets
        id: fuzz_build
        if: matrix.task == 'fuzz'
        working-directory: ${{ env.CP }}
        run: |
          ccache --zero-stats > /dev/null
          cmake --preset host-fuzz -DATLAS_TOOLS_DIR="$TOOLS"
          cmake --build --preset host-fuzz -j 4
          ccache --show-stats
      - name: Fuzz
        if: matrix.task == 'fuzz' && steps.fuzz_build.outcome == 'success'
        working-directory: ${{ env.CP }}
        run: |
          targets=(build/host-fuzz/fuzz/fuzz_*)
          jobs=$(nproc)
          rounds=$(( (${#targets[@]} + jobs - 1) / jobs ))
          if [ "${{ github.event_name }}" = schedule ]; then
            seconds=$(( 7200 / rounds ))
            if [ "$seconds" -gt 1800 ]; then seconds=1800; fi
          else
            seconds=60
          fi
          echo "${#targets[@]} targets, $jobs at a time, $seconds s each"
          mkdir -p build/crashes build/fuzz-logs
          # One target from a copy of its corpus (seeds and past crashes), which libFuzzer then grows; its log apart.
          fuzz_one() {
            local target=$1 name
            name=$(basename "$target")
            mkdir -p "build/corpus/$name"
            if [ -d "fuzz/corpus/$name" ]; then cp -R "fuzz/corpus/$name/." "build/corpus/$name/"; fi
            if "$target" -max_total_time="$FUZZ_SECONDS" -artifact_prefix="build/crashes/$name-" "build/corpus/$name" \
              > "build/fuzz-logs/$name.log" 2>&1; then
              echo "$name: no failure in $FUZZ_SECONDS s"
            else
              echo "::error::$name failed (its log and any crashing input are in the artifact core-fuzz-crashes)"
              return 1
            fi
          }
          export -f fuzz_one
          export FUZZ_SECONDS=$seconds
          status=0
          printf '%s\n' "${targets[@]}" | xargs -P "$jobs" -I '{}' bash -c 'fuzz_one "$1"' _ '{}' || status=1
          for log in build/fuzz-logs/*.log; do
            echo "::group::$(basename "$log" .log)"
            tail -n 40 "$log"
            echo "::endgroup::"
          done
          exit "$status"
      - name: Keep the fuzz crashes
        if: matrix.task == 'fuzz' && failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-fuzz-crashes
          path: |
            ${{ env.CP }}/build/crashes/
            ${{ env.CP }}/build/fuzz-logs/
            ${{ env.CP }}/build/*/CMakeFiles/CMakeConfigureLog.yaml

      # ---- tidy: NDK r30's clang-format and clang-tidy (the core's .clang-tidy) on every file: the tools of the
      # host-tidy preset (cmake/Tidy.cmake) and of a local replay of this step, so a clean run there is a clean run
      # here. clang-tidy runs each source with every build that compiles it: the host build's compile database and NDK
      # r30's for Android, so code that only Android compiles (platform/android, the __ANDROID__ parts) is checked too,
      # and a source neither compiles fails. The tidy job formats and checks with the host build's database (and fails a
      # source neither build compiles), tidy-android checks with the Android build's. A unit is checked again only when
      # its key changed (tools/tidy/cached.py: its preprocessed text with every header and comment, its flags,
      # .clang-tidy and the clang-tidy), against the clean units' keys a push to app keeps; the nightly checks every
      # unit without them, and keeps its own. Each job is two shards, each with half the units (by a hash of the path,
      # so a unit stays in its shard) and its own keys: every unit checked, as after a change to the checks or to a
      # header every unit includes, took one job 35 to 39 minutes on 30 October.
      - name: NDK r30 and the SDK's CMake
        if: matrix.task == 'tidy' || matrix.task == 'tidy-android' || matrix.task == 'android' || matrix.task == 'canaries'
        run: |
          { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null
          bin="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$bin/clang-tidy" --version | sed -n 2p
          echo "NDK_BIN=$bin" >> "$GITHUB_ENV"
      - name: The clean units' keys
        if: (matrix.task == 'tidy' || matrix.task == 'tidy-android') && github.event_name != 'schedule'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/atlas-tidy
          key: tidy-core-${{ matrix.task }}-${{ env.SHARD }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tidy-core-${{ matrix.task }}-${{ env.SHARD }}-
      - name: clang-tidy and clang-format
        id: tidy
        if: matrix.task == 'tidy' || matrix.task == 'tidy-android'
        working-directory: ${{ env.CP }}
        run: |
          # The core's own C and C++ files: not third-party code, the planted failures or the MODS probe (import std).
          all=$(git ls-files -- . | grep -E '\.(c|cpp|h|hpp)$' | grep -v -E '^(third_party|tests/planted|tools/mods)/' || true)
          echo "files: $(wc -w <<< "$all")"
          # clang-format, every file, in the tidy job's first shard
          if [ "$TASK" = tidy ] && [ "$SHARD" = 1 ]; then
            printf '%s\n' "$all" | xargs -n 64 "$NDK_BIN/clang-format" --dry-run --Werror
          fi

          # The compile databases, without precompiled headers (clang-tidy parses every unit from its sources), with the
          # generated headers the units include: the tidy job's the host build's (and the Android build's list of
          # sources, configured alone), tidy-android's the Android build's. clang-tidy finds the C++ library beside the
          # compiler a command names, and its per-target headers by the target's triple, so the host build names
          # LLVM's clang where it lives (/usr/lib/llvm-N/bin, not /usr/bin's links) and clang-tidy gets that clang's
          # triple, not its own default.
          if [ "$TASK" = tidy ]; then
            host_bin=$(dirname "$(readlink -f "$(command -v "$CXX")")")
            host_triple=$("$CXX" -print-target-triple)
            [ -x "$host_bin/clang++" ] || { echo "::error::no clang++ beside LLVM's clang in $host_bin"; exit 1; }
            CC="$host_bin/clang" CXX="$host_bin/clang++" cmake --preset host-debug -B build/tidy -DATLAS_TOOLS_DIR="$TOOLS" \
              -DATLAS_FUZZ=ON -DATLAS_BENCH=ON -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
            cmake --build build/tidy --target atlas_core_shaders
          fi
          (
            unset CC CXX CXXFLAGS LDFLAGS
            cmake --preset android-arm64 -B build/tidy-android -DATLAS_TOOLS_DIR="$TOOLS" -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
            if [ "$TASK" = tidy-android ]; then cmake --build build/tidy-android --target atlas_core_shaders; fi
          )
          compiled() { jq -r '.[].file' "$1/compile_commands.json" | sed "s#^$PWD/##" | sort -u; }
          host=
          if [ "$TASK" = tidy ]; then host=$(compiled build/tidy); fi
          android=$(compiled build/tidy-android)
          host_sources=()
          android_sources=()
          status=0
          for f in $(grep -E '\.(c|cpp)$' <<< "$all" || true); do
            in_host=no
            in_android=no
            if grep -q -x -F "$f" <<< "$host"; then host_sources+=("$f"); in_host=yes; fi
            if grep -q -x -F "$f" <<< "$android"; then android_sources+=("$f"); in_android=yes; fi
            if [ "$TASK" = tidy ] && [ "$SHARD" = 1 ] && [ "$in_host" = no ] && [ "$in_android" = no ]; then
              echo "::error file=$CP/$f::compiled by neither the host build nor the Android build, so clang-tidy cannot check it"
              status=1
            fi
          done
          keep="$RUNNER_TEMP/atlas-tidy"
          rm -rf "$keep"
          if [ "$TASK" = tidy ]; then
            python3 -I tools/tidy/cached.py --database build/tidy --clang-tidy "$NDK_BIN/clang-tidy" --cache ~/.cache/atlas-tidy \
              --keep "$keep" --part "$SHARD/$SHARDS" --extra-arg-before="--target=$host_triple" "${host_sources[@]}" || status=1
          else
            python3 -I tools/tidy/cached.py --database build/tidy-android --clang-tidy "$NDK_BIN/clang-tidy" \
              --cache ~/.cache/atlas-tidy --keep "$keep" --part "$SHARD/$SHARDS" "${android_sources[@]}" || status=1
          fi
          # The clean units' keys of this run, and no others, are what a push to app keeps.
          rm -rf ~/.cache/atlas-tidy && mkdir -p ~/.cache && mv "$keep" ~/.cache/atlas-tidy
          echo "kept=$(find ~/.cache/atlas-tidy -type f | wc -l)" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Keep the clean units' keys
        if: ${{ !cancelled() && steps.tidy.outputs.kept > 0 && env.KEEP_CACHES == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/atlas-tidy
          key: tidy-core-${{ matrix.task }}-${{ env.SHARD }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Delete the older keys' entries
        if: ${{ !cancelled() && steps.tidy.outputs.kept > 0 && env.KEEP_CACHES == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="tidy-core-$TASK-$SHARD-"
          key="$prefix${{ github.run_id }}-${{ github.run_attempt }}"
          # A deletion that fails leaves an older entry to GitHub's own eviction: a warning, not a failed check.
          ids=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$prefix" --limit 100 --json id,key \
            --jq ".[] | select(.key != \"$key\") | .id") || { echo "::warning::the caches could not be listed"; exit 0; }
          while read -r id; do
            [ -z "$id" ] || gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || echo "::warning::the entry $id was not deleted"
          done <<< "$ids"

      # ---- canaries: each guard must catch its planted failure (tests/planted/, never in a normal build). The builds
      # are host-debug's and host-tsan's, in their own folders (build/<preset>), with one planted test more, so their
      # ccache entries (restored above) give every other unit.
      - name: Planted failures are caught
        if: matrix.task == 'canaries'
        working-directory: ${{ env.CP }}
        run: |
          expect_failure() { # <log> <pattern> <command...>
            local log=$1 pattern=$2; shift 2
            if "$@" > "$log" 2>&1; then echo "::error::$* succeeded, but it must fail"; cat "$log"; exit 1; fi
            grep -q -E "$pattern" "$log" || { echo "::error::$* failed without '$pattern'"; cat "$log"; exit 1; }
            echo "caught: $(grep -m1 -E "$pattern" "$log")"
          }
          ccache --zero-stats > /dev/null
          cmake --preset host-debug -DATLAS_TOOLS_DIR="$TOOLS" -DATLAS_EXTRA_TEST_SOURCES="$PWD/tests/planted/use_after_free.cpp"
          cmake --build --preset host-debug --target atlas_tests -j 4
          expect_failure build/asan.log 'AddressSanitizer: heap-use-after-free' build/host-debug/atlas_tests -tc='planted*'
          cmake --preset host-tsan -DATLAS_TOOLS_DIR="$TOOLS" -DATLAS_EXTRA_TEST_SOURCES="$PWD/tests/planted/data_race.cpp"
          cmake --build --preset host-tsan --target atlas_tests -j 4
          # With the host jobs' suppressions, which must leave a race in the core's own code a failure.
          printf '%s\n' $ATLAS_TSAN_SUPPRESSIONS > "$RUNNER_TEMP/tsan.supp"
          export TSAN_OPTIONS="$TSAN_OPTIONS:suppressions=$RUNNER_TEMP/tsan.supp"
          expect_failure build/tsan.log 'ThreadSanitizer: data race' build/host-tsan/atlas_tests -tc='planted*'
          # The platform's sin in pymath's place (ATLAS_PLANTED_PLATFORM_SIN, which CMakeLists.txt defines for
          # base/pymath/fdlibm/Trig.cpp alone) must break pymath's check, whose total then differs from the port's
          # (plan-vector L0 d): host-debug's folder again without the planted use after free, so Trig.cpp alone compiles.
          cmake --preset host-debug -DATLAS_TOOLS_DIR="$TOOLS" -DATLAS_EXTRA_TEST_SOURCES= -DATLAS_PLANTED_PLATFORM_SIN=ON
          cmake --build --preset host-debug --target atlas_tests -j 4
          expect_failure build/sin.log 'FAIL expected' build/host-debug/atlas_tests -sf='*NumericsCheckTest*'
          ccache --show-stats
          # NDK r30's clang-tidy, the tidy job's, must name each planted call in a host unit (LLVM's libc++, std::__1,
          # through a compile database that names LLVM's clang as the tidy job's does) and in an Android one (the NDK's
          # sysroot and libc++, std::__ndk1).
          host_bin=$(dirname "$(readlink -f "$(command -v "$CXX")")")
          host_triple=$("$CXX" -print-target-triple)
          mkdir -p build/planted-tidy
          {
            echo '['
            sep=' '
            for f in tests/planted/transcendental.cpp tests/planted/min_max.cpp; do
              printf '%s{"directory": "%s", "file": "%s", "arguments": ["%s", "--target=%s", "-std=c++23", "-stdlib=libc++", "-c", "%s"]}\n' \
                "$sep" "$PWD" "$f" "$host_bin/clang++" "$host_triple" "$f"
              sep=,
            done
            echo ']'
          } > build/planted-tidy/compile_commands.json
          for planted in 'transcendental:is not bit-exact across libms' 'min_max:unlike Python min and max'; do
            name=${planted%%:*}
            expect_failure "build/tidy-$name-host.log" "${planted#*:}" \
              "$NDK_BIN/clang-tidy" -p build/planted-tidy "tests/planted/$name.cpp"
            expect_failure "build/tidy-$name-android.log" "${planted#*:}" \
              "$NDK_BIN/clang-tidy" "tests/planted/$name.cpp" -- -std=c++23 --target=aarch64-linux-android29
          done
          # Invalid SPIR-V stops the build (SPIRV-Tools' validator inside slangc), and so does an exact module that
          # uses an operation Vulkan does not round exactly (tools/nocontract).
          printf '%s\n' '[[vk::binding(0, 0)]] RWStructuredBuffer<uint> data;' '[shader("compute")] [numthreads(1, 1, 1)]' \
            'void main(uint3 id : SV_DispatchThreadID) { uint a = data[0]; data[1] = spirv_asm { result:$$uint = OpFAdd $a $a }; }' \
            > shaders/probe/planted_invalid.slang
          expect_failure build/spirv.log 'Validation of generated SPIR-V failed' cmake --build build/host-debug --target atlas_core_shaders
          rm shaders/probe/planted_invalid.slang
          printf '%s\n' '[[vk::binding(0, 0)]] RWStructuredBuffer<float> data;' '[shader("compute")] [numthreads(1, 1, 1)]' \
            'void main(uint3 id : SV_DispatchThreadID) { data[0] = sqrt(data[1]) / data[2]; }' > shaders/probe/exact_planted.slang
          expect_failure build/exact.log 'NOT EXACT' cmake --build build/host-debug --target atlas_core_shaders
          rm shaders/probe/exact_planted.slang
          # So does SV_VertexID, whose SPIR-V depends on the host that built it (cmake/Shaders.cmake).
          printf '%s\n' '[shader("vertex")]' \
            'float4 main(uint vertex : SV_VertexID) : SV_Position { return float4(float(vertex), 0.0f, 0.0f, 1.0f); }' \
            > shaders/probe/planted_vertex_id.slang
          expect_failure build/vertex-id.log 'SV_VertexID compiles to SPIR-V' cmake --build build/host-debug --target atlas_core_shaders
          rm shaders/probe/planted_vertex_id.slang
          # And so does a specialization constant, which no module of the core may hold (cmake/Shaders.cmake): PowerVR's
          # shader compiler crashed on a constant computed from one (SpvConstCalculated, VK bench, 17 October 2026). The
          # planted one has that kind too: PLANTED + 1 is an OpSpecConstantOp.
          printf '%s\n' '[[vk::constant_id(3)]] const int PLANTED = 2;' '[[vk::binding(0, 0)]] RWStructuredBuffer<int> data;' \
            '[shader("compute")] [numthreads(1, 1, 1)]' 'void main(uint3 id : SV_DispatchThreadID) { data[0] = PLANTED + 1; }' \
            > shaders/probe/planted_spec_constant.slang
          expect_failure build/spec-constant.log 'specialization constant instructions, and no module of the core may hold one' \
            cmake --build build/host-debug --target atlas_core_shaders
          grep -q 'OpSpecConstantOp' build/spec-constant.log || { echo "::error::the refusal does not name the OpSpecConstantOp"; cat build/spec-constant.log; exit 1; }
          rm shaders/probe/planted_spec_constant.slang
          # Every instruction of the pinned Slang's SPIR-V grammar that makes one is refused (tools/nocontract/grammar.hpp,
          # derived from the table Slang's compiler embeds), an extension's among them: SPV_INTEL_function_variants'
          # OpSpecConstantCapabilitiesINTEL passes slangc's own validation, and nocontract stops it.
          printf '%s\n' '[[vk::binding(0, 0)]] RWStructuredBuffer<int> data;' '[shader("compute")] [numthreads(1, 1, 1)]' \
            'void main(uint3 id : SV_DispatchThreadID) { data[0] = spirv_asm { OpCapability FunctionVariantsINTEL; OpCapability SpecConditionalINTEL; OpExtension "SPV_INTEL_function_variants"; result:$$bool = OpSpecConstantCapabilitiesINTEL 1; } ? 1 : 0; }' \
            > shaders/probe/planted_spec_capabilities.slang
          expect_failure build/spec-capabilities.log 'specialization constant instructions, and no module of the core may hold one' \
            cmake --build build/host-debug --target atlas_core_shaders
          grep -q 'OpSpecConstantCapabilitiesINTEL' build/spec-capabilities.log || { echo "::error::the refusal does not name the OpSpecConstantCapabilitiesINTEL"; cat build/spec-capabilities.log; exit 1; }
          rm shaders/probe/planted_spec_capabilities.slang
      # The configure alone, with neither the compiler launcher nor its cache (the namespace runs as root).
      - name: CMake configures with no network
        if: matrix.task == 'canaries'
        working-directory: ${{ env.CP }}
        run: |
          if sudo unshare --net -- curl -fsS -m 10 -o /dev/null https://github.com; then echo "::error::the namespace has a network"; exit 1; fi
          sudo -E env -u CMAKE_C_COMPILER_LAUNCHER -u CMAKE_CXX_COMPILER_LAUNCHER "PATH=$PATH" unshare --net -- \
            cmake --preset host-release -B /tmp/offline -DATLAS_TOOLS_DIR="$TOOLS"
          echo "configured with no network"

      # ---- android: the core, its tests and benchmarks with NDK r30 for both ABIs; the toolchain recorded.
      - name: Build with NDK r30 (arm64-v8a, x86_64) and record the toolchain
        id: ndk
        if: matrix.task == 'android'
        working-directory: ${{ env.CP }}
        run: |
          ccache --zero-stats > /dev/null
          unset CC CXX CXXFLAGS LDFLAGS
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            "$bin/clang" --version
            cat "$ndk/toolchains/llvm/prebuilt/linux-x86_64/clang_source_info.md" 2>/dev/null || true
            echo; echo "C++ feature macros of r30's clang and libc++ at -std=c++2c, aarch64-linux-android29:"
            echo '#include <version>' | "$bin/clang++" --target=aarch64-linux-android29 -std=c++2c -dM -E -x c++ - |
              grep -E '__cpp_|_LIBCPP_VERSION' | sort
          } | tee build-ndk-toolchain.txt
          for abi in arm64 x86_64; do
            cmake --preset "android-$abi" -DATLAS_TOOLS_DIR="$TOOLS"
            cmake --build --preset "android-$abi" -j 4
            "$bin/llvm-strings" "build/android-$abi/libatlasmap.so" | grep '^atlasmap ' | tee -a build-ndk-toolchain.txt
            "$bin/llvm-strip" -o "build/libatlasmap-$abi.stripped.so" "build/android-$abi/libatlasmap.so"
            ls -l "build/libatlasmap-$abi.stripped.so" | tee -a build-ndk-toolchain.txt
          done
          ccache --show-stats
      - name: Keep the NDK record
        if: matrix.task == 'android' && always()
        uses: actions/upload-artifact@v7
        with:
          name: core-ndk-r30
          path: ${{ env.CP }}/build-ndk-toolchain.txt
          if-no-files-found: ignore

      # ccache's entry, once the job's build is done: what this run's compilations used (the hits and the new units),
      # and nothing older, so the entry is one build's size however many runs came before. ccache marks a unit used by
      # its file's time.
      - name: Keep ccache's entry
        id: ccache_keep
        if: >-
          ${{ !cancelled() && env.KEEP_CACHES == 'true' && env.SHARD == '1' && (steps.build.outcome == 'success' ||
          steps.fuzz_build.outcome == 'success' || steps.ndk.outcome == 'success') }}
        run: |
          since=$(cat "$RUNNER_TEMP/ccache-since")
          ccache --evict-older-than "$(( $(date +%s) - since + 60 ))s"
          ccache --show-stats
      - if: steps.ccache_keep.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-core-${{ matrix.task }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Delete the job's older ccache entries
        if: steps.ccache_keep.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="ccache-core-$JOB-"
          key="$prefix${{ github.run_id }}-${{ github.run_attempt }}"
          # A deletion that fails leaves an older entry to GitHub's own eviction: a warning, not a failed check.
          ids=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$prefix" --limit 100 --json id,key \
            --jq ".[] | select(.key != \"$key\") | .id") || { echo "::warning::the caches could not be listed"; exit 0; }
          while read -r id; do
            [ -z "$id" ] || gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || echo "::warning::the entry $id was not deleted"
          done <<< "$ids"

  # Every host job's shards ran each of its ctest entries exactly once, in each of its runs (the plan each shard kept
  # against their JUnit files), and the cost table measured again from their times: the artifact ctest-costs holds it
  # (costs.tsv, to copy over tools/ctest/costs.tsv when the shards drift apart) and a table of each shard's seconds,
  # also in the run's summary.
  core-tests:
    needs: [core-changes, core]
    if: ${{ !cancelled() && needs.core.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.core-changes.outputs.sha || github.sha }}
          sparse-checkout: app/android/mapcore/cpp/tools/ctest
      - uses: actions/download-artifact@v8
        with:
          pattern: ctest-*
          path: ctest
          merge-multiple: true
      - name: Each entry once, and the costs measured again
        run: |
          mkdir -p measured
          python3 -I "$CP/tools/ctest/shards.py" costs --junit ctest --costs "$CP/tools/ctest/costs.tsv" \
            --into measured/costs.tsv --summary measured/summary.md
          { echo "### The host jobs' shards"; echo; cat measured/summary.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ctest-costs
          path: measured/

  # The MODS probe (plan-vector T3): do `import std` and Vulkan-Hpp's `import vulkan` build with NDK r30 for Android and
  # with LLVM 21 (NDK r30's major version) on the host, through Kitware's CMake 4.2.x? The answer and its errors are
  # kept as an artifact. By hand only, so it needs this file on the default branch.
  mods:
    if: github.event_name == 'workflow_dispatch' && inputs.mods
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Probe import std and import vulkan
        run: |
          pin() { grep "^$1=" app/android/mapcore/tools.properties | cut -d= -f2-; }
          version=$(pin mods.cmake.version); file=$(pin mods.cmake.linux-x86_64.file)
          curl -fsSLO "https://github.com/Kitware/CMake/releases/download/v$version/$file"
          echo "$(pin mods.cmake.linux-x86_64.sha256)  $file" | sha256sum -c -
          tar -xzf "$file" && export PATH="$PWD/${file%.tar.gz}/bin:$PATH"
          { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$(pin ndk.version)" > /dev/null
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends clang-21 libc++-21-dev libc++abi-21-dev ninja-build
          probe=$RUNNER_TEMP/mods
          app/android/mapcore/cpp/tools/mods/probe.sh cmake "$probe" "$ANDROID_HOME/ndk/$(pin ndk.version)" \
            -DCMAKE_CXX_COMPILER=clang++-21 -DCMAKE_CXX_FLAGS=-stdlib=libc++
          cat "$probe/summary.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-mods-probe
          path: |
            ${{ runner.temp }}/mods/*.log
            ${{ runner.temp }}/mods/*.txt

  # Whether a push to `app` changes the lavapipe image's recipe: then the image job rebuilds it, without the run by hand
  # that GitHub allows only once this file is on the default branch.
  image-changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/app'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2> /dev/null; then
            base=HEAD~1
          fi
          if git diff --quiet "$base" HEAD -- .github/docker/lavapipe; then changed=false; else changed=true; fi
          echo "the lavapipe image's recipe changed since $base: $changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  # The lavapipe images: built on a runner of each architecture from .github/docker/lavapipe, pushed to GHCR, and their
  # digests written to the run's summary, to be pinned in env above in a reviewed commit.
  lavapipe-image:
    needs: image-changes
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.image) || needs.image-changes.outputs.changed == 'true') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    # One build of each image at a time; a newer one waits instead of cancelling a build two hours in.
    concurrency:
      group: lavapipe-image-${{ matrix.arch }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      # Each architecture's image stands alone: a failure on one runner must not cancel the other's build.
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - name: Build and push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/atlas-lavapipe"
          mesa=$(sed -n 's/^ARG MESA_VERSION=//p' .github/docker/lavapipe/Dockerfile)
          tag="$image:mesa-$mesa-${{ matrix.arch }}"
          printf '%s' "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$tag" .github/docker/lavapipe
          docker push "$tag"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$tag")
          echo "LAVAPIPE_IMAGE_${{ matrix.arch == 'arm64' && 'ARM64' || 'X86_64' }}: '$digest'" | tee -a "$GITHUB_STEP_SUMMARY"
          # What the image holds and needs from the system (its VERSIONS.txt), for the reviewed commit that pins it.
          id=$(docker create "$tag" /none) && docker cp "$id:/opt/vulkan/VERSIONS.txt" - | tar -xO | tee -a "$GITHUB_STEP_SUMMARY"
