# The nightly alpha (the user, 23 October 2026): every night the latest commit of `app` that Core and Android built
# green on its push becomes the next alpha, when the app changed since the last one (.github/scripts/nightly-alpha.sh
# chooses). It is tagged v0.1.0-alpha.<n+1>, annotated with the commits since, and release.yml builds, signs and
# publishes it as it does an alpha tagged by hand. A tag pushed with the workflow's own token starts no workflow, so
# this one starts release.yml itself. Scheduled and dispatched workflows run from the default branch's file.
name: Nightly alpha

on:
  schedule:
    - cron: '47 3 * * *' # 03:47 UTC: after the night's CI (02:23), before the morning in Amsterdam
  workflow_dispatch:

permissions:
  contents: write # the tag
  actions: write # release.yml's dispatch

concurrency:
  group: nightly-alpha
  cancel-in-progress: false

jobs:
  alpha:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: app
          fetch-depth: 0
      - name: The latest green commit since the last alpha
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ runner.temp }}/alpha-notes.txt
        run: bash .github/scripts/nightly-alpha.sh
      # The guard (12 November 2026): an alpha never ships unable to read the places that are published. Alpha 32
      # (93c62f94) read store schema 4 alone while packs-latest still listed packs-20261104's places, of schema 3, so a
      # map downloaded in it said its places were unreadable (the user: "When I download the map in the latest alpha it
      # says places are unreadable"). Every packs release so far (packs-20261029 to packs-20261104, 7.27 GB each: places
      # 387 MB, windows 5.5 GB, tiles 1.37 GB) holds the Netherlands alone; regions.json's 7 others were never published.
      # The schemas the commit reads are its StoreSchema's VERSION and READS (the older ones it files anew).
      - name: It reads the published places
        if: steps.pick.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          gh release download packs-latest --repo "$GITHUB_REPOSITORY" --pattern packs.json --dir "$RUNNER_TEMP/published"
          git show "$SHA:app/android/search/src/main/kotlin/app/atlas/search/StoreSchema.kt" > "$RUNNER_TEMP/StoreSchema.kt"
          python3 - "$RUNNER_TEMP/published/packs.json" "$RUNNER_TEMP/StoreSchema.kt" "${SHA:0:7}" <<'PY'
          import json, re, sys
          packs, kt, sha = json.load(open(sys.argv[1])), open(sys.argv[2]).read(), sys.argv[3]
          version = int(re.search(r"const val VERSION\s*=\s*(\d+)", kt).group(1))
          also = re.search(r"val READS\b[^=]*=\s*setOf\(([^)]*)\)", kt)  # absent before 12 November: VERSION alone
          reads = {version if "VERSION" in x else int(x) for x in also.group(1).split(",")} if also else {version}
          def number(s):
              try: return int(float(s)) if float(s).is_integer() else None
              except (TypeError, ValueError): return None
          bad = []
          for p in packs.get("packs", []):
              for f in p.get("files", []):
                  if f.get("kind") != "places": continue
                  if f.get("schema") is None: print(f"::warning::{p['id']} ({p.get('release')}): its places name no schema"); continue
                  if number(f["schema"]) not in reads: bad.append(f"{p['id']} ({p.get('release')}): schema {f['schema']}")
          said = " and ".join(map(str, sorted(reads)))
          if bad:
              print(f"::error::{sha} reads place stores of schema {said}, but packs-latest publishes places it cannot read: "
                    + "; ".join(bad) + ". Republish the packs with this commit's packer (packs.yml), or let the app read "
                    "that schema (StoreSchema.READS in :search, with PlaceStore opening it).")
              sys.exit(1)
          print(f"{sha} reads schema {said}: every published places file is readable")
          PY
      - name: Tag it and release it
        if: steps.pick.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -F "$RUNNER_TEMP/alpha-notes.txt" "$SHA"
          git push origin "refs/tags/$TAG"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
          {
            echo "### $TAG from ${SHA:0:7}"
            cat "$RUNNER_TEMP/alpha-notes.txt"
          } >> "$GITHUB_STEP_SUMMARY"
