# Builds Atlas's offline packs and publishes them as GitHub release assets (free hosting that serves HTTP ranges).
# For each region of app/android/packs/regions.json, from Geofabrik's extract: the place store `:search` reads
# (`packer places`, gzipped SQLite) and the region pack the map and the features read (`packer pbf`, an `.atlas` file
# with the elements Overpass would give for the region: full tags, way geometry, multipolygons).
# The region pack covers the region's `atlas` box when regions.json gives one (a city, a district: "atlas": [w, s, e, n]),
# else its whole bbox when that is under 0.6 square degrees; a country-sized region without an `atlas` box gets none.
# The renders' own packs (the Python engine's extracts) are made by `packer renders` on the owner's Mac and published
# as the release packs-renders; the job renders adds their render packs there (the format-3 tiles the vector engine's
# core draws, `packer render-tiles`), with packs.json naming each beside its element pack.
# A run uploads to a dated release packs-YYYYMMDD, then writes packs.json there and to the fixed release packs-latest,
# which the app reads (PackCatalog in :tiles). A region whose build fails keeps its previous entry in packs.json.
name: Packs

on:
  workflow_dispatch:
    inputs:
      regions:
        description: Region ids from app/android/packs/regions.json, comma-separated (empty for all)
        required: false
        default: ''
      renders:
        description: "packs-renders' render packs: also (beside the regions), only (no region is built), or skip"
        required: false
        type: choice
        options: [also, only, skip]
        default: also
  # The monthly run (the 2nd at 02:17 UTC, once Geofabrik's extracts of the 1st are out) is off until the user says
  # go (21 October 2026): the workflow has never run, and its first run publishes every region's packs and the render
  # packs. To turn it on, restore:
  # schedule:
  #   - cron: '17 2 2 * *'

permissions:
  contents: write

concurrency:
  group: packs
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  USER_AGENT: Atlas-packs/1 (+https://github.com/atlas-maps-app/Atlas)
  RELEASE_NOTES: |
    Offline packs for Atlas, built by .github/workflows/packs.yml for the regions in app/android/packs/regions.json.
    packs.json lists every pack with its box, the time its OpenStreetMap data is current to, and its files with sizes
    and SHA-256 checksums; packs-latest always holds the newest list. A file over 2 GB comes in parts (.000, .001…)
    to be joined in order.

    Map data © OpenStreetMap contributors, under the Open Database Licence (ODbL 1.0):
    https://www.openstreetmap.org/copyright. The place stores (*.places.db.gz) are derived databases and are
    themselves available under the ODbL; the region packs (*.atlas) hold OpenStreetMap elements with their tags and
    geometry and are available under the ODbL as well. Extracts by Geofabrik (https://download.geofabrik.de).

jobs:
  plan:
    if: ${{ github.event.inputs.renders != 'only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Regions to build
        id: plan
        env:
          REGIONS: ${{ github.event.inputs.regions }}
        run: |
          set -euo pipefail
          FILE=app/android/packs/regions.json
          # shellcheck disable=SC2016 # jq's own variables, not the shell's
          WANT='($ids | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)))'
          UNKNOWN=$(jq -r --arg ids "${REGIONS:-}" "$WANT - [.regions[].id] | join(\",\")" "$FILE")
          if [ -n "$UNKNOWN" ]; then echo "::error::Unknown regions: $UNKNOWN"; exit 1; fi
          MATRIX=$(jq -c --arg ids "${REGIONS:-}" "$WANT as \$want
            | [.regions[] | select((\$want | length) == 0 or (.id as \$i | \$want | index(\$i) != null))
               | {id, name, url, country: (.country // \"\"), bbox: (.bbox | map(tostring) | join(\",\")), clip: (.clip // false),
                  atlas: ((.atlas // (if ((.bbox[2] - .bbox[0]) * (.bbox[3] - .bbox[1])) <= 0.6 then .bbox else null end)) // [] | map(tostring) | join(\",\"))}]" "$FILE")
          if [ "$(jq length <<< "$MATRIX")" -eq 0 ]; then echo "::error::No regions to build"; exit 1; fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "tag=packs-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "- \(.id): \(.name) from \(.url)"' <<< "$MATRIX" >> "$GITHUB_STEP_SUMMARY"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/notes.md"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "Offline packs ${TAG#packs-}" --notes-file "$RUNNER_TEMP/notes.md" --latest=false --target "$GITHUB_SHA"
          fi

  build:
    needs: plan
    name: ${{ matrix.region.id }}
    runs-on: ubuntu-latest
    # The runner's limits: 6 hours, 16 GB of memory, 14 GB of disk (more once the preinstalled tools are gone).
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        region: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      ID: ${{ matrix.region.id }}
      NAME: ${{ matrix.region.name }}
      PBF_URL: ${{ matrix.region.url }}
      BBOX: ${{ matrix.region.bbox }}
      CLIP: ${{ matrix.region.clip }}
      COUNTRY: ${{ matrix.region.country }}
      ATLAS_BOX: ${{ matrix.region.atlas }}
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK 37
        # Gradle configures every module of the build, the Android ones too
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Build the packer
        working-directory: app/android
        run: ./gradlew :packer:installDist --stacktrace
      - name: Make room
        run: |
          set -euo pipefail
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          # work on whichever disk has more room
          WORK="$RUNNER_TEMP/packs"
          if [ -d /mnt ] && [ "$(df --output=avail -B1 /mnt | tail -1)" -gt "$(df --output=avail -B1 "$RUNNER_TEMP" | tail -1)" ]; then
            sudo mkdir -p /mnt/packs && sudo chown "$(id -u):$(id -g)" /mnt/packs && WORK=/mnt/packs
          fi
          mkdir -p "$WORK/out"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          df -h / /mnt || true
      - name: Download the extract
        run: |
          set -euo pipefail
          PBF="$WORK/$ID.osm.pbf"
          for attempt in 1 2; do
            curl -fsSL --retry 5 --retry-delay 30 -A "$USER_AGENT" -o "$PBF" "$PBF_URL"
            curl -fsSL --retry 5 -A "$USER_AGENT" -o "$PBF.md5" "$PBF_URL.md5"
            # Geofabrik's checksum file names the file as published; compare the sums only
            if [ "$(cut -d' ' -f1 "$PBF.md5")" = "$(md5sum "$PBF" | cut -d' ' -f1)" ]; then break; fi
            # the extract may have been replaced between the two downloads
            if [ "$attempt" = 2 ]; then echo "::error::$PBF_URL does not match its MD5"; exit 1; fi
            sleep 60
          done
          ls -l "$PBF"
      - name: Places
        env:
          JAVA_OPTS: -Xmx10g
        run: |
          set -euo pipefail
          ARGS=(--name "$NAME")
          if [ "$CLIP" = "true" ]; then ARGS+=(--bbox "$BBOX"); fi
          app/android/packer/build/install/packer/bin/packer places "$WORK/$ID.osm.pbf" "$WORK/out/$ID.places.db" "${ARGS[@]}"
          df -h "$WORK"
      - name: Region pack
        env:
          JAVA_OPTS: -Xmx10g
        run: |
          set -euo pipefail
          if [ -z "$ATLAS_BOX" ]; then
            echo "- $ID: no region pack (the region is too big for one; give it an \"atlas\" box in regions.json)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ARGS=(--name "$NAME" --id "$ID" --out "$WORK/out/$ID.atlas")
          if [ -n "$COUNTRY" ]; then ARGS+=(--country "$COUNTRY"); fi
          app/android/packer/build/install/packer/bin/packer pbf "$WORK/$ID.osm.pbf" "$ATLAS_BOX" "${ARGS[@]}"
          app/android/packer/build/install/packer/bin/packer packinfo "$WORK/out/$ID.atlas" | tail -2
          rm -f "$WORK/$ID.osm.pbf"
          df -h "$WORK"
      - name: Upload
        run: |
          set -euo pipefail
          # files over 2 GB (GitHub's limit for an asset) go up in parts
          app/android/packer/build/install/packer/bin/packer manifest "$WORK/out" \
            "https://github.com/$GH_REPO/releases/download/$TAG" --regions app/android/packs/regions.json
          rm -f "$WORK/out/packs.json"
          ls -l "$WORK/out"
          gh release upload "$TAG" "$WORK"/out/"$ID".* --clobber
          jq -r '"- \(.id): " + ([.files[] | "\(.kind) \(.bytes / 1048576 | floor) MiB"] | join(", ")) + ", OSM data of \(.osm_timestamp // "?")"' \
            "$WORK/out/$ID.pack.json" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [plan, build]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Build the packer
        working-directory: app/android
        run: ./gradlew :packer:installDist --stacktrace
      - name: packs.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/entries" "$RUNNER_TEMP/previous"
          gh release download "$TAG" --pattern '*.pack.json' --dir "$RUNNER_TEMP/entries" || true
          gh release download packs-latest --pattern packs.json --dir "$RUNNER_TEMP/previous" || true
          ARGS=()
          if [ -s "$RUNNER_TEMP/previous/packs.json" ]; then ARGS+=(--previous "$RUNNER_TEMP/previous/packs.json"); fi
          app/android/packer/build/install/packer/bin/packer manifest "$RUNNER_TEMP/entries" \
            "https://github.com/$GH_REPO/releases/download/$TAG" --regions app/android/packs/regions.json \
            --out "$RUNNER_TEMP/packs.json" "${ARGS[@]}"
          if [ "$(jq '.packs | length' "$RUNNER_TEMP/packs.json")" -eq 0 ]; then echo "::error::No pack was built"; exit 1; fi
          jq -r '.packs[] | "- \(.id): \(.release), OSM data of \(.osm_timestamp // "?")"' "$RUNNER_TEMP/packs.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" "$RUNNER_TEMP/packs.json" --clobber
          if ! gh release view packs-latest > /dev/null 2>&1; then
            gh release create packs-latest --title "Offline packs: the latest list" --notes-file "$RUNNER_TEMP/notes.md" --latest=false --target "$GITHUB_SHA"
          fi
          gh release delete-asset packs-latest packs.json --yes 2> /dev/null || true
          gh release upload packs-latest "$RUNNER_TEMP/packs.json"
          gh release edit packs-latest --notes-file "$RUNNER_TEMP/notes.md"

  renders:
    # packs-renders' render packs (plan-vector K20a): the format-3 render tiles the vector engine's core draws, cut by the
    # core's stage P through `packer render-tiles --renders` from the release's own element packs (each fetched by the
    # packer and used only when its size and SHA-256 are the release's packs.json's), uploaded beside them as
    # <id>.render.atlas, and packs.json there rewritten with each one's size, SHA-256 and the element pack it was made
    # from. A region whose scene the render tiles cannot carry yet (refused, naming what it holds and the package that
    # adds it) gets no render pack and its reason as "render_gap", in packs.json and in the summary; once a package
    # teaches the format what the region holds, this job builds it with no change here. Builds are deterministic: only
    # render packs whose bytes changed go up, then packs.json if it changed. A region that loses its render pack drops out
    # of packs.json (the app reads only what the list names); its old file stays in the release, unused.
    if: ${{ github.event.inputs.renders != 'skip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RENDERS: packs-renders
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK 37 and the SDK's CMake
        # Gradle configures every module of the build, the Android ones too; the SDK's CMake and Ninja build the packer's
        # tool, at the version app/android/mapcore/tools.properties pins
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" \
            "cmake;$(grep '^cmake.version=' app/android/mapcore/tools.properties | cut -d= -f2-)" > /dev/null
      - name: Build the packer
        working-directory: app/android
        run: ./gradlew :packer:installDist --stacktrace
      - name: "The packer's tool: the core's stage P"
        # The render packs are cut by the core's stage P (mapcore/cpp/stagep), the code the phone builds its windows
        # with, as android.yml cuts the APK's bundled tiles: built alone (the host-stagep preset: no slangc, Vulkan or
        # HarfBuzz) with LLVM's clang and libc++ at core.yml's pin and the SDK's CMake and Ninja.
        run: |
          LLVM=$(grep -m1 "^  LLVM: '" .github/workflows/core.yml | cut -d"'" -f2) # NDK r30's major
          [ -n "$LLVM" ] || { echo "::error::core.yml names no LLVM version"; exit 1; }
          codename=$(lsb_release -cs)
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$LLVM main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-$LLVM lld-$LLVM libc++-$LLVM-dev libc++abi-$LLVM-dev
          cmake_bin="$ANDROID_HOME/cmake/$(grep '^cmake.version=' app/android/mapcore/tools.properties | cut -d= -f2-)/bin"
          cd app/android/mapcore/cpp
          CC=clang-$LLVM CXX=clang++-$LLVM CXXFLAGS=-stdlib=libc++ LDFLAGS=-stdlib=libc++ \
            "$cmake_bin/cmake" --preset host-stagep -DCMAKE_MAKE_PROGRAM="$cmake_bin/ninja"
          "$cmake_bin/cmake" --build --preset host-stagep
          echo "ATLAS_STAGEP=$PWD/build/host-stagep/atlas_stagep" >> "$GITHUB_ENV"
      - name: Render packs
        env:
          # the canal ring's scene is loaded whole, and again at each of its views' tolerances, one load at a time
          JAVA_OPTS: -Xmx8g
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/renders"
          mkdir -p "$R/previous" "$R/elements" "$R/out" "$R/work"
          echo "R=$R" >> "$GITHUB_ENV"
          gh release download "$RENDERS" --pattern packs.json --dir "$R/previous"
          app/android/packer/build/install/packer/bin/packer render-tiles --renders "$R/previous/packs.json" "$R/out" \
            --packs "$R/elements" --work "$R/work" --core "$ATLAS_STAGEP"
          ls -l "$R/out"
          {
            echo "### $RENDERS: render packs"
            jq -r '.packs[] | (.files | map(select(.kind == "atlas")) | first) as $e | (.files | map(select(.kind == "render")) | first) as $r
              | if $r then "- \(.id): \($r.name), \($r.bytes / 1024 | floor) KiB, \($r.bytes * 1000 / $e.bytes | round / 10) % of its element pack"
                else "- \(.id): no render pack: \(.render_gap // "the list gives no reason")" end' "$R/out/packs.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        run: |
          set -euo pipefail
          # the render packs first, then the list that names them; one whose SHA-256 the release's list gives is there
          jq -r '.packs[].files[] | select(.kind == "render") | "\(.name) \(.sha256)"' "$R/out/packs.json" | while read -r name sha; do
            had=$(jq -r --arg n "$name" '[.packs[].files[] | select(.kind == "render" and .name == $n) | .sha256] | first // ""' "$R/previous/packs.json")
            if [ "$had" = "$sha" ]; then
              echo "$name: unchanged"
            else
              gh release upload "$RENDERS" "$R/out/$name" --clobber
            fi
          done
          if [ "$(jq -S 'del(.generated)' "$R/out/packs.json")" = "$(jq -S 'del(.generated)' "$R/previous/packs.json")" ]; then
            echo "packs.json: unchanged"
          else
            gh release upload "$RENDERS" "$R/out/packs.json" --clobber
          fi
