# A tag v* builds the APK and publishes it as a GitHub release. A tag with "alpha" in it (v0.1.0-alpha.1) is the bench
# build published as a pre-release, for testing on real phones: not debuggable (a debuggable build ran the map 4 to 7
# times slower and kept the CPU busy at rest on the emulator, 16 October), with the timings overlay kept; any other tag
# is the release build. The APK is signed
# with the release key when the repository has it as secrets (ATLAS_KEYSTORE_BASE64, ATLAS_KEYSTORE_PASSWORD,
# ATLAS_KEY_ALIAS, ATLAS_KEY_PASSWORD), otherwise with the debug key, and the notes say which.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (must exist)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK 37, NDK r30 and the SDK's CMake
        # NDK r30 and the SDK's CMake build the map core (:mapcore), at the versions app/android/mapcore/tools.properties
        # pins; a tag from before the core has no such file and needs neither.
        run: |
          pins=mapcore/tools.properties # the job runs in app/android
          native=()
          if [ -f "$pins" ]; then
            native=("ndk;$(grep '^ndk.version=' "$pins" | cut -d= -f2-)" "cmake;$(grep '^cmake.version=' "$pins" | cut -d= -f2-)")
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" \
            "${native[@]}" > /dev/null
      - name: "The packer's tool: the core's stage P"
        # The APK's bundled tiles are cut by the core's stage P (mapcore/cpp/stagep), as android.yml's build job cuts
        # them: built alone (the host-stagep preset: no slangc, Vulkan or HarfBuzz) with LLVM's clang and libc++ at
        # core.yml's pin and the SDK's CMake and Ninja; :app's generateBundledTiles reads ATLAS_STAGEP. A tag from
        # before the tool has no stagep folder, and its packer cuts them as it did.
        run: |
          [ -d mapcore/cpp/stagep ] || exit 0
          LLVM=$(grep -m1 "^  LLVM: '" ../../.github/workflows/core.yml | cut -d"'" -f2) # NDK r30's major
          [ -n "$LLVM" ] || { echo "::error::core.yml names no LLVM version"; exit 1; }
          codename=$(lsb_release -cs)
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$LLVM main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-$LLVM lld-$LLVM libc++-$LLVM-dev libc++abi-$LLVM-dev
          cmake_bin="$ANDROID_HOME/cmake/$(grep '^cmake.version=' mapcore/tools.properties | cut -d= -f2-)/bin"
          cd mapcore/cpp
          CC=clang-$LLVM CXX=clang++-$LLVM CXXFLAGS=-stdlib=libc++ LDFLAGS=-stdlib=libc++ \
            "$cmake_bin/cmake" --preset host-stagep -DCMAKE_MAKE_PROGRAM="$cmake_bin/ninja"
          "$cmake_bin/cmake" --build --preset host-stagep
          echo "ATLAS_STAGEP=$PWD/build/host-stagep/atlas_stagep" >> "$GITHUB_ENV"
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ATLAS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"; echo "ATLAS_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"; fi
      - name: Build
        env:
          ATLAS_KEYSTORE_PASSWORD: ${{ secrets.ATLAS_KEYSTORE_PASSWORD }}
          ATLAS_KEY_ALIAS: ${{ secrets.ATLAS_KEY_ALIAS }}
          ATLAS_KEY_PASSWORD: ${{ secrets.ATLAS_KEY_PASSWORD }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          ATLAS_VERSION_CODE: ${{ github.run_number }}
        run: |
          export ATLAS_VERSION="${TAG#v}"
          case "$TAG" in *alpha*) TASK=assembleBench ;; *) TASK=assembleRelease ;; esac
          # :mapcorecheck's tests build the map core for this machine with LLVM's clang and libc++, which android.yml's
          # build job installs to run them on every push; a release leaves them out (a tag from before them has none).
          # So it does :likeness's: they draw the canal ring from its pack, which android.yml's build job fetches for its
          # likeness steps, and on CI a missing pack fails them.
          skip=()
          if [ -d mapcorecheck ]; then skip=(-x :mapcorecheck:test); fi
          if [ -d likeness ]; then skip+=(-x :likeness:testDebugUnitTest); fi
          ./gradlew test "$TASK" "${skip[@]}" --stacktrace
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in *alpha*) KIND=bench; PRE=--prerelease ;; *) KIND=release; PRE= ;; esac
          APK="app/build/outputs/apk/$KIND/atlas-${TAG}.apk"
          cp app/build/outputs/apk/$KIND/*.apk "$APK"
          SIGNED="signed with the Atlas release key"
          [ -n "$ATLAS_KEYSTORE" ] || SIGNED="signed with a debug key: install it fresh, later releases may need an uninstall first"
          printf '%s\n\nThe APK (%s build) is %s. The map is drawn by the Atlas engine from OpenStreetMap data (© OpenStreetMap contributors, ODbL); routing by BRouter.\n' \
            "$(git tag -l --format='%(contents)' "$TAG")" "$KIND" "$SIGNED" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$APK" --title "Atlas $TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag $PRE
