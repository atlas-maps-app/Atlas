org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
kotlin.daemon.jvmargs=-Xmx4g
# A dependency's fetch is tried 8 times, 2 s apart and doubling (about 4 min in all), where Gradle tries 3 times in
# about 3 s and then gives the repository up for the build: on 4 November Maven Central answered 429 Too Many Requests
# for a Robolectric artifact (CI's run 41771160319). Gradle tries again on a timeout, a dropped connection, 408, 429 and
# 5xx only.
systemProp.org.gradle.internal.repository.max.tentatives=8
systemProp.org.gradle.internal.repository.initial.backoff=2000
