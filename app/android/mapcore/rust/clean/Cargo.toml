# The buildings' cleaning for the core's stage P (src/lib.rs), linked into the core as a static library by
# cpp/cmake/Rust.cmake. The standard library only: a crate from the network is a fetch, and CMake never downloads.
[package]
name = "atlas_clean"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# the standard library, for the examples (the tests have it anyway); the library linked into the core is no_std
std = []

[[example]]
name = "footprints"
required-features = ["std"]

# Where a panic can come from in the library (a panic aborts the core's process, src/lib.rs), and what names it:
# - one written as one (a panic, an unwrap, an expect, a todo): the library has none, and clippy holds it so (the
#   lints below). A test's are allowed (../clippy.toml).
# - an index or a slice out of bounds, and an integer overflow (where the checks are on, as in the fuzz build) or a
#   division by zero, written as an operator: clippy's indexing_slicing and arithmetic_side_effects name each one,
#   and CI's tidy job lists them in its log and its summary and holds their count to the one kept below
#   (.github/scripts/rust-lint.sh).
# - what no lint names: a call into core or alloc that panics on its own, such as Vec::remove past the end (two in
#   src/clean.rs) and Iterator::sum that overflows under the fuzz build's checks (the i128 areas in src/arrange.rs and
#   src/clean.rs); a vector's capacity overflow; and an allocation that fails, which reaches the panic handler too.
[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"

# The places in the library where a panic can come unwritten, by lint, as CI's lint counts them
# (.github/scripts/rust-lint.sh): more fails, and so does fewer, which asks for the count here to be lowered with the
# change that took a place away.
[package.metadata.atlas.unwritten_panics]
indexing_slicing = 295
arithmetic_side_effects = 157

[profile.release]
# small and whole: one unit, LTO over the crate and the standard library it calls, no unwinding (a panic aborts, as
# the core's asserts do), no debug info
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "debuginfo"
overflow-checks = false
incremental = false

[profile.dev]
panic = "abort"

