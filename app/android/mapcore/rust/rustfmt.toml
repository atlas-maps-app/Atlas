# rustfmt for the core's Rust (each crate under mapcore/rust: rustfmt reads the nearest rustfmt.toml above a crate's
# files), as CI's tidy job checks it (.github/scripts/rust-lint.sh): the C++'s 120 columns (cpp/.clang-format), and
# what fits in them on one line kept on one line, as clang-format keeps it ("Max": a struct literal, a call, a chain
# is wrapped when it does not fit, not when it is longer than a share of the width); otherwise rustfmt's own style for
# the crate's edition.
max_width = 120
use_small_heuristics = "Max"
