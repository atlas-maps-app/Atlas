# The core's pinned tools (plan-vector T4, T6, T10), read by mapcore/build.gradle.kts (the fetch tasks), by
# cpp/cmake/Toolchains.cmake and by .github/workflows/core.yml. Each archive is checked against its SHA-256 (the
# digest GitHub publishes for the release asset) before it is unpacked. Changing a line here is a reviewed toolchain
# change: a new Slang reruns L2 and VK check, and changes the SPIR-V hashes in cpp/shaders/*/spirv.lock.

# Android's NDK r30 LTS and the SDK's CMake (installed by sdkmanager, which checks them itself).
ndk.version=30.0.16248370
cmake.version=4.1.2

# Slang, the shader compiler (github.com/shader-slang/slang, Apache-2.0 with LLVM exception).
slang.version=2026.19
slang.macos-aarch64.file=slang-2026.19-macos-aarch64.tar.gz
slang.macos-aarch64.sha256=fa46822c92d81404a7951de3746093985c1e6f520f4b533e2aa3bea576f0f2f0
slang.macos-x86_64.file=slang-2026.19-macos-x86_64.tar.gz
slang.macos-x86_64.sha256=490b6447e3ea6c8fa9dfc45b1dc227db7cf80a60981c4390ed0fdc8ddbedee11
slang.linux-x86_64.file=slang-2026.19-linux-x86_64-glibc-2.28.tar.gz
slang.linux-x86_64.sha256=bd7afcb0956dee9304f44ed115e9aaa7140704271b5c3294bcb237e3ae67adc7
slang.linux-aarch64.file=slang-2026.19-linux-aarch64.tar.gz
slang.linux-aarch64.sha256=eeefa4e52ca322cf3c037ee0d273b0ee68f4161fa422eda1bb704126073b69b4

# The Khronos validation layer's Android build, packaged into debug builds (github.com/KhronosGroup/Vulkan-ValidationLayers,
# Apache-2.0), from the same Vulkan SDK release as the vendored Vulkan-Headers.
vvl.version=1.4.363.0
vvl.android.file=android-binaries-1.4.363.0.zip
vvl.android.url=https://github.com/KhronosGroup/Vulkan-ValidationLayers/releases/download/vulkan-sdk-1.4.363.0/android-binaries-1.4.363.0.zip
vvl.android.sha256=9a3b8e32cb3330406dd4f3651594201635baee4528da8e2a5300e4f55e1a9cc7

